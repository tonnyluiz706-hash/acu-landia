<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acuílandia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }
        .game-wrapper {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }
        canvas {
            display: block;
            width: 800px;
            height: 400px;
            border-radius: 8px;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <!-- Nenhuma instrução de teclas visível -->
    </div>

    <script>
        // ============================================================
        //  1. CANVAS E CONTEXTO
        // ============================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const W = 800, H = 400;

        // ============================================================
        //  2. BACKGROUND (IMAGEM OU GRADIENTE)
        //     Para usar sua própria imagem:
        //       1. Descomente as linhas abaixo envolvendo 'backgroundImage'
        //       2. Substitua 'caminho/para/sua-imagem.jpg' pela URL da sua imagem
        //       3. Comente ou remova a função drawFallbackBackground() se preferir
        // ============================================================
        // const backgroundImage = new Image();
        // backgroundImage.src = 'caminho/para/sua-imagem.jpg';

        // Função de desenho do fundo (gradiente simples)
        function drawBackground() {
            // Se você tiver uma imagem, use o bloco abaixo:
            // if (backgroundImage.complete && backgroundImage.naturalWidth !== 0) {
            //     ctx.drawImage(backgroundImage, 0, 0, W, H);
            //     return;
            // }
            // Fallback: gradiente bonito
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a2a6c');
            grad.addColorStop(0.5, '#b21f1f');
            grad.addColorStop(1, '#fdbb2d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }

        // ============================================================
        //  3. CHÃO
        // ============================================================
        const CHAO_ALTURA = 60;
        const chaoY = H - CHAO_ALTURA;

        // ============================================================
        //  4. JOGADOR (QUADRADO)
        // ============================================================
        const player = {
            x: 100,
            y: chaoY - 40,
            w: 40,
            h: 40,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: -10,
            gravity: 0.5,
            onGround: false,
        };

        // ============================================================
        //  5. CONTROLE DE TECLAS
        // ============================================================
        const keys = { a: false, d: false, w: false };

        // ============================================================
        //  6. LÓGICA DO JOGO
        // ============================================================
        function update() {
            // Movimento horizontal
            if (keys.a) player.vx = -player.speed;
            else if (keys.d) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > W) player.x = W - player.w;

            // Pulo
            if (keys.w && player.onGround) {
                player.vy = player.jumpPower;
                player.onGround = false;
            }

            // Gravidade
            player.vy += player.gravity;
            player.y += player.vy;

            // Colisão com o chão
            if (player.y + player.h >= chaoY) {
                player.y = chaoY - player.h;
                player.vy = 0;
                player.onGround = true;
            } else {
                player.onGround = false;
            }
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);

            // 1. Fundo
            drawBackground();

            // 2. Chão
            ctx.fillStyle = '#4a7c59';
            ctx.fillRect(0, chaoY, W, CHAO_ALTURA);
            ctx.fillStyle = '#3b6e4a';
            ctx.fillRect(0, chaoY, W, 4);

            // 3. Jogador (quadrado)
            ctx.fillStyle = '#e74c3c';
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.strokeRect(player.x, player.y, player.w, player.h);

            // Olhos (detalhe)
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x + 8, player.y + 10, 8, 8);
            ctx.fillRect(player.x + 24, player.y + 10, 8, 8);
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(player.x + 10, player.y + 12, 4, 4);
            ctx.fillRect(player.x + 26, player.y + 12, 4, 4);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  7. EVENTOS DE TECLADO
        // ============================================================
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = true;
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = false;
            }
        });

        // ============================================================
        //  8. INICIAR
        // ============================================================
        gameLoop();
    </script>
</body>
</html>
