<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Acuílândia - Nível 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #000; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script>
        // ============================================
        // CONFIGURAÇÕES INICIAIS
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        const WORLD_WIDTH = 38000;
        let vidas = 5;
        const MAX_VIDAS = 9;
        let nivelConcluido = false;
        let gameOver = false;
        let isResizing = false;

        let tempoGlobal = 0;

        let checkpointX = 100;
        let checkpointY = 0;

        let temEspada = true;
        let atacando = false;
        let ataqueTimer = 0;
        const ALCANCE_ATAQUE = 120;
        const DURACAO_ATAQUE = 22;

        let jogadorAgarrado = null;
        let cooldownCipo = 0;

        // ============================================
        // ÁUDIO
        // ============================================
        const audioFundo = new Audio('fundo.mp3');
        audioFundo.loop = true;
        audioFundo.volume = 0.3;
        function tentarTocarAudio() { audioFundo.play().catch(() => {}); }
        window.addEventListener('load', tentarTocarAudio);
        document.addEventListener('keydown', tentarTocarAudio);
        document.addEventListener('click', tentarTocarAudio);

        // ============================================
        // IMAGENS
        // ============================================
        const bgImage = new Image();
        bgImage.src = 'Bacground.jpg';
        const imgPlataforma = new Image();
        imgPlataforma.src = 'plataforma.png';

        // ============================================
        // CHÃO E BURACOS
        // ============================================
        const CHAO_ALTURA = Math.floor(H * 0.15);
        let chaoY = H - CHAO_ALTURA;
        const PLAYER_SIZE = Math.min(W, H) * 0.045;
        const MOB_RADIUS = Math.min(W, H) * 0.025;

        const BURACOS = [
            { inicio: 5000, fim: 7000 },
            { inicio: 12000, fim: 14500 },
            { inicio: 20000, fim: 22500 },
            { inicio: 28000, fim: 30500 },
            { inicio: 34000, fim: 35500 }
        ];

        function estaSobreBuraco(x) {
            for (let buraco of BURACOS) {
                if (x + PLAYER_SIZE > buraco.inicio && x < buraco.fim) return true;
            }
            return false;
        }

        function ajustarPosicaoBuraco() {
            if (estaSobreBuraco(player.x)) {
                let menorDistancia = Infinity;
                let novaX = player.x;
                for (let buraco of BURACOS) {
                    if (player.x + player.w > buraco.inicio && player.x < buraco.fim) {
                        const distEsquerda = player.x - buraco.inicio;
                        const distDireita = buraco.fim - (player.x + player.w);
                        if (distEsquerda < menorDistancia) { menorDistancia = distEsquerda; novaX = buraco.inicio - player.w; }
                        if (distDireita < menorDistancia) { menorDistancia = distDireita; novaX = buraco.fim; }
                    }
                }
                player.x = Math.max(0, Math.min(novaX, WORLD_WIDTH - player.w));
            }
        }

        const platforms = [
            { x: 0, y: chaoY, width: 5000, height: CHAO_ALTURA },
            { x: 7000, y: chaoY, width: 5000, height: CHAO_ALTURA },
            { x: 14500, y: chaoY, width: 5500, height: CHAO_ALTURA },
            { x: 22500, y: chaoY, width: 5500, height: CHAO_ALTURA },
            { x: 30500, y: chaoY, width: 3500, height: CHAO_ALTURA },
            { x: 35500, y: chaoY, width: 2500, height: CHAO_ALTURA },
            { x: 1200, y: chaoY - 80 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 1700, y: chaoY - 140 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 8500, y: chaoY - 100 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 9000, y: chaoY - 160 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 15500, y: chaoY - 90 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 16000, y: chaoY - 150 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 23000, y: chaoY - 100 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 23500, y: chaoY - 160 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 31500, y: chaoY - 90 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 36000, y: chaoY - 100 - PLAYER_SIZE, width: 120, height: 20 }
        ];

        // ============================================
        // CANHÕES / ESTÁTUAS
        // ============================================
        const CANHOES = [
            { x: 2000, y: chaoY - 25, direcao: -1, cooldown: 60, cooldownMax: 150 },
            { x: 3500, y: chaoY - 25, direcao: 1, cooldown: 0, cooldownMax: 150 },
            { x: 8500, y: chaoY - 25, direcao: -1, cooldown: 90, cooldownMax: 160 },
            { x: 10500, y: chaoY - 25, direcao: 1, cooldown: 0, cooldownMax: 160 },
            { x: 15500, y: chaoY - 25, direcao: -1, cooldown: 30, cooldownMax: 140 },
            { x: 18000, y: chaoY - 25, direcao: 1, cooldown: 0, cooldownMax: 140 },
            { x: 23500, y: chaoY - 25, direcao: -1, cooldown: 60, cooldownMax: 170 },
            { x: 25500, y: chaoY - 25, direcao: 1, cooldown: 0, cooldownMax: 170 },
            { x: 31500, y: chaoY - 25, direcao: -1, cooldown: 40, cooldownMax: 150 },
            { x: 33000, y: chaoY - 25, direcao: 1, cooldown: 0, cooldownMax: 150 }
        ];

        let bolasDeFogo = [];

        // ============================================
        // PLATAFORMAS MÓVEIS
        // ============================================
        const PLATAFORMAS_MOVEIS = [
            { x: 13000, y: chaoY - 100, w: 110, h: 20, tipo: 'horizontal', minX: 12500, maxX: 14000, speed: 1.8, direction: 1 },
            { x: 21000, y: chaoY - 120, w: 110, h: 20, tipo: 'vertical', minY: chaoY - 200, maxY: chaoY - 60, speed: 1.5, direction: 1 },
            { x: 22000, y: chaoY - 100, w: 110, h: 20, tipo: 'vertical', minY: chaoY - 220, maxY: chaoY - 70, speed: 1.8, direction: -1 },
            { x: 29000, y: chaoY - 100, w: 110, h: 20, tipo: 'horizontal', minX: 28200, maxX: 30000, speed: 2.2, direction: 1 },
            { x: 34500, y: chaoY - 120, w: 110, h: 20, tipo: 'horizontal', minX: 34200, maxX: 35200, speed: 2.0, direction: 1 }
        ];

        // ============================================
        // PLATAFORMAS PODRES
        // ============================================
        const PLATAFORMAS_PODRES = [
            { x: 1300, y: chaoY - 60, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 4500, y: chaoY - 80, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 8500, y: chaoY - 60, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 10000, y: chaoY - 100, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 15000, y: chaoY - 80, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 17000, y: chaoY - 60, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 23000, y: chaoY - 60, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 25000, y: chaoY - 90, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 31000, y: chaoY - 70, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 },
            { x: 33000, y: chaoY - 100, w: 100, h: 20, tremendo: false, tempoPisada: 0, destruida: false, respawn: 0, alpha: 1 }
        ];

        // ============================================
        // CIPÓS - GERADOS PROGRAMATICAMENTE
        // ============================================
        // Para cada buraco, distribui N cipós igualmente
        function gerarCipos() {
            const result = [];
            const configuracao = [
                { inicio: 5000, fim: 7000, count: 5 },      // Buraco 1
                { inicio: 12000, fim: 14500, count: 5 },    // Buraco 2
                { inicio: 28000, fim: 30500, count: 5 },    // Buraco 4
                { inicio: 34000, fim: 35500, count: 4 }     // Buraco 5
            ];

            let idx = 0;
            for (let cfg of configuracao) {
                const largura = cfg.fim - cfg.inicio;
                const passo = largura / (cfg.count + 1);
                for (let i = 1; i <= cfg.count; i++) {
                    result.push({
                        ancoraX: cfg.inicio + passo * i,
                        ancoraY: chaoY - 400,
                        comprimento: 280,
                        angulo: 0,
                        anguloMax: 1.2,
                        velocidade: 0.045,
                        fase: (idx * 0.9) % (Math.PI * 2),
                        pontaX: 0,
                        pontaY: 0,
                        ocupado: false
                    });
                    idx++;
                }
            }
            return result;
        }

        const CIPOS = gerarCipos();

        // ============================================
        // MOEDAS
        // ============================================
        let moedas = 0;
        let moedasArray = [];

        function gerarMoedas() {
            moedasArray = [];
            const raioMoeda = 12;
            const espacamentoChao = 150;

            for (let x = 100; x < WORLD_WIDTH - 100; x += espacamentoChao) {
                if (estaSobreBuraco(x)) continue;
                let noChao = false;
                for (let plat of platforms) {
                    if (plat.y === chaoY && x > plat.x && x < plat.x + plat.width) { noChao = true; break; }
                }
                if (noChao) {
                    moedasArray.push({ x: x, y: chaoY - 15, raio: raioMoeda, coletada: false, fase: Math.random() * Math.PI * 2 });
                }
            }

            for (let plat of platforms) {
                if (plat.y !== chaoY) {
                    const xCentro = plat.x + plat.width / 2;
                    moedasArray.push({ x: xCentro, y: plat.y - 15, raio: raioMoeda, coletada: false, fase: Math.random() * Math.PI * 2 });
                }
            }
        }

        // ============================================
        // JOGADOR
        // ============================================
        const player = {
            x: 100, y: chaoY - PLAYER_SIZE,
            w: PLAYER_SIZE, h: PLAYER_SIZE,
            vx: 0, vy: 0,
            speed: 5, jumpPower: -10.5, gravity: 0.45,
            onGround: false,
            spawnX: 100, spawnY: chaoY - PLAYER_SIZE,
        };

        let ultimaDirecao = 1;

        // ============================================
        // MOBS
        // ============================================
        const mobs = [
            { x: 1500, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 6.0, minX: 1000, maxX: 2000, direction: 1, color: '#8a3a1a', stroke: '#5a1a00', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'terrestre', fase: 0 },
            { x: 7500, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 6.5, minX: 7000, maxX: 8200, direction: 1, color: '#9a4a2a', stroke: '#6a2a00', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'terrestre', fase: 1 },
            { x: 9500, y: chaoY - 130, radius: MOB_RADIUS, speed: 6.8, minX: 8500, maxX: 10500, direction: 1, color: '#6a3a7a', stroke: '#3a1a52', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'voador', amplitude: 60, fase: 0 },
            { x: 15000, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 7.0, minX: 14500, maxX: 16000, direction: 1, color: '#aa3a1a', stroke: '#7a1a00', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'terrestre', fase: 2 },
            { x: 18500, y: chaoY - 110, radius: MOB_RADIUS, speed: 7.2, minX: 17500, maxX: 19500, direction: 1, color: '#7a3a8a', stroke: '#4a1a5a', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'voador', amplitude: 65, fase: 1.5 },
            { x: 23500, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 7.5, minX: 23000, maxX: 24500, direction: 1, color: '#9a4a1a', stroke: '#6a2a00', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'terrestre', fase: 0.5 },
            { x: 26000, y: chaoY - 130, radius: MOB_RADIUS, speed: 7.8, minX: 25000, maxX: 27000, direction: 1, color: '#6a3a8a', stroke: '#3a1a5a', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'voador', amplitude: 70, fase: 2.5 },
            { x: 31500, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 8.0, minX: 31000, maxX: 32500, direction: 1, color: '#ba4a1a', stroke: '#8a2a00', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'terrestre', fase: 1 },
            { x: 36000, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 8.5, minX: 35600, maxX: 37000, direction: 1, color: '#aa3a2a', stroke: '#7a1a00', morto: false, hp: 2, knockbackX: 0, knockbackY: 0, emKnockback: false, tipo: 'terrestre', fase: 0 }
        ];

        function mobPodeAvancar(mob) {
            const proxX = mob.x + (mob.speed + 15) * mob.direction;
            if (proxX < mob.minX || proxX > mob.maxX) return false;
            for (let b of BURACOS) {
                if (proxX > b.inicio && proxX < b.fim) return false;
            }
            for (let c of CANHOES) {
                if (Math.abs(proxX - c.x) < 45) return false;
            }
            return true;
        }

        // ============================================
        // CHECKPOINTS
        // ============================================
        const checkpoints = [
            { x: 16500, y: chaoY - 40, w: 10, h: 40, ativado: false, tipo: 'bandeira' },
            { x: 31500, y: chaoY - 40, w: 10, h: 40, ativado: false, tipo: 'bandeira' }
        ];

        let cameraX = 0;
        const keys = { a: false, d: false, w: false, space: false };

        let matinhos = [];
        let nuvens = [];
        let particulasAmbiente = [];

        function inicializarCenario() {
            matinhos = [];
            for (let x = 0; x < WORLD_WIDTH; x += 30) {
                if (estaSobreBuraco(x)) continue;
                let noChao = false;
                for (let plat of platforms) {
                    if (plat.y === chaoY && x > plat.x && x < plat.x + plat.width) { noChao = true; break; }
                }
                if (noChao) {
                    matinhos.push({
                        x: x, altura: 8 + Math.random() * 8,
                        fase: Math.random() * Math.PI * 2,
                        cor: Math.random() > 0.5 ? '#5d9c6b' : '#4a7c59'
                    });
                }
            }

            nuvens = [];
            for (let i = 0; i < 40; i++) {
                nuvens.push({
                    x: Math.random() * W * 3,
                    y: 40 + Math.random() * (H * 0.35),
                    escala: 0.5 + Math.random() * 1.2,
                    velocidade: 0.15 + Math.random() * 0.3,
                    opacidade: 0.3 + Math.random() * 0.4
                });
            }

            particulasAmbiente = [];
            for (let i = 0; i < 60; i++) {
                particulasAmbiente.push({
                    x: Math.random() * W, y: Math.random() * H * 0.8,
                    vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.2,
                    tamanho: 1 + Math.random() * 2,
                    brilho: Math.random() * Math.PI * 2,
                    cor: Math.random() > 0.5 ? '#fff8c4' : '#c4e8ff'
                });
            }
        }

        function atualizarCenario() {
            for (let n of nuvens) {
                n.x -= n.velocidade;
                if (n.x < -300) {
                    n.x = W + 200 + Math.random() * 200;
                    n.y = 40 + Math.random() * (H * 0.35);
                }
            }
            for (let p of particulasAmbiente) {
                p.x += p.vx; p.y += p.vy; p.brilho += 0.05;
                if (p.x < -20) p.x = W + 20;
                if (p.x > W + 20) p.x = -20;
                if (p.y < -20) p.y = H * 0.85;
                if (p.y > H * 0.9) p.y = -20;
            }
        }

        function resetPlayer() {
            if (vidas <= 0) { gameOver = true; return; }
            let checkpointEncontrado = null;
            for (let cp of checkpoints) if (cp.ativado) checkpointEncontrado = cp;
            if (checkpointEncontrado) {
                player.x = checkpointX; player.y = checkpointY;
            } else {
                player.x = player.spawnX; player.y = player.spawnY;
            }
            player.vx = 0; player.vy = 0; player.onGround = false;
            jogadorAgarrado = null;
            cooldownCipo = 30;
            vidas--;
            if (vidas < 0) vidas = 0;
        }

        function checkCollisions() {
            for (let mob of mobs) {
                if (mob.morto || mob.emKnockback) continue;
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.w/2 + mob.radius) { resetPlayer(); return; }
            }
        }

        function checkBolasDeFogo() {
            for (let bola of bolasDeFogo) {
                const dx = (player.x + player.w/2) - bola.x;
                const dy = (player.y + player.h/2) - bola.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.w/2 + bola.raio) { resetPlayer(); return; }
            }
        }

        let particulas = [];

        function criarParticulas(x, y, quantidade, cor, velocidade, vida) {
            for (let i = 0; i < quantidade; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const vel = Math.random() * velocidade + 1;
                particulas.push({
                    x: x, y: y,
                    vx: Math.cos(angulo) * vel, vy: Math.sin(angulo) * vel - 1,
                    vida: vida || 30, vidaMax: vida || 30,
                    cor: cor,
                    tamanho: Math.random() * 6 + 3
                });
            }
        }

        function atualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.05; p.vx *= 0.98; p.vy *= 0.98;
                p.vida--;
                if (p.vida <= 0) particulas.splice(i, 1);
            }
        }

        function desenharParticulas() {
            for (let p of particulas) {
                const op = p.vida / p.vidaMax;
                ctx.globalAlpha = op;
                ctx.fillStyle = p.cor;
                ctx.shadowColor = p.cor;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x - cameraX, p.y, p.tamanho * op, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        function checkCheckpoints() {
            for (let cp of checkpoints) {
                if (cp.ativado) continue;
                if (player.x + player.w > cp.x && player.x < cp.x + cp.w + 30 &&
                    player.y + player.h > cp.y && player.y < cp.y + cp.h) {
                    cp.ativado = true;
                    checkpointX = player.x; checkpointY = player.y;
                    if (vidas < MAX_VIDAS) {
                        vidas++;
                        criarParticulas(player.x + player.w/2, player.y + player.h/2, 20, '#ff6b6b', 4, 30);
                    }
                }
            }
        }

        function executarAtaque() {
            if (!temEspada || atacando) return;
            atacando = true;
            ataqueTimer = 0;
            criarParticulas(player.x + player.w/2, player.y + player.h/2, 15, '#ffffff', 5, 10);
            for (let mob of mobs) {
                if (mob.morto) continue;
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                if (Math.sqrt(dx*dx + dy*dy) < ALCANCE_ATAQUE) {
                    mob.hp--;
                    if (mob.hp <= 0) {
                        mob.morto = true;
                        criarParticulas(mob.x, mob.y, 30, mob.color, 6, 40);
                        criarParticulas(mob.x, mob.y, 15, '#ffffff', 3, 20);
                    } else {
                        const forca = 20;
                        if (mob.tipo === 'voador') {
                            mob.knockbackX = ultimaDirecao * 25;
                            mob.knockbackY = 0;
                        } else {
                            mob.knockbackX = -mob.direction * forca;
                            mob.knockbackY = 0;
                        }
                        mob.emKnockback = true;
                    }
                }
            }
        }

        function restartGame() {
            gameOver = false; nivelConcluido = false;
            vidas = 5; moedas = 0; atacando = false;
            jogadorAgarrado = null;
            cooldownCipo = 0;
            checkpointX = player.spawnX; checkpointY = player.spawnY;
            particulas = [];
            bolasDeFogo = [];

            for (let cp of checkpoints) cp.ativado = false;
            for (let m of moedasArray) m.coletada = false;
            for (let pp of PLATAFORMAS_PODRES) { pp.destruida = false; pp.tremendo = false; pp.tempoPisada = 0; pp.respawn = 0; pp.alpha = 1; }
            for (let cip of CIPOS) cip.ocupado = false;
            for (let canhao of CANHOES) canhao.cooldown = canhao.cooldownMax;

            player.x = player.spawnX; player.y = player.spawnY;
            player.vx = 0; player.vy = 0; player.onGround = false;

            for (let i = 0; i < mobs.length; i++) {
                mobs[i].morto = false; mobs[i].direction = 1; mobs[i].hp = 2;
                mobs[i].knockbackX = 0; mobs[i].knockbackY = 0;
                mobs[i].emKnockback = false;
                mobs[i].fase = Math.random() * Math.PI * 2;
            }

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));
        }

        // ============================================
        // UPDATE
        // ============================================
        function update() {
            tempoGlobal++;
            atualizarCenario();

            if (nivelConcluido || isResizing || gameOver) return;

            // Cooldown para não re-agarrar cipó imediatamente
            if (cooldownCipo > 0) cooldownCipo--;

            // Física do jogador
            if (jogadorAgarrado) {
                player.x = jogadorAgarrado.pontaX - player.w/2;
                player.y = jogadorAgarrado.pontaY;
                player.vx = 0;
                player.vy = 0;
                player.onGround = false;
            } else {
                if (keys.a) { player.vx = -player.speed; ultimaDirecao = -1; }
                else if (keys.d) { player.vx = player.speed; ultimaDirecao = 1; }
                else player.vx = 0;

                player.x += player.vx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

                if (keys.w && player.onGround) { player.vy = player.jumpPower; player.onGround = false; }
                player.vy += player.gravity;
                player.y += player.vy;

                player.onGround = false;

                for (let plat of platforms) {
                    if (player.x + player.w > plat.x && player.x < plat.x + plat.width) {
                        if (player.vy >= 0 && player.y + player.h >= plat.y &&
                            player.y + player.h <= plat.y + plat.height + player.vy + 2) {
                            player.y = plat.y - player.h;
                            player.vy = 0; player.onGround = true;
                        }
                    }
                }

                for (let pp of PLATAFORMAS_PODRES) {
                    if (pp.destruida) continue;
                    if (player.x + player.w > pp.x && player.x < pp.x + pp.w) {
                        if (player.vy >= 0 && player.y + player.h >= pp.y &&
                            player.y + player.h <= pp.y + pp.h + player.vy + 2) {
                            player.y = pp.y - player.h;
                            player.vy = 0; player.onGround = true;
                            if (!pp.tremendo) {
                                pp.tremendo = true;
                                pp.tempoPisada = 0;
                            }
                        }
                    }
                }

                for (let pm of PLATAFORMAS_MOVEIS) {
                    if (player.x + player.w > pm.x && player.x < pm.x + pm.w) {
                        if (player.vy >= 0 && player.y + player.h >= pm.y &&
                            player.y + player.h <= pm.y + pm.h + player.vy + 2) {
                            player.y = pm.y - player.h;
                            player.vy = 0; player.onGround = true;
                        }
                    }
                }

                // Colisão com estátuas (pode subir em cima)
                for (let canhao of CANHOES) {
                    const topoY = canhao.y - 55;
                    const left = canhao.x - 25;
                    const right = canhao.x + 25;

                    if (player.x + player.w > left && player.x < right) {
                        if (player.vy >= 0 && player.y + player.h >= topoY &&
                            player.y + player.h <= topoY + 20 + player.vy) {
                            player.y = topoY - player.h;
                            player.vy = 0;
                            player.onGround = true;
                        }
                    }

                    if (player.y + player.h > topoY && player.y < chaoY) {
                        if (player.x + player.w > left && player.x < right) {
                            const distEsquerda = Math.abs(player.x + player.w - left);
                            const distDireita = Math.abs(right - player.x);
                            if (distEsquerda < distDireita) {
                                player.x = left - player.w;
                            } else {
                                player.x = right;
                            }
                        }
                    }
                }

                if (!player.onGround && player.vy > 0 && player.y > chaoY + 30) {
                    for (let buraco of BURACOS) {
                        if (player.x + player.w > buraco.inicio && player.x < buraco.fim) {
                            resetPlayer(); return;
                        }
                    }
                }
            }

            // Plataformas podres
            for (let pp of PLATAFORMAS_PODRES) {
                if (pp.destruida) {
                    pp.respawn++;
                    if (pp.respawn > 300) {
                        pp.destruida = false;
                        pp.tremendo = false;
                        pp.tempoPisada = 0;
                        pp.respawn = 0;
                        pp.alpha = 1;
                    }
                    continue;
                }
                if (pp.tremendo) {
                    pp.tempoPisada++;
                    pp.alpha = 1 - (pp.tempoPisada / 120) * 0.5;
                    if (pp.tempoPisada > 120) {
                        pp.destruida = true;
                        criarParticulas(pp.x + pp.w/2, pp.y + pp.h/2, 15, '#8a5a30', 4, 30);
                    }
                }
            }

            // Plataformas móveis
            for (let pm of PLATAFORMAS_MOVEIS) {
                if (pm.tipo === 'horizontal') {
                    pm.x += pm.speed * pm.direction;
                    if (pm.x > pm.maxX || pm.x < pm.minX) pm.direction *= -1;
                } else {
                    pm.y += pm.speed * pm.direction;
                    if (pm.y > pm.maxY || pm.y < pm.minY) pm.direction *= -1;
                }
            }

            // Cipós - atualiza posição da ponta
            for (let cip of CIPOS) {
                cip.fase += cip.velocidade;
                cip.angulo = Math.sin(cip.fase) * cip.anguloMax;
                cip.pontaX = cip.ancoraX + Math.sin(cip.angulo) * cip.comprimento;
                cip.pontaY = cip.ancoraY + Math.cos(cip.angulo) * cip.comprimento;
            }

            // Canhões disparam
            for (let canhao of CANHOES) {
                canhao.cooldown--;
                if (canhao.cooldown <= 0) {
                    bolasDeFogo.push({
                        x: canhao.x,
                        y: canhao.y,
                        vx: canhao.direcao * 5,
                        raio: 15,
                        vida: 200
                    });
                    canhao.cooldown = canhao.cooldownMax;
                }
            }

            // Bolas de fogo
            for (let i = bolasDeFogo.length - 1; i >= 0; i--) {
                const bola = bolasDeFogo[i];
                bola.x += bola.vx;
                bola.vida--;
                if (tempoGlobal % 3 === 0) {
                    particulas.push({
                        x: bola.x, y: bola.y,
                        vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1,
                        vida: 15, vidaMax: 15,
                        cor: Math.random() > 0.5 ? '#ff8c00' : '#ffcc00',
                        tamanho: 4 + Math.random() * 3
                    });
                }
                if (bola.x < cameraX - 200 || bola.x > cameraX + W + 200 || bola.vida <= 0) {
                    bolasDeFogo.splice(i, 1);
                }
            }

            // Mobs
            for (let mob of mobs) {
                if (mob.morto) continue;
                if (mob.knockbackX !== 0 || mob.knockbackY !== 0) {
                    mob.x += mob.knockbackX; mob.y += mob.knockbackY;
                    mob.knockbackX *= 0.85; mob.knockbackY *= 0.85;
                    if (Math.abs(mob.knockbackX) < 0.1) mob.knockbackX = 0;
                    if (Math.abs(mob.knockbackY) < 0.1) mob.knockbackY = 0;
                    if (mob.y > chaoY - mob.radius) { mob.y = chaoY - mob.radius; mob.knockbackY = 0; }
                    if (mob.knockbackX === 0 && mob.knockbackY === 0) mob.emKnockback = false;
                    if (mob.x < mob.minX) { mob.x = mob.minX; mob.direction = 1; mob.knockbackX = 0; mob.emKnockback = false; }
                    if (mob.x > mob.maxX) { mob.x = mob.maxX; mob.direction = -1; mob.knockbackX = 0; mob.emKnockback = false; }
                    continue;
                }

                if (mob.tipo === 'voador') {
                    mob.x += mob.speed * mob.direction;
                    if (mob.x > mob.maxX || mob.x < mob.minX) {
                        mob.direction *= -1;
                        if (mob.x < mob.minX) mob.x = mob.minX;
                        if (mob.x > mob.maxX) mob.x = mob.maxX;
                    }
                    mob.fase += 0.03;
                    mob.y = (chaoY - 100) + Math.sin(mob.fase) * mob.amplitude;
                } else {
                    if (!mobPodeAvancar(mob)) {
                        mob.direction *= -1;
                        continue;
                    }
                    mob.x += mob.speed * mob.direction;
                    if (mob.x > mob.maxX || mob.x < mob.minX) {
                        mob.direction *= -1;
                        if (mob.x < mob.minX) mob.x = mob.minX;
                        if (mob.x > mob.maxX) mob.x = mob.maxX;
                    }
                }
            }

            if (atacando) {
                ataqueTimer++;
                if (ataqueTimer > DURACAO_ATAQUE) atacando = false;
            }

            // Moedas
            for (let m of moedasArray) {
                if (m.coletada) continue;
                const dx = (player.x + player.w/2) - m.x;
                const dy = (player.y + player.h/2) - m.y;
                if (Math.sqrt(dx*dx + dy*dy) < m.raio + 20) {
                    m.coletada = true;
                    moedas++;
                    criarParticulas(m.x, m.y, 12, '#ffd700', 3, 20);
                    if (moedas >= 100) {
                        moedas -= 100;
                        if (vidas < MAX_VIDAS) {
                            vidas++;
                            criarParticulas(player.x + player.w/2, player.y, 25, '#ff6b6b', 5, 30);
                        }
                    }
                }
            }

            checkCollisions();
            checkBolasDeFogo();
            checkCheckpoints();

            if (player.x > 37000) nivelConcluido = true;

            atualizarParticulas();

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));
        }

        // ============================================
        // DESENHAR ORC
        // ============================================
        function desenharOrc(mx, my, mob) {
            const r = mob.radius;
            const walkCycle = tempoGlobal * 0.18 + mob.fase;
            const legSwing = Math.sin(walkCycle);
            const armSwing = -legSwing;
            const bodyBob = Math.abs(Math.cos(walkCycle)) * r * 0.06;
            const pele = mob.color;
            const peleEsc = mob.stroke;
            ctx.save();
            ctx.translate(mx, my + bodyBob);
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(0, r * 0.95 - bodyBob, r * 0.85, r * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();
            const legBaseY = r * 0.15;
            const legLen = r * 0.65;
            const legLeftY = legSwing * r * 0.12;
            const legRightY = -legSwing * r * 0.12;
            ctx.fillStyle = pele;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(-r * 0.32, legBaseY + legLen / 2 + legLeftY, r * 0.19, legLen / 2, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(r * 0.32, legBaseY + legLen / 2 + legRightY, r * 0.19, legLen / 2, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#3a2010';
            ctx.strokeStyle = '#1a0800';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(-r * 0.32, legBaseY + legLen + legLeftY, r * 0.27, r * 0.15, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(r * 0.32, legBaseY + legLen + legRightY, r * 0.27, r * 0.15, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#6b3a1a';
            ctx.strokeStyle = '#3a1a00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-r * 0.75, r * 0.2);
            ctx.lineTo(r * 0.75, r * 0.2);
            ctx.lineTo(r * 0.6, r * 0.55);
            ctx.lineTo(-r * 0.6, r * 0.55);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#2a1200';
            ctx.fillRect(-r * 0.78, r * 0.15, r * 1.56, r * 0.12);
            ctx.fillStyle = '#c9a961';
            ctx.beginPath();
            ctx.arc(0, r * 0.21, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#2a1200';
            ctx.beginPath();
            ctx.arc(0, r * 0.21, r * 0.045, 0, Math.PI * 2);
            ctx.fill();
            ctx.save();
            ctx.translate(-r * 0.72, -r * 0.35);
            ctx.rotate(armSwing * 0.35);
            ctx.fillStyle = pele;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, r * 0.35, r * 0.17, r * 0.4, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = peleEsc;
            ctx.beginPath();
            ctx.arc(0, r * 0.75, r * 0.21, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1a0800';
            ctx.stroke();
            ctx.restore();
            ctx.save();
            ctx.translate(r * 0.72, -r * 0.35);
            ctx.rotate(-armSwing * 0.35);
            ctx.fillStyle = pele;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, r * 0.35, r * 0.17, r * 0.4, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = peleEsc;
            ctx.beginPath();
            ctx.arc(0, r * 0.75, r * 0.21, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1a0800';
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = pele;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 2.5;
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.ellipse(0, -r * 0.15, r * 0.8, r * 0.68, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.4);
            ctx.lineTo(0, r * 0.05);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(-r * 0.28, -r * 0.28, r * 0.22, r * 0.14, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(r * 0.28, -r * 0.28, r * 0.22, r * 0.14, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#3a2010';

            ctx.lineWidth = 2;
            ctx.beginPath();

            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, -r * 0.78, r * 0.42, r * 0.24, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = pele;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 2;
            ctx.beginPath();

            ctx.fillStyle = '#fff';

            ctx.arc(r * 0.2, -r * 1.03, r * 0.03, 0, Math.PI * 2);

            ctx.ellipse(0, -r * 0.88, r * 0.1, r * 0.075, 0, 0, Math.PI * 2);

            ctx.strokeStyle = '#1a0800';

            ctx.moveTo(-r * 0.26, -r * 0.72);
