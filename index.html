<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Acuílândia</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            font-family: 'Pixelify Sans', monospace;
        }
        canvas { display: block; width: 100vw; height: 100vh; background: #000; }
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            user-select: none;
            background-image: url('Home.png');
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-color: #000;
        }
        #startBtn {
            font-family: 'Pixelify Sans', monospace;
            font-size: clamp(22px, 4vw, 32px); font-weight: 700; letter-spacing: 4px;
            color: #1a1a1a;
            padding: clamp(12px, 2vh, 18px) clamp(40px, 8vw, 70px);
            background: linear-gradient(180deg, #ffe066 0%, #f1c40f 50%, #c9a20a 100%);
            border: 4px solid #8a6a00; border-radius: 10px; cursor: pointer;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.7), 0 6px 0 #6a4a00, inset 0 2px 0 rgba(255, 255, 255, 0.5);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.15s;
        }
        #startBtn:hover { transform: translateY(-2px); filter: brightness(1.1);
            box-shadow: 0 0 40px rgba(241, 196, 15, 1), 0 8px 0 #6a4a00, inset 0 2px 0 rgba(255, 255, 255, 0.5); }
        #startBtn:active { transform: translateY(4px);
            box-shadow: 0 0 25px rgba(241, 196, 15, 0.7), 0 2px 0 #6a4a00, inset 0 2px 0 rgba(255, 255, 255, 0.5); }
        #cutscene {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 1500; overflow: hidden; display: none;
        }
        #cutsceneVideo {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transition: opacity 0.4s ease-in-out; z-index: 1;
        }
        #cutsceneText {
            position: absolute; bottom: 0; left: 0; width: 100%; background: #000; color: #ffffff;
            font-family: 'Pixelify Sans', monospace; font-size: 34px; font-weight: 700;
            text-align: center; line-height: 1.4; opacity: 0; transition: opacity 0.5s ease-in-out;
            z-index: 2; padding: 40px 20px; min-height: 20vh;
            display: flex; align-items: center; justify-content: center;
        }
        #boaSorte {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #f1c40f; font-family: 'Pixelify Sans', monospace; font-size: 140px; font-weight: 700;
            letter-spacing: 8px; text-align: center;
            text-shadow: 0 0 30px #f1c40f, 0 0 60px #f39c12, 0 0 100px #e67e22;
            opacity: 0; transition: opacity 0.8s ease-in-out; z-index: 3; user-select: none;
        }
        #cutsceneFade {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease-in-out; z-index: 10;
        }
        #skipBtn {
            position: absolute; top: 20px; right: 20px; z-index: 20;
            font-family: 'Pixelify Sans', monospace; font-size: 18px; font-weight: 700;
            letter-spacing: 2px; color: #ffffff; padding: 10px 22px;
            background: rgba(0, 0, 0, 0.6); border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 8px; cursor: pointer;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9); box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
            transition: background 0.15s, transform 0.1s, color 0.15s, border-color 0.15s;
            user-select: none;
        }
        #skipBtn:hover { background: rgba(241, 196, 15, 0.95); color: #1a1a1a;
            border-color: #f1c40f; transform: scale(1.05); text-shadow: none; }
        #skipBtn:active { transform: scale(0.97); }
        #skipBtn .tecla { display: inline-block; margin-left: 8px; padding: 2px 8px;
            border: 1px solid currentColor; border-radius: 4px; font-size: 14px; opacity: 0.85; }
        .conquista-toast {
            position: fixed; top: 20px; left: 50%; transform: translate(-50%, -250%);
            background: linear-gradient(135deg, #2a1f0a 0%, #4a3510 100%);
            border: 2px solid #f1c40f; border-radius: 12px; padding: 14px 22px;
            display: flex; align-items: center; gap: 14px; color: #fff;
            font-family: 'Pixelify Sans', monospace; z-index: 3000;
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.6), 0 8px 24px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
            opacity: 0; pointer-events: none; max-width: 90vw; min-width: 280px;
        }
        .conquista-toast.mostrar { transform: translate(-50%, 0); opacity: 1; }
        .conquista-icone { font-size: 36px; filter: drop-shadow(0 0 10px #f1c40f);
            animation: brilharIcone 1.5s ease-in-out infinite; }
        @keyframes brilharIcone {
            0%, 100% { filter: drop-shadow(0 0 8px #f1c40f); }
            50%      { filter: drop-shadow(0 0 18px #f1c40f) drop-shadow(0 0 30px #f39c12); }
        }
        .conquista-texto { display: flex; flex-direction: column; gap: 2px; }
        .conquista-titulo { font-size: 10px; color: #f1c40f; text-transform: uppercase;
            letter-spacing: 3px; opacity: 0.85; }
        .conquista-nome { font-size: 19px; font-weight: 700; color: #fff; }
        .conquista-desc { font-size: 12px; color: #d8d8d8; opacity: 0.9; }

        #pauseBtn {
            position: fixed; top: 20px; right: 20px; z-index: 900;
            font-family: 'Pixelify Sans', monospace; font-size: 16px; font-weight: 700;
            letter-spacing: 2px; color: #fff; padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7); border: 2px solid #f1c40f;
            border-radius: 8px; cursor: pointer; display: none;
            transition: all 0.15s; text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
        }
        #pauseBtn:hover { background: #f1c40f; color: #1a1a1a; transform: scale(1.05); text-shadow: none; }
        #pauseBtn:active { transform: scale(0.97); }
        #pauseBtn.visivel { display: block; }

        #pauseMenu {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.92); z-index: 2500;
            display: none; justify-content: center; align-items: center;
            padding: 20px; overflow: hidden;
        }
        #pauseMenu.aberto { display: flex; }

        .pause-content {
            max-width: 1000px; width: 100%; max-height: 92vh;
            background: linear-gradient(135deg, #1a1410 0%, #2a2018 100%);
            border: 3px solid #f1c40f; border-radius: 16px;
            padding: 28px; overflow-y: auto;
            box-shadow: 0 0 60px rgba(241, 196, 15, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            color: #fff; font-family: 'Pixelify Sans', monospace;
        }
        .pause-content::-webkit-scrollbar { width: 10px; }
        .pause-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.4); border-radius: 10px; }
        .pause-content::-webkit-scrollbar-thumb { background: #f1c40f; border-radius: 10px; }

        .pause-title {
            font-size: 44px; color: #f1c40f; text-align: center;
            margin-bottom: 6px; letter-spacing: 6px;
            text-shadow: 0 0 20px #f1c40f, 0 0 40px rgba(241, 196, 15, 0.5);
            font-weight: 700;
        }
        .pause-sub {
            text-align: center; font-size: 16px; color: #ccc;
            margin-bottom: 22px; letter-spacing: 2px;
        }
        .pause-sub span { color: #f1c40f; font-weight: 700; }

        .pause-stats {
            display: flex; justify-content: center; gap: 24px;
            margin-bottom: 24px; flex-wrap: wrap;
        }
        .pause-stat {
            text-align: center; padding: 12px 22px;
            background: rgba(0,0,0,0.4);
            border: 2px solid rgba(241, 196, 15, 0.4);
            border-radius: 10px; min-width: 100px;
        }
        .pause-stat-num {
            font-size: 26px; font-weight: 700; color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.6);
        }
        .pause-stat-label {
            font-size: 11px; color: #aaa; letter-spacing: 2px; margin-top: 4px;
        }

        .ach-section-title {
            font-size: 20px; color: #f1c40f; letter-spacing: 3px;
            margin: 20px 0 12px; padding-bottom: 8px;
            border-bottom: 2px solid rgba(241, 196, 15, 0.3);
            text-transform: uppercase; font-weight: 700;
        }
        .ach-section-title.locked { color: #888; border-color: rgba(120,120,120,0.3); }

        .ach-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 10px; margin-bottom: 10px;
        }
        .ach-item {
            display: flex; gap: 12px; padding: 10px 14px;
            background: rgba(0,0,0,0.4);
            border: 2px solid #555; border-radius: 10px;
            align-items: center; transition: transform 0.15s;
        }
        .ach-item:hover { transform: translateY(-2px); }
        .ach-item.desbloqueada {
            border-color: #f1c40f;
            background: linear-gradient(135deg, #2a1f0a 0%, #4a3510 100%);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.25);
        }
        .ach-icon {
            font-size: 30px;
            filter: grayscale(1) brightness(0.45);
            flex-shrink: 0;
        }
        .ach-item.desbloqueada .ach-icon {
            filter: drop-shadow(0 0 8px #f1c40f);
        }
        .ach-info { flex: 1; min-width: 0; }
        .ach-name {
            font-size: 15px; font-weight: 700; color: #777;
            margin-bottom: 3px; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .ach-item.desbloqueada .ach-name { color: #fff; }
        .ach-desc {
            font-size: 12px; color: #555; line-height: 1.3;
        }
        .ach-item.desbloqueada .ach-desc { color: #d8d8d8; }

        .pause-btn-row {
            display: flex; gap: 15px; justify-content: center;
            margin-top: 24px; padding-top: 20px;
            border-top: 2px solid rgba(241, 196, 15, 0.3);
            flex-wrap: wrap;
        }
        .pause-action {
            font-family: 'Pixelify Sans', monospace;
            font-size: 18px; font-weight: 700; letter-spacing: 2px;
            color: #1a1a1a; padding: 14px 36px;
            background: linear-gradient(180deg, #ffe066 0%, #f1c40f 50%, #c9a20a 100%);
            border: 3px solid #8a6a00; border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.5), 0 5px 0 #6a4a00, inset 0 2px 0 rgba(255,255,255,0.4);
            transition: all 0.1s;
        }
        .pause-action:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .pause-action:active { transform: translateY(3px); box-shadow: 0 0 20px rgba(241, 196, 15, 0.5), 0 2px 0 #6a4a00, inset 0 2px 0 rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <div id="startOverlay"><button id="startBtn">START</button></div>

    <div id="cutscene">
        <video id="cutsceneVideo" muted playsinline preload="auto"></video>
        <div id="cutsceneText"></div>
        <div id="boaSorte">BOA SORTE</div>
        <button id="skipBtn">SKIP <span class="tecla">ENTER</span></button>
        <div id="cutsceneFade"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <button id="pauseBtn">⏸ PAUSE (P)</button>

    <div id="pauseMenu">
        <div class="pause-content">
            <div class="pause-title">⏸ PAUSADO</div>
            <div class="pause-sub">Conquistas: <span id="pauseAchCount">0 / 31</span></div>
            
            <div class="pause-stats">
                <div class="pause-stat">
                    <div class="pause-stat-num" id="pauseMoedas">0</div>
                    <div class="pause-stat-label">MOEDAS</div>
                </div>
                <div class="pause-stat">
                    <div class="pause-stat-num" id="pauseVidas">5</div>
                    <div class="pause-stat-label">VIDAS</div>
                </div>
                <div class="pause-stat">
                    <div class="pause-stat-num" id="pauseNivel">1</div>
                    <div class="pause-stat-label">NÍVEL</div>
                </div>
            </div>

            <div id="achDesbloqueadas"></div>
            <div id="achBloqueadas"></div>

            <div class="pause-btn-row">
                <button class="pause-action" id="resumeBtn">▶ CONTINUAR</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONQUISTAS (31 no total)
        // ============================================
        const CONQUISTAS = {
            armado:         { nome: "Armado e Perigoso",     desc: "Conseguiu a espada mágica",               icone: "⚔️", desbloqueada: false },
            aprendiz:       { nome: "Aprendiz do Sábio",     desc: "Ouviu os conselhos do velho sábio",       icone: "🧙", desbloqueada: false },
            primeiroSangue: { nome: "Primeiro Sangue",       desc: "Derrotou seu primeiro inimigo",           icone: "🩸", desbloqueada: false },
            exterminador:   { nome: "Exterminador",          desc: "Derrotou TODOS os inimigos do jogo",      icone: "💀", desbloqueada: false },
            tarzan:         { nome: "Tarzan",                desc: "Se balançou no cipó 10 vezes",            icone: "🌿", desbloqueada: false },
            rico:           { nome: "Rico!",                 desc: "Coletou 100 moedas em uma jornada",       icone: "🪙", desbloqueada: false },
            perigo:         { nome: "Bem-vindo ao Perigo",   desc: "Chegou ao temido Nível 4",                icone: "☠️", desbloqueada: false },
            cacador:        { nome: "Caçador de Tesouros",   desc: "Coletou TODAS as moedas do jogo",         icone: "🏹", desbloqueada: false },
            lenda:          { nome: "Lenda de Acuílândia",   desc: "Zerou o jogo pela primeira vez",          icone: "👑", desbloqueada: false },
            sobrevivente:   { nome: "Sobrevivente",          desc: "Zerou o jogo sem perder nenhuma vida",    icone: "🛡️", desbloqueada: false },
            saltador:       { nome: "Saltador",              desc: "Pulou 100 vezes",                          icone: "🦘", desbloqueada: false },
            maratonista:    { nome: "Maratonista",           desc: "Percorreu 50.000 pixels no mundo",         icone: "🏃", desbloqueada: false },
            morceguicida:   { nome: "Caça-Morcegos",         desc: "Derrotou 15 morcegos voadores",            icone: "🦇", desbloqueada: false },
            invulneravel:   { nome: "Invulnerável",          desc: "Sobreviveu 90 segundos sem levar dano",    icone: "✨", desbloqueada: false },
            colecionador:   { nome: "Colecionador",          desc: "Coletou 500 moedas na vida",               icone: "💰", desbloqueada: false },
            magnata:        { nome: "Magnata",               desc: "Coletou 1500 moedas na vida",              icone: "💎", desbloqueada: false },
            esquivaPerfeita:{ nome: "Esquiva Perfeita",      desc: "Passou por 30 bolas de fogo dos canhões",  icone: "🔥", desbloqueada: false },
            cipoMestre:     { nome: "Mestre do Cipó",        desc: "Usou o cipó 50 vezes",                     icone: "🐒", desbloqueada: false },
            espadaMestre:   { nome: "Mestre da Espada",      desc: "Lançou a espada 20 vezes",                 icone: "🗡️", desbloqueada: false },
            carteiro:       { nome: "Leitor de Cartas",      desc: "Leu a carta misteriosa do velho amigo",    icone: "📜", desbloqueada: false },
            explorador:     { nome: "Explorador",            desc: "Ativou todos os checkpoints",              icone: "🚩", desbloqueada: false },
            bossSlayer:     { nome: "Matador de Deuses",     desc: "Derrotou o Morcego Ancestral",             icone: "🐲", desbloqueada: false },
            voando:         { nome: "Quase Voando",          desc: "Ficou 3 segundos no ar de uma vez",        icone: "🕊️", desbloqueada: false },
            semDano:        { nome: "Intocável",             desc: "Passou por perto de 5 espinhos sem morrer",icone: "🌵", desbloqueada: false },
            ninja:          { nome: "Ninja Silencioso",      desc: "Ficou 60 segundos sem atacar",             icone: "🥷", desbloqueada: false },
            velocista:      { nome: "Velocista",             desc: "Chegou ao nível 5 em menos de 3 minutos",  icone: "⚡", desbloqueada: false },
            curioso:        { nome: "Curioso",               desc: "Conversou com o sábio até o fim 3 vezes",  icone: "❓", desbloqueada: false },
            resistente:     { nome: "Resistente",            desc: "Perdeu 30 vidas no total",                 icone: "💪", desbloqueada: false },
            perfeito:       { nome: "Perfeição",             desc: "Terminou o jogo com 9 vidas cheias",       icone: "⭐", desbloqueada: false },
            mestre:         { nome: "Grão-Mestre",           desc: "Desbloqueou 25 conquistas",                icone: "🏆", desbloqueada: false },
            lendaViva:      { nome: "Lenda Viva",            desc: "Desbloqueou TODAS as conquistas",          icone: "🌟", desbloqueada: false }
        };

        let vidasPerdidasTotal = 0;
        let moedasColetadasTotal = 0;
        let cipoUsos = 0;
        let pulosTotal = 0;
        let distanciaTotal = 0;
        let ultimoXTracking = 100;
        let morcegosMortos = 0;
        let moedasTotaisVida = 0;
        let bolasEsquivadas = 0;
        let espadaLancamentos = 0;
        let tempoSemDano = 0;
        let tempoSemAtacar = 0;
        let espinhosPassados = 0;
        let tempoNoAr = 0;
        let tempoInicioJogo = 0;
        let sabioConversasTotal = 0;
        let jogoPausado = false;

        function contarConquistas() { let n = 0; for (let k in CONQUISTAS) if (CONQUISTAS[k].desbloqueada) n++; return n; }
        function totalConquistas() { return Object.keys(CONQUISTAS).length; }

        function desbloquearConquista(id) {
            const c = CONQUISTAS[id];
            if (!c || c.desbloqueada) return;
            c.desbloqueada = true;
            mostrarToastConquista(c.nome, c.desc, c.icone);
            if (contarConquistas() >= 25) desbloquearConquista('mestre');
            if (contarConquistas() >= totalConquistas()) desbloquearConquista('lendaViva');
        }
        function mostrarToastConquista(nome, desc, icone) {
            const toast = document.createElement('div');
            toast.className = 'conquista-toast';
            toast.innerHTML = `<div class="conquista-icone">${icone || '🏆'}</div>
                <div class="conquista-texto">
                    <div class="conquista-titulo">Conquista Desbloqueada!</div>
                    <div class="conquista-nome">${nome}</div>
                    <div class="conquista-desc">${desc}</div>
                </div>`;
            document.body.appendChild(toast);
            requestAnimationFrame(() => toast.classList.add('mostrar'));
            setTimeout(() => { toast.classList.remove('mostrar'); setTimeout(() => toast.remove(), 600); }, 4000);
        }

        // ============================================
        // ÁUDIO HOME
        // ============================================
        const GANHO_HOME = 2.0;
        const audioHome = new Audio('Home.mp3');
        audioHome.loop = true; audioHome.volume = 1.0; audioHome.preload = 'auto';
        let audioCtxHome = null, gainNodeHome = null, homeAudioSource = null, homeConectado = false;
        function conectarHomeNoGain() {
            if (homeConectado) return;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtxHome = new AC();
                homeAudioSource = audioCtxHome.createMediaElementSource(audioHome);
                gainNodeHome = audioCtxHome.createGain();
                gainNodeHome.gain.value = GANHO_HOME;
                homeAudioSource.connect(gainNodeHome);
                gainNodeHome.connect(audioCtxHome.destination);
                homeConectado = true;
            } catch (e) { homeConectado = true; }
        }
        function tocarHome() {
            conectarHomeNoGain();
            if (audioCtxHome && audioCtxHome.state === 'suspended') audioCtxHome.resume().catch(() => {});
            audioHome.play().catch(() => {});
        }
        window.addEventListener('load', tocarHome);

        // ============================================
        // CUTSCENE
        // ============================================
        const cutsceneTexts = [
            "Bem vindo ao reino de Acuílandia, um lugar pacífico e próspero. Até que...",
            "O grande rei orc apareceu",
            "Ele sequestrou a princesa",
            "E falou que se ela não se casar com ele, seu exército atacaria Acuílandia",
            "Sua missão será partir em uma jornada em busca da princesa e derrotar o rei orc"
        ];
        const cutsceneVideos = ['intro1.mp4','intro2.mp4','intro3.mp4','intro4.mp4','intro5.mp4'];
        let cutsceneIndex = 0, cutsceneIniciada = false, jogoIniciado = false, cutsceneEncerrada = false;
        const startOverlay = document.getElementById('startOverlay');
        const cutsceneDiv = document.getElementById('cutscene');
        const cutsceneVideo = document.getElementById('cutsceneVideo');
        const cutsceneText = document.getElementById('cutsceneText');
        const boaSorteDiv = document.getElementById('boaSorte');
        const cutsceneFade = document.getElementById('cutsceneFade');
        const skipBtn = document.getElementById('skipBtn');

        function iniciarCutscene() {
            if (cutsceneIniciada) return;
            cutsceneIniciada = true;
            startOverlay.style.display = 'none';
            cutsceneDiv.style.display = 'block';
            cutsceneIndex = 0; cutsceneEncerrada = false;
            tocarHome();
            playCutscene();
        }
        function playCutscene() {
            if (cutsceneEncerrada) return;
            if (cutsceneIndex >= cutsceneVideos.length) { mostrarBoaSorte(); return; }
            cutsceneFade.style.opacity = '0';
            cutsceneText.style.opacity = '0';
            cutsceneVideo.style.opacity = '0';
            let caiuNoTexto = false;
            const fallbackTexto = () => {
                if (caiuNoTexto || cutsceneEncerrada) return;
                caiuNoTexto = true;
                cutsceneVideo.style.opacity = '0';
                cutsceneText.textContent = cutsceneTexts[cutsceneIndex];
                cutsceneText.style.opacity = '1';
                setTimeout(() => { if (!caiuNoTexto || cutsceneEncerrada) return; avancarCutscene(); }, 3500);
            };
            cutsceneVideo.onerror = fallbackTexto;
            cutsceneVideo.oncanplay = () => { if (caiuNoTexto || cutsceneEncerrada) return; cutsceneVideo.style.opacity = '1'; };
            cutsceneVideo.src = cutsceneVideos[cutsceneIndex];
            cutsceneVideo.currentTime = 0; cutsceneVideo.muted = true;
            cutsceneVideo.load();

                    rotacao: Math.random() * Math.PI * 2, rotVel: (Math.random() - 0.5) * 0.06,
                    tamanho: 4 + Math.random() * 5,
                    cor: ['#d4a373', '#c9a227', '#a67c52', '#8b6f47', '#e0b567'][Math.floor(Math.random() * 5)],
                    oscilacao: Math.random() * Math.PI * 2
                });
            }
            borboletas = [];
            for (let i = 0; i < 5; i++) {
                borboletas.push({
                    x: Math.random() * W, y: 100 + Math.random() * (H * 0.5),
                    fase: Math.random() * Math.PI * 2, tamanho: 6 + Math.random() * 4,
                    cor: ['#ff9ec4', '#ffd670', '#a4d8ff', '#c4ffb0'][Math.floor(Math.random() * 4)],
                    vel: 0.3 + Math.random() * 0.4,
                    raioX: 40 + Math.random() * 60, raioY: 20 + Math.random() * 30,
                    centroX: Math.random() * W, centroY: 100 + Math.random() * (H * 0.5)
                });
            }
        }
        function atualizarCenario() {
            for (let n of nuvens) {
                n.x -= n.velocidade;
                if (n.x < -300) { n.x = W + 200 + Math.random() * 200; n.y = 40 + Math.random() * (H * 0.35); }
            }
            for (let p of particulasAmbiente) {
                p.x += p.vx; p.y += p.vy; p.brilho += 0.05;
                if (p.x < -20) p.x = W + 20;
                if (p.x > W + 20) p.x = -20;
                if (p.y < -20) p.y = H * 0.85;
                if (p.y > H * 0.9) p.y = -20;
            }
            for (let f of folhas) {
                f.oscilacao += 0.03;
                f.x += f.vx + Math.sin(f.oscilacao) * 0.6;
                f.y += f.vy; f.rotacao += f.rotVel;
                if (f.y > H + 20) { f.y = -20; f.x = Math.random() * W; }
                if (f.x < -20) f.x = W + 20;
            }
            for (let b of borboletas) {
                b.fase += 0.02 * b.vel;
                b.x = b.centroX + Math.cos(b.fase) * b.raioX;
                b.y = b.centroY + Math.sin(b.fase * 1.3) * b.raioY;
                if (b.centroX < cameraX - 200) {
                    b.centroX = cameraX + W + 200 + Math.random() * 200;
                    b.centroY = 100 + Math.random() * (H * 0.5);
                }
                if (b.centroX > cameraX + W + 400) b.centroX = cameraX - 200;
            }
        }

        function resetPlayer() {
            if (vidas <= 0) { gameOver = true; return; }
            let checkpointEncontrado = null;
            for (let cp of checkpoints) if (cp.ativado) checkpointEncontrado = cp;
            if (checkpointEncontrado) { player.x = checkpointX; player.y = checkpointY; }
            else { player.x = player.spawnX; player.y = player.spawnY; }
            player.vx = 0; player.vy = 0; player.onGround = false;
            jogadorAgravado = null; cooldownCipo = 30;
            vidas--; vidasPerdidasTotal++;
            if (vidas < 0) vidas = 0;
            mostrarTitulo = true; contadorTitulo = 0;
            atacando = false; ataqueTimer = 0;
            segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0;
            playerSquash = 0;
            tempoSemDano = 0;
        }
        function checkCollisions() {
            for (let mob of mobs) {
                if (mob.morto || mob.emKnockback) continue;
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.w/2 + mob.radius) { resetPlayer(); return; }
            }
        }
        function checkEspinhos() {
            for (let espinho of ESPINHOS) {
                if (player.x + player.w > espinho.x && player.x < espinho.x + espinho.w &&
                    player.y + player.h > espinho.y && player.y < espinho.y + espinho.h) {
                    resetPlayer(); return;
                }
            }
        }
        function checkBolasDeFogo() {
            for (let bola of bolasDeFogo) {
                const dx = (player.x + player.w/2) - bola.x;
                const dy = (player.y + player.h/2) - bola.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.w/2 + bola.raio) { resetPlayer(); return; }
            }
        }
        function criarParticulas(x, y, quantidade, cor, velocidade, vida) {
            for (let i = 0; i < quantidade; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const vel = Math.random() * velocidade + 1;
                particulas.push({
                    x: x, y: y,
                    vx: Math.cos(angulo) * vel, vy: Math.sin(angulo) * vel - 1,
                    vida: vida || 30, vidaMax: vida || 30, cor: cor,
                    tamanho: Math.random() * 6 + 3
                });
            }
        }
        function atualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.05; p.vx *= 0.98; p.vy *= 0.98;
                p.vida--;
                if (p.vida <= 0) particulas.splice(i, 1);
            }
        }
        function checkCheckpoints() {
            for (let cp of checkpoints) {
                if (cp.ativado) continue;
                if (player.x + player.w > cp.x && player.x < cp.x + cp.w + 30 &&
                    player.y + player.h > cp.y && player.y < cp.y + cp.h) {
                    cp.ativado = true;
                    checkpointX = player.x; checkpointY = player.y;
                    if (vidas < MAX_VIDAS) {
                        vidas++;
                        criarParticulas(player.x + player.w/2, player.y + player.h/2, 20, '#ff6b6b', 4, 30);
                    }
                }
            }
        }
        function iniciarConversa() {
            if (sabio.conversaTerminada || !checkpoints[0].ativado || sabio.conversaAtiva) return;
            sabio.conversaAtiva = true;
            sabio.falaIndex = 0; sabio.timer = 0; sabio.esperandoProxima = false;
            barreiraAtiva = true;
            barreiraX = sabio.x + sabio.largura/2 - (sabio.largura * 4) / 2;
            desbloquearConquista('aprendiz');
        }
        function avancarConversa() {
            sabio.falaIndex++;
            if (sabio.falaIndex >= sabio.falas.length) {
                sabio.conversaTerminada = true; sabio.conversaAtiva = false;
                temEspada = true; barreiraAtiva = false;
                sabio.desaparecendo = true;
                sabioConversasTotal++;
                desbloquearConquista('armado');
                if (sabioConversasTotal >= 3) desbloquearConquista('curioso');
                return;
            }
            sabio.timer = 0; sabio.esperandoProxima = false;
        }
        function updateConversa() {
            if (!sabio.conversaAtiva || sabio.conversaTerminada) return;
            const dx = (player.x + player.w/2) - (sabio.x + sabio.largura/2);
            const dy = (player.y + player.h/2) - (sabio.y + sabio.altura/2);
            if (Math.sqrt(dx*dx + dy*dy) > 200) return;
            if (!sabio.esperandoProxima) {
                sabio.timer++;
                if (sabio.timer > 120) avancarConversa();
            }
        }

        function executarAtaque() {
            if (!temEspada || espadaLancada) return;
            atacando = true; ataqueTimer = 0;
            tempoSemAtacar = 0;
            criarParticulas(player.x + player.w/2, player.y + player.h/2, 15, '#ffffff', 5, 10);
            for (let mob of mobs) {
                if (mob.morto) continue;
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                if (Math.sqrt(dx*dx + dy*dy) < ALCANCE_ATAQUE) {
                    mob.hp--;
                    if (mob.hp <= 0) {
                        criarMorteAnim(mob);
                        mob.morto = true;
                        criarParticulas(mob.x, mob.y, 30, mob.color, 6, 40);
                        criarParticulas(mob.x, mob.y, 15, '#ffffff', 3, 20);
                        if (mob.tipo === 'voador') morcegosMortos++;
                        desbloquearConquista('primeiroSangue');
                        let todosMortos = true;
                        for (let mm of mobs) if (!mm.morto) { todosMortos = false; break; }
                        if (todosMortos) desbloquearConquista('exterminador');
                    } else {
                        const forca = 20;
                        mob.hitFlash = 12;
                        if (mob.tipo === 'voador') { mob.knockbackX = ultimaDirecao * 25; mob.knockbackY = 0; }
                        else { mob.knockbackX = -mob.direction * forca; mob.knockbackY = 0; }
                        mob.emKnockback = true;
                    }
                }
            }
            if (boss.ativo && !boss.morto) {
                for (let m of boss.morcegos) {
                    if (m.morto) continue;
                    const dx = (player.x + player.w/2) - m.x;
                    const dy = (player.y + player.h/2) - m.y;
                    if (Math.sqrt(dx*dx + dy*dy) < ALCANCE_ATAQUE) {
                        criarMorteAnim(m);
                        m.morto = true;
                        criarParticulas(m.x, m.y, 20, m.color, 5, 30);
                        morcegosMortos++;
                    }
                }
            }
        }

        function invocarMorcegos(qtd) {
            for (let i = 0; i < qtd; i++) {
                const ang = (Math.PI * 2 / qtd) * i;
                boss.morcegos.push({
                    x: boss.x + Math.cos(ang) * 120,
                    y: boss.y + Math.sin(ang) * 60,
                    radius: 22, speed: 2.8,
                    color: '#5d4a7a', stroke: '#3d2e52',
                    morto: false, fase: Math.random() * Math.PI * 2,
                    hitFlash: 0, dartFase: 0, dartX: 0, dartY: 0, dartTimer: 0
                });
            }
        }

        function restartGame() {
            gameOver = false; nivelConcluido = false; nivelAtual = 1;
            vidas = 5; moedas = 0; temEspada = false; atacando = false;
            vidasPerdidasTotal = 0;
            sabio.conversaAtiva = false; sabio.conversaTerminada = false;
            sabio.falaIndex = 0; sabio.timer = 0; sabio.esperandoProxima = false;
            sabio.alpha = 1; sabio.desaparecendo = false;
            barreiraAtiva = false; barreiraX = 0;
            jogadorAgravado = null; cooldownCipo = 0;
            checkpointX = player.spawnX; checkpointY = player.spawnY;
            mostrarTitulo = true; mostrarTituloNivel2 = false; mostrarTituloNivel3 = false; mostrarTituloNivel4 = false;
            contadorTitulo = 0; contadorTituloNivel2 = 0; contadorTituloNivel3 = 0; contadorTituloNivel4 = 0;
            particulas = []; bolasDeFogo = []; morteAnims = [];
            for (let cp of checkpoints) cp.ativado = false;
            for (let m of moedasArray) m.coletada = false;
            for (let pp of PLATAFORMAS_PODRES) { pp.destruida = false; pp.tremendo = false; pp.tempoPisada = 0; pp.respawn = 0; pp.alpha = 1; }
            for (let cip of CIPOS) cip.ocupado = false;
            for (let canhao of CANHOES) { canhao.cooldown = canhao.cooldownMax; canhao.recoil = 0; canhao.fireGlow = 0; }
            for (let esp of ESPINHOS) esp._contado = false;
            player.x = player.spawnX; player.y = player.spawnY;
            player.vx = 0; player.vy = 0; player.onGround = false;
            playerSquash = 0;
            for (let i = 0; i < mobs.length; i++) {
                mobs[i].morto = false; mobs[i].direction = 1; mobs[i].hp = 2;
                mobs[i].knockbackX = 0; mobs[i].knockbackY = 0;
                mobs[i].emKnockback = false;
                mobs[i].fase = Math.random() * Math.PI * 2;
                mobs[i].walkPhase = Math.random() * Math.PI * 2;
                mobs[i].hitFlash = 0; mobs[i].aggro = 0; mobs[i].dustTimer = 0;
            }
            espadaLancada = null; segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0;
            podeLancarEspada = false;
            carta.ativa = false; carta.caiu = false; carta.coletada = false;
            passaroCarta.ativo = false; passaroCarta.soltou = false;
            boss.ativo = false; boss.morto = false; boss.fase = 'inativo'; boss.timer = 0;
            boss.hp = boss.hpMax; boss.bolasFogo = []; boss.morcegos = [];
            boss.invocacoesFeitas = [false, false];
            boss.cooldownTiro = 180; boss.carregando = 0; boss.bocaAberta = 0;
            boss.flutuacaoOffset = 0; boss.rotacaoCorpo = 0; boss.hitFlash = 0;
            fadeFinal = 0; finalIniciado = false;
            mostrarTituloNivel5 = false; contadorTituloNivel5 = 0;
            dialogo.ativo = false; dialogo.index = 0; dialogo.timer = 0;
            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));
            tempoSemDano = 0;
            tempoSemAtacar = 0;
            tempoNoAr = 0;
            tempoInicioJogo = performance.now();
            ultimoXTracking = player.x;
            jogoPausado = false;
            pauseMenu.classList.remove('aberto');
        }

        function atualizarNivel() {
            if (nivelAtual === 1 && player.x > 6200) { nivelAtual = 2; mostrarTituloNivel2 = true; contadorTituloNivel2 = 0; }
            if (nivelAtual === 2 && player.x > 9500) { nivelAtual = 3; mostrarTituloNivel3 = true; contadorTituloNivel3 = 0; }
            if (nivelAtual === 3 && player.x > 48000) { nivelAtual = 4; mostrarTituloNivel4 = true; contadorTituloNivel4 = 0; desbloquearConquista('perigo'); }
            if (nivelAtual === 4 && player.x > 85000) {
                nivelAtual = 5;
                mostrarTituloNivel5 = true; contadorTituloNivel5 = 0;
                const tempoDecorrido = (performance.now() - tempoInicioJogo) / 1000;
                if (tempoDecorrido < 180) desbloquearConquista('velocista');
                if (!passaroCarta.ativo && !carta.coletada) {
                    passaroCarta.ativo = true;
                    passaroCarta.x = player.x + 1000;
                    passaroCarta.y = chaoY - 400;
                    passaroCarta.fase = 0; passaroCarta.soltou = false; passaroCarta.saiu = false;
                }
            }
        }

        function update() {
            tempoGlobal++;
            atualizarCenario();
            if (nivelConcluido || isResizing || gameOver || jogoPausado) return;
            if (cooldownCipo > 0) cooldownCipo--;

            if (jogadorAgravado) {
                player.x = jogadorAgravado.pontaX - player.w/2;
                player.y = jogadorAgravado.pontaY;
                player.vx = 0; player.vy = 0; player.onGround = false;
            } else {
                if (keys.a) { player.vx = -player.speed; ultimaDirecao = -1; }
                else if (keys.d) { player.vx = player.speed; ultimaDirecao = 1; }
                else player.vx = 0;
                player.x += player.vx;
                if (player.x < 0) player.x = 0;
                if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;
                if (barreiraAtiva) {
                    if (player.x + player.w > barreiraX && player.x < barreiraX) player.x = barreiraX - player.w;
                }
                if (keys.w && player.onGround) {
                    player.vy = player.jumpPower; player.onGround = false;
                    playerSquash = -0.3;
                    pulosTotal++;
                    criarParticulas(player.x + player.w/2, player.y + player.h, 8, '#ffffff', 3, 15);
                }
                player.vy += player.gravity;
                player.y += player.vy;
                player.onGround = false;
                for (let plat of platforms) {
                    if (player.x + player.w > plat.x && player.x < plat.x + plat.width) {
                        if (player.vy >= 0 && player.y + player.h >= plat.y && player.y + player.h <= plat.y + plat.height + player.vy + 2) {
                            player.y = plat.y - player.h;
                            player.vy = 0; player.onGround = true;
                        }
                    }
                }
                for (let pp of PLATAFORMAS_PODRES) {
                    if (pp.destruida) continue;
                    if (player.x + player.w > pp.x && player.x < pp.x + pp.w) {
                        if (player.vy >= 0 && player.y + player.h >= pp.y && player.y + player.h <= pp.y + pp.h + player.vy + 2) {
                            player.y = pp.y - player.h;
                            player.vy = 0; player.onGround = true;
                            if (!pp.tremendo) { pp.tremendo = true; pp.tempoPisada = 0; }
                        }
                    }
                }
                for (let canhao of CANHOES) {
                    const topoY = canhao.y - 55;
                    const left = canhao.x - 25, right = canhao.x + 25;
                    if (player.x + player.w > left && player.x < right) {
                        if (player.vy >= 0 && player.y + player.h >= topoY && player.y + player.h <= topoY + 20 + player.vy) {
                            player.y = topoY - player.h; player.vy = 0; player.onGround = true;
                        }
                    }
                    if (player.y + player.h > topoY && player.y < chaoY) {
                        if (player.x + player.w > left && player.x < right) {
                            const distEsquerda = Math.abs(player.x + player.w - left);
                            const distDireita = Math.abs(right - player.x);
                            if (distEsquerda < distDireita) player.x = left - player.w;
                            else player.x = right;
                        }
                    }
                }
                if (player.onGround && !playerNoChaoAnterior) {
                    playerSquash = 0.35;
                    criarParticulas(player.x + player.w/2, player.y + player.h, 6, '#e8d5a0', 2, 12);
                }
                playerNoChaoAnterior = player.onGround;
                if (!player.onGround && player.vy > 0 && player.y > chaoY + 30) {
                    for (let buraco of BURACOS) {
                        if (player.x + player.w > buraco.inicio && player.x < buraco.fim) { resetPlayer(); return; }
                    }
                }
            }
            playerSquash *= 0.82;

            for (let pp of PLATAFORMAS_PODRES) {
                if (pp.destruida) {
                    pp.respawn++;
                    if (pp.respawn > 300) { pp.destruida = false; pp.tremendo = false; pp.tempoPisada = 0; pp.respawn = 0; pp.alpha = 1; }
                    continue;
                }
                if (pp.tremendo) {
                    pp.tempoPisada++;
                    pp.alpha = 1 - (pp.tempoPisada / 120) * 0.5;
                    if (pp.tempoPisada > 120) {
                        pp.destruida = true;
                        criarParticulas(pp.x + pp.w/2, pp.y + pp.h/2, 15, '#8a5a30', 4, 30);
                    }
                }
            }
            for (let cip of CIPOS) {
                cip.fase += cip.velocidade;
                cip.angulo = Math.sin(cip.fase) * cip.anguloMax;
                cip.pontaX = cip.ancoraX + Math.sin(cip.angulo) * cip.comprimento;
                cip.pontaY = cip.ancoraY + Math.cos(cip.angulo) * cip.comprimento;
            }

            for (let canhao of CANHOES) {
                canhao.cooldown--;
                if (canhao.recoil > 0) canhao.recoil--;
                if (canhao.fireGlow > 0) canhao.fireGlow--;
                if (canhao.cooldown <= 0) {
                    bolasDeFogo.push({
                        x: canhao.x, y: canhao.y,
                        vx: canhao.direcao * 5, raio: 15, vida: 200
                    });
                    canhao.recoil = 12;
                    canhao.fireGlow = 10;
                    canhao.cooldown = canhao.cooldownMax;
                    for (let i = 0; i < 8; i++) {
                        particulas.push({
                            x: canhao.x + canhao.direcao * 30 + (Math.random() - 0.5) * 20,
                            y: canhao.y - 10 + (Math.random() - 0.5) * 20,
                            vx: canhao.direcao * (2 + Math.random() * 2),
                            vy: -1 - Math.random() * 2,
                            vida: 30, vidaMax: 30,
                            cor: Math.random() > 0.5 ? '#666' : '#999',
                            tamanho: 4 + Math.random() * 4
                        });
                    }
                }
            }

            for (let i = bolasDeFogo.length - 1; i >= 0; i--) {
                const bola = bolasDeFogo[i];
                bola.x += bola.vx;
                bola.vida--;
                if (tempoGlobal % 3 === 0) {
                    particulas.push({
                        x: bola.x, y: bola.y,
                        vx: (Math.random() - 0.5) * 1, vy: (Math.random() - 0.5) * 1,
                        vida: 15, vidaMax: 15,
                        cor: Math.random() > 0.5 ? '#ff8c00' : '#ffcc00',
                        tamanho: 4 + Math.random() * 3
                    });
                }
                if (bola.x < cameraX - 200 || bola.x > cameraX + W + 200 || bola.vida <= 0) {
                    bolasDeFogo.splice(i, 1);
                    bolasEsquivadas++;
                }
            }

            for (let mob of mobs) {
                if (mob.morto) continue;
                if (mob.walkPhase === undefined) mob.walkPhase = Math.random() * Math.PI * 2;
                if (mob.hitFlash === undefined) mob.hitFlash = 0;
                if (mob.aggro === undefined) mob.aggro = 0;
                if (mob.dustTimer === undefined) mob.dustTimer = 0;
                if (mob.dartTimer === undefined) mob.dartTimer = 0;

                if (mob.hitFlash > 0) mob.hitFlash--;

                const distPlayerX = Math.abs((player.x + player.w/2) - mob.x);
                const aggroTarget = distPlayerX < 350 ? 1 : 0;
                mob.aggro += (aggroTarget - mob.aggro) * 0.08;

                if (mob.tipo === 'terrestre' && !mob.emKnockback) {
                    mob.walkPhase += mob.speed * 0.18;
                    mob.dustTimer++;
                    if (mob.dustTimer > 18) {
                        mob.dustTimer = 0;
                        particulas.push({
                            x: mob.x + (Math.random() - 0.5) * mob.radius,
                            y: chaoY - 3,
                            vx: (Math.random() - 0.5) * 1.5, vy: -0.5 - Math.random() * 0.8,
                            vida: 20, vidaMax: 20, cor: '#c9b088', tamanho: 2 + Math.random() * 3
                        });
                    }
                }

                if (mob.knockbackX !== 0 || mob.knockbackY !== 0) {
                    mob.x += mob.knockbackX; mob.y += mob.knockbackY;
                    mob.knockbackX *= 0.85; mob.knockbackY *= 0.85;
                    if (Math.abs(mob.knockbackX) < 0.1) mob.knockbackX = 0;
                    if (Math.abs(mob.knockbackY) < 0.1) mob.knockbackY = 0;
                    if (mob.y > chaoY - mob.radius) { mob.y = chaoY - mob.radius; mob.knockbackY = 0; }
                    if (mob.knockbackX === 0 && mob.knockbackY === 0) mob.emKnockback = false;
                    if (mob.x < mob.minX) { mob.x = mob.minX; mob.direction = 1; mob.knockbackX = 0; mob.emKnockback = false; }
                    if (mob.x > mob.maxX) { mob.x = mob.maxX; mob.direction = -1; mob.knockbackX = 0; mob.emKnockback = false; }
                    continue;
                }
                if (mob.tipo === 'voador') {
                    mob.x += mob.speed * mob.direction;
                    if (mob.x > mob.maxX || mob.x < mob.minX) {
                        mob.direction *= -1;
                        if (mob.x < mob.minX) mob.x = mob.minX;
                        if (mob.x > mob.maxX) mob.x = mob.maxX;
                    }
                    mob.fase += 0.03;
                    const dartOffset = mob.aggro * Math.sin(tempoGlobal * 0.15 + mob.fase) * 12;

            if (atacando) { ataqueTimer++; if (ataqueTimer > DURACAO_ATAQUE) atacando = false; }

            for (let m of moedasArray) {

            checkCollisions(); checkEspinhos(); checkBolasDeFogo(); checkCheckpoints();

            const distanciaHorizontal = Math.abs((player.x + player.w/2) - (sabio.x + sabio.largura/2));
            if (distanciaHorizontal < 120 && checkpoints[0].ativado && !sabio.conversaTerminada && !sabio.conversaAtiva) {

            }
            updateConversa();
            atualizarNivel();

            if (passaroCarta.ativo && !carta.caiu) {

            }
            if (carta.ativa && !carta.caiu) {

            if (nivelAtual === 5 && !boss.ativo && !finalIniciado && player.x > 92800) {

                    });

            if (boss.ativo && !boss.morto) {

                    const hpRatio = boss.hp / boss.hpMax;
                    if (hpRatio <= 2 / 3 && !boss.invocacoesFeitas[0]) {

                    const coracaoX = boss.x;

                if (boss.hp <= 0 && boss.fase !== 'morrendo' && boss.fase !== 'morto') {

                if (boss.fase === 'morrendo' && boss.timer > 120) {
                    boss.fase = 'morto'; boss.morto = true;
                    desbloquearConquista('lenda');

                for (let i = boss.bolasFogo.length - 1; i >= 0; i--) {

                        particulas.push({

                        });

                    m.dartFase = m.fase * 1.5;
                    if (dist < player.w / 2 + m.radius) { resetPlayer(); return; }
                    if (espadaLancada && !espadaLancada.voltando) {
                        const ex = espadaLancada.x - m.x, ey = espadaLancada.y - m.y;
                        if (Math.sqrt(ex * ex + ey * ey) < m.radius + 25) {

            if (boss.morto && !finalIniciado && player.x + player.w > caverna.x + 120) finalIniciado = true;

            updateEspadaLancada();

                }
            }
            if (sabio.desaparecendo && sabio.alpha > 0) {
                sabio.alpha -= 0.008;
                if (sabio.alpha < 0) sabio.alpha = 0;
            }
            atualizarParticulas();
            atualizarMorteAnims();

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));

            if (mostrarTitulo) { contadorTitulo++; if (contadorTitulo > 120) mostrarTitulo = false; }
            if (mostrarTituloNivel2) { contadorTituloNivel2++; if (contadorTituloNivel2 > 120) mostrarTituloNivel2 = false; }
            if (mostrarTituloNivel3) { contadorTituloNivel3++; if (contadorTituloNivel3 > 120) mostrarTituloNivel3 = false; }
            if (mostrarTituloNivel4) { contadorTituloNivel4++; if (contadorTituloNivel4 > 120) mostrarTituloNivel4 = false; }
            if (mostrarTituloNivel5) { contadorTituloNivel5++; if (contadorTituloNivel5 > 120) mostrarTituloNivel5 = false; }

            const dxTrack = Math.abs(player.x - ultimoXTracking);
            if (dxTrack < 200) distanciaTotal += dxTrack;
            ultimoXTracking = player.x;
            if (distanciaTotal >= 50000) desbloquearConquista('maratonista');

            tempoSemDano++;
            if (tempoSemDano >= 90 * 60) desbloquearConquista('invulneravel');

            if (temEspada) {
                tempoSemAtacar++;
                if (tempoSemAtacar >= 60 * 60) desbloquearConquista('ninja');
            }

            if (!player.onGround && !jogadorAgravado) {
                tempoNoAr++;
                if (tempoNoAr >= 3 * 60) desbloquearConquista('voando');

                tempoNoAr = 0;
            }

            if (moedasTotaisVida >= 500) desbloquearConquista('colecionador');
            if (moedasTotaisVida >= 1500) desbloquearConquista('magnata');
            if (bolasEsquivadas >= 30) desbloquearConquista('esquivaPerfeita');
            if (morcegosMortos >= 15) desbloquearConquista('morceguicida');
            if (espadaLancamentos >= 20) desbloquearConquista('espadaMestre');
            if (cipoUsos >= 50) desbloquearConquista('cipoMestre');
            if (pulosTotal >= 100) desbloquearConquista('saltador');
            if (vidasPerdidasTotal >= 30) desbloquearConquista('resistente');

            for (let esp of ESPINHOS) {

                if (dist < 40 && player.y + player.h >= chaoY - 10 && player.onGround) {

        function desenharOrc(mx, my, mob) {

            ctx.beginPath(); ctx.moveTo(-r * 0.95, -r * 0.65); ctx.lineTo(-r * 1.05, -r * 1.0); ctx.lineTo(-r * 0.78, -r * 0.68); ctx.closePath(); ctx.fill();

            ctx.beginPath(); ctx.ellipse(0, -r * 0.88, r * 0.1, r * 0.075, 0, 0, Math.PI * 2); ctx.fill();
