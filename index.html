<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Acuílandnia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        const WORLD_WIDTH = 2000;

        function drawBackground() {
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#1a2a6c');
            grad.addColorStop(0.5, '#b21f1f');
            grad.addColorStop(1, '#fdbb2d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
        }

        const CHAO_ALTURA = Math.floor(H * 0.15);
        const chaoY = H - CHAO_ALTURA;
        const PLAYER_SIZE = Math.min(W, H) * 0.045;

        const platforms = [
            { x: 0, y: chaoY, width: WORLD_WIDTH, height: CHAO_ALTURA },
            { x: 900, y: chaoY - 80 - PLAYER_SIZE, width: 160, height: 20 }
        ];

        const player = {
            x: 100,
            y: chaoY - PLAYER_SIZE,
            w: PLAYER_SIZE,
            h: PLAYER_SIZE,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: -10.5,
            gravity: 0.45,
            onGround: false,
        };

        let cameraX = 0;
        const keys = { a: false, d: false, w: false };

        function update() {
            if (keys.a) player.vx = -player.speed;
            else if (keys.d) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

            if (keys.w && player.onGround) {
                player.vy = player.jumpPower;
                player.onGround = false;
            }

            player.vy += player.gravity;
            player.y += player.vy;

            player.onGround = false;
            for (let plat of platforms) {
                if (player.x + player.w > plat.x && player.x < plat.x + plat.width) {
                    if (player.vy >= 0 &&
                        player.y + player.h >= plat.y &&
                        player.y + player.h <= plat.y + plat.height + player.vy) {
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
            }

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();

            for (let plat of platforms) {
                const sx = plat.x - cameraX;
                const sy = plat.y;
                if (plat.y === chaoY) {
                    ctx.fillStyle = '#4a7c59';
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    ctx.fillStyle = '#3b6e4a';
                    ctx.fillRect(sx, sy, plat.width, 4);
                } else {
                    ctx.fillStyle = '#8e44ad';
                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.shadowBlur = 12;
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#6c3483';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, plat.width, plat.height);
                }
            }

            const px = player.x - cameraX;
            const py = player.y;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(px, py, player.w, player.h);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.strokeRect(px, py, player.w, player.h);

            const eyeSize = player.w * 0.2;
            const eyeOffset = player.w * 0.2;
            ctx.fillStyle = '#fff';
            ctx.fillRect(px + eyeOffset, py + eyeOffset, eyeSize, eyeSize);
            ctx.fillRect(px + player.w - eyeOffset - eyeSize, py + eyeOffset, eyeSize, eyeSize);
            ctx.fillStyle = '#2c3e50';
            const pupil = eyeSize * 0.4;
            ctx.fillRect(px + eyeOffset + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);
            ctx.fillRect(px + player.w - eyeOffset - eyeSize + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resize() {
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;

            const newChaoAltura = Math.floor(H * 0.15);
            const newPlayerSize = Math.min(W, H) * 0.045;

            platforms[0].y = H - newChaoAltura;
            platforms[0].height = newChaoAltura;
            platforms[1].y = H - newChaoAltura - 80 - newPlayerSize;

            const oldPlayerSize = player.w;
            const scale = newPlayerSize / oldPlayerSize;
            player.w = newPlayerSize;
            player.h = newPlayerSize;
            player.y = platforms[0].y - player.h;
            if (player.onGround) {
                player.y = platforms[0].y - player.h;
            }
        }

        window.addEventListener('resize', resize);

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = true;
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = false;
            }
        });

        resize();
        gameLoop();
    </script>
</body>
</html>
