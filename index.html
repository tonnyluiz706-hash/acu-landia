<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Acuílandnia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <script>
        // ============================================
        // CANVAS E CONFIGURAÇÕES INICIAIS
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W = window.innerWidth;
        let H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;

        const WORLD_WIDTH = 6000;
        let vidas = 5;
        let nivelConcluido = false;
        let mostrarTitulo = true;
        let contadorTitulo = 0;
        let isResizing = false;

        // ============================================
        // BACKGROUND (IMAGEM + FALLBACK)
        // ============================================
        const bgImage = new Image();
        bgImage.src = 'Bacground.jpg';

        function drawBackground() {
            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, W, H);
            } else {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a2a6c');
                grad.addColorStop(0.5, '#b21f1f');
                grad.addColorStop(1, '#fdbb2d');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }
        }

        // ============================================
        // DEFINIÇÕES DO CHÃO, PLATAFORMAS E BURACOS
        // ============================================
        const CHAO_ALTURA = Math.floor(H * 0.15);
        const chaoY = H - CHAO_ALTURA;
        const PLAYER_SIZE = Math.min(W, H) * 0.045;
        const MOB_RADIUS = Math.min(W, H) * 0.025;

        const BURACOS = [
            { inicio: 1400, fim: 1600 },
            { inicio: 2800, fim: 3000 },
            { inicio: 4500, fim: 4700 }
        ];

        function estaSobreBuraco(x) {
            for (let buraco of BURACOS) {
                if (x + PLAYER_SIZE > buraco.inicio && x < buraco.fim) {
                    return true;
                }
            }
            return false;
        }

        // Ajusta a posição do jogador para não ficar sobre um buraco
        function ajustarPosicaoBuraco() {
            if (estaSobreBuraco(player.x)) {
                // Encontra o buraco mais próximo e reposiciona para a borda
                let menorDistancia = Infinity;
                let novaX = player.x;
                for (let buraco of BURACOS) {
                    if (player.x + player.w > buraco.inicio && player.x < buraco.fim) {
                        const distEsquerda = player.x - buraco.inicio;
                        const distDireita = buraco.fim - (player.x + player.w);
                        if (distEsquerda < menorDistancia) {
                            menorDistancia = distEsquerda;
                            novaX = buraco.inicio - player.w;
                        }
                        if (distDireita < menorDistancia) {
                            menorDistancia = distDireita;
                            novaX = buraco.fim;
                        }
                    }
                }
                player.x = Math.max(0, Math.min(novaX, WORLD_WIDTH - player.w));
            }
        }

        const platforms = [
            { x: 0, y: chaoY, width: BURACOS[0].inicio, height: CHAO_ALTURA },
            { x: BURACOS[0].fim, y: chaoY, width: BURACOS[1].inicio - BURACOS[0].fim, height: CHAO_ALTURA },
            { x: BURACOS[1].fim, y: chaoY, width: BURACOS[2].inicio - BURACOS[1].fim, height: CHAO_ALTURA },
            { x: BURACOS[2].fim, y: chaoY, width: WORLD_WIDTH - BURACOS[2].fim, height: CHAO_ALTURA },
            
            { x: 500, y: chaoY - 80 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 800, y: chaoY - 100 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 1900, y: chaoY - 80 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 2200, y: chaoY - 160 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 3500, y: chaoY - 80 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 3800, y: chaoY - 160 - PLAYER_SIZE, width: 120, height: 20 },
            { x: 5000, y: chaoY - 80 - PLAYER_SIZE, width: 120, height: 20 }
        ];

        // ============================================
        // JOGADOR
        // ============================================
        const player = {
            x: 100,
            y: chaoY - PLAYER_SIZE,
            w: PLAYER_SIZE,
            h: PLAYER_SIZE,
            vx: 0,
            vy: 0,
            speed: 5,
            jumpPower: -10.5,
            gravity: 0.45,
            onGround: false,
            spawnX: 100,
            spawnY: chaoY - PLAYER_SIZE,
        };

        // ============================================
        // MOBS
        // ============================================
        const mobs = [
            { x: 900, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 2.0, minX: 700, maxX: 1200, direction: 1, color: '#f1c40f', stroke: '#d4ac0d' },
            { x: 2000, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 2.8, minX: 1800, maxX: 2300, direction: 1, color: '#2ecc71', stroke: '#27ae60' },
            { x: 3300, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 3.2, minX: 3100, maxX: 3600, direction: 1, color: '#9b59b6', stroke: '#8e44ad' },
            { x: 5000, y: chaoY - MOB_RADIUS, radius: MOB_RADIUS, speed: 3.5, minX: 4800, maxX: 5300, direction: 1, color: '#e67e22', stroke: '#d35400' }
        ];

        // ============================================
        // BANDEIRA
        // ============================================
        const flag = {
            x: 5700,
            y: chaoY - 60,
            w: 10,
            h: 60,
            ativada: false
        };

        // ============================================
        // CÂMERA E CONTROLES
        // ============================================
        let cameraX = 0;
        const keys = { a: false, d: false, w: false };

        // ============================================
        // FUNÇÕES DE COLISÃO E RESPAWN
        // ============================================
        function resetPlayer() {
            player.x = player.spawnX;
            player.y = player.spawnY;
            player.vx = 0;
            player.vy = 0;
            player.onGround = false;
            vidas--;
            if (vidas < 0) vidas = 0;
            mostrarTitulo = true;
            contadorTitulo = 0;
        }

        function checkCollisions() {
            for (let mob of mobs) {
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const threshold = player.w/2 + mob.radius;
                if (dist < threshold) {
                    resetPlayer();
                    return;
                }
            }
        }

        function checkFlag() {
            if (player.x + player.w > flag.x && 
                player.x < flag.x + flag.w &&
                player.y + player.h > flag.y && 
                player.y < flag.y + flag.h) {
                flag.ativada = true;
                nivelConcluido = true;
            }
        }

        // ============================================
        // ATUALIZAÇÃO DO JOGO
        // ============================================
        function update() {
            if (nivelConcluido || isResizing) return;

            // Movimento horizontal
            if (keys.a) player.vx = -player.speed;
            else if (keys.d) player.vx = player.speed;
            else player.vx = 0;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

            // Pulo e gravidade
            if (keys.w && player.onGround) {
                player.vy = player.jumpPower;
                player.onGround = false;
            }

            player.vy += player.gravity;
            player.y += player.vy;

            // Colisão com plataformas
            player.onGround = false;
            for (let plat of platforms) {
                if (player.x + player.w > plat.x && player.x < plat.x + plat.width) {
                    if (player.vy >= 0 &&
                        player.y + player.h >= plat.y &&
                        player.y + player.h <= plat.y + plat.height + player.vy + 2) {
                        player.y = plat.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    }
                }
            }

            // Verifica se caiu em um buraco (só se estiver caindo e abaixo do chão)
            if (!player.onGround && player.vy > 0 && player.y > chaoY + 30) {
                let caiuNoBuraco = false;
                for (let buraco of BURACOS) {
                    if (player.x + player.w > buraco.inicio && player.x < buraco.fim) {
                        caiuNoBuraco = true;
                        break;
                    }
                }
                if (caiuNoBuraco) {
                    resetPlayer();
                    return;
                }
            }

            // Movimentação dos mobs
            for (let mob of mobs) {
                mob.x += mob.speed * mob.direction;
                if (mob.x > mob.maxX || mob.x < mob.minX) {
                    mob.direction *= -1;
                }
            }

            checkCollisions();
            checkFlag();

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));

            if (mostrarTitulo) {
                contadorTitulo++;
                if (contadorTitulo > 120) {
                    mostrarTitulo = false;
                }
            }
        }

        // ============================================
        // RENDERIZAÇÃO
        // ============================================
        function draw() {
            ctx.clearRect(0, 0, W, H);
            drawBackground();

            for (let plat of platforms) {
                const sx = plat.x - cameraX;
                const sy = plat.y;
                if (plat.y === chaoY) {
                    ctx.fillStyle = '#4a7c59';
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    ctx.fillStyle = '#3b6e4a';
                    ctx.fillRect(sx, sy, plat.width, 4);
                } else {
                    ctx.fillStyle = '#8e44ad';
                    ctx.shadowColor = 'rgba(0,0,0,0.4)';
                    ctx.shadowBlur = 12;
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#6c3483';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(sx, sy, plat.width, plat.height);
                }
            }

            for (let buraco of BURACOS) {
                const bx = buraco.inicio - cameraX;
                ctx.fillStyle = 'rgba(255,0,0,0.15)';
                ctx.fillRect(bx, chaoY, buraco.fim - buraco.inicio, 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '16px monospace';
                ctx.fillText('💀', bx + 10, chaoY - 10);
            }

            const fx = flag.x - cameraX;
            const fy = flag.y;
            ctx.fillStyle = '#888';
            ctx.fillRect(fx + 4, fy, 3, flag.h);
            
            if (flag.ativada) {
                ctx.fillStyle = '#2ecc71';
            } else {
                ctx.fillStyle = 'rgba(255,255,255,0.9)';
            }
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(fx + 7, fy + 5);
            ctx.lineTo(fx + 30, fy + 15);
            ctx.lineTo(fx + 7, fy + 30);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
            ctx.stroke();

            for (let mob of mobs) {
                const mx = mob.x - cameraX;
                const my = mob.y;
                ctx.beginPath();
                ctx.arc(mx, my, mob.radius, 0, Math.PI * 2);
                ctx.fillStyle = mob.color;
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = mob.stroke;
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            const px = player.x - cameraX;
            const py = player.y;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 12;
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(px, py, player.w, player.h);
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#c0392b';
            ctx.lineWidth = 2;
            ctx.strokeRect(px, py, player.w, player.h);

            const eyeSize = player.w * 0.2;
            const eyeOffset = player.w * 0.2;
            ctx.fillStyle = '#fff';
            ctx.fillRect(px + eyeOffset, py + eyeOffset, eyeSize, eyeSize);
            ctx.fillRect(px + player.w - eyeOffset - eyeSize, py + eyeOffset, eyeSize, eyeSize);
            ctx.fillStyle = '#2c3e50';
            const pupil = eyeSize * 0.4;
            ctx.fillRect(px + eyeOffset + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);
            ctx.fillRect(px + player.w - eyeOffset - eyeSize + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);

            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '20px monospace';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 8;
            ctx.fillText('❤️ ' + vidas, 20, 40);
            ctx.shadowBlur = 0;

            const progresso = Math.min(1, player.x / WORLD_WIDTH);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(W/2 - 100, 20, 200, 8);
            ctx.fillStyle = 'rgba(46, 204, 113, 0.6)';
            ctx.fillRect(W/2 - 100, 20, 200 * progresso, 8);
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 1;
            ctx.strokeRect(W/2 - 100, 20, 200, 8);

            if (mostrarTitulo) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 80px monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('NÍVEL 1', W/2, H/2 - 50);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            if (nivelConcluido) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(46, 204, 113, 0.9)';
                ctx.font = 'bold 60px monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('🏆 NÍVEL CONCLUÍDO! 🏆', W/2, H/2);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }

        // ============================================
        // LOOP PRINCIPAL
        // ============================================
        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // REDIMENSIONAMENTO DA TELA
        // ============================================
        function resize() {
            isResizing = true;

            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;

            const newChaoAltura = Math.floor(H * 0.15);
            const newPlayerSize = Math.min(W, H) * 0.045;
            const newMobRadius = Math.min(W, H) * 0.025;

            // Atualiza chão
            platforms[0].y = H - newChaoAltura;
            platforms[0].height = newChaoAltura;
            platforms[1].y = H - newChaoAltura;
            platforms[1].height = newChaoAltura;
            platforms[2].y = H - newChaoAltura;
            platforms[2].height = newChaoAltura;
            platforms[3].y = H - newChaoAltura;
            platforms[3].height = newChaoAltura;

            // Atualiza plataformas elevadas
            const alturasRelativas = [
                -80 - newPlayerSize,
                -100 - newPlayerSize,
                -80 - newPlayerSize,
                -160 - newPlayerSize,
                -80 - newPlayerSize,
                -160 - newPlayerSize,
                -80 - newPlayerSize
            ];
            
            for (let i = 0; i < 7; i++) {
                platforms[4 + i].y = H - newChaoAltura + alturasRelativas[i];
                platforms[4 + i].height = 20;
            }

            // Atualiza jogador
            const oldPlayerSize = player.w;
            const scale = newPlayerSize / oldPlayerSize;
            player.w = newPlayerSize;
            player.h = newPlayerSize;
            player.y = platforms[0].y - player.h;
            player.spawnY = player.y;
            if (player.onGround) {
                player.y = platforms[0].y - player.h;
            }

            // Ajusta a posição do jogador para não cair em buraco
            ajustarPosicaoBuraco();

            // Atualiza mobs
            for (let mob of mobs) {
                mob.radius = newMobRadius;
                mob.y = platforms[0].y - mob.radius;
            }

            // Atualiza bandeira
            flag.y = platforms[0].y - 60;
            flag.h = 60;

            // Atualiza o chaoY e outras variáveis globais
            // (Elas já foram recalculadas no início)
            // Mas precisamos atualizar as referências nos objetos que usam chaoY
            // Como os mobs e a bandeira já foram atualizados, está ok.

            // Pequeno delay para garantir que o redimensionamento terminou
            setTimeout(() => {
                isResizing = false;
            }, 50);
        }

        window.addEventListener('resize', resize);

        // ============================================
        // EVENTOS DE TECLADO
        // ============================================
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = true;
            }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = false;
            }
        });

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        resize();
        gameLoop();
    </script>
</body>
</html>
