function desenharCanhao(canhao) {
    const cx = canhao.x - cameraX, cy = canhao.y, dir = canhao.direcao;
    const recoil = canhao.recoil || 0, fireGlow = canhao.fireGlow || 0;
    const recoilPx = recoil*2.5;
    ctx.save();
    ctx.translate(cx, cy);
    if (dir === -1) ctx.scale(-1, 1);
    ctx.fillStyle = '#2a2a32'; ctx.strokeStyle = '#0a0a12'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-38, 62); ctx.lineTo(38, 62); ctx.lineTo(28, 38); ctx.lineTo(-28, 38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a3a48'; ctx.fillRect(-34, 55, 68, 4);
    ctx.fillStyle = '#1a1a22';
    ctx.beginPath(); ctx.arc(-28, 55, 2, 0, Math.PI*2); ctx.arc(28, 55, 2, 0, Math.PI*2); ctx.fill();
    const bodyY = -recoilPx;
    ctx.save(); ctx.translate(0, bodyY);
    const gradCorpo = ctx.createLinearGradient(-28, 0, 28, 0);
    gradCorpo.addColorStop(0, '#3a3a48'); gradCorpo.addColorStop(.5, '#6a6a78'); gradCorpo.addColorStop(1, '#3a3a48');
    ctx.fillStyle = gradCorpo; ctx.strokeStyle = '#1a1a22'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-24, 38); ctx.lineTo(-28, -10); ctx.lineTo(-22, -50); ctx.lineTo(22, -50); ctx.lineTo(28, -10); ctx.lineTo(24, 38);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#4a4a58'; ctx.fillRect(-20, 0, 40, 6); ctx.fillRect(-22, -25, 44, 6);
    ctx.fillStyle = '#1a1a22';
    for (let rx = -18; rx <= 18; rx += 9) {
        ctx.beginPath(); ctx.arc(rx, 3, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(rx, -22, 1.5, 0, Math.PI*2); ctx.fill();
    }
    const runaPulso = .5 + Math.sin(tempoGlobal*.15 + canhao.x*.01)*.5;
    ctx.strokeStyle = `rgba(255,140,0,${.5+runaPulso*.5})`; ctx.lineWidth = 2;
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 8*runaPulso;
    ctx.beginPath(); ctx.moveTo(0, 15); ctx.lineTo(5, 20); ctx.lineTo(0, 25); ctx.lineTo(-5, 20); ctx.closePath(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#5a5a68'; ctx.strokeStyle = '#1a1a22'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-22, -50); ctx.lineTo(-18, -68); ctx.lineTo(-8, -62); ctx.lineTo(0, -75); ctx.lineTo(8, -64); ctx.lineTo(18, -68); ctx.lineTo(22, -50);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    const preFire = canhao.cooldown < 20 ? (20 - canhao.cooldown)/20 : 0;
    const brilhoOlho = .85 + Math.sin(tempoGlobal*.2)*.15 + preFire;
    ctx.fillStyle = `rgba(255,120,0,${brilhoOlho})`;
    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 15 + preFire*15;
    ctx.beginPath();
    ctx.arc(-11, -38, 3.5, 0, Math.PI*2); ctx.arc(11, -38, 3.5, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1a0800';
    ctx.beginPath();
    ctx.arc(-11, -38, 1.8, 0, Math.PI*2); ctx.arc(11, -38, 1.8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#0a0a0a'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 5, 24, 18, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    const intensidadeFogo = .7 + Math.sin(tempoGlobal*.2)*.3 + fireGlow*.15 + preFire*.5;
    const glowBoca = ctx.createRadialGradient(0, 5, 0, 0, 5, 28);
    glowBoca.addColorStop(0, `rgba(255,240,150,${Math.min(1, intensidadeFogo)})`);
    glowBoca.addColorStop(.4, `rgba(255,140,0,${Math.min(1, intensidadeFogo*.85)})`);
    glowBoca.addColorStop(1, 'rgba(255,60,0,0)');
    ctx.fillStyle = glowBoca;
    ctx.beginPath(); ctx.ellipse(0, 5, 26, 20, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#8a8a92'; ctx.strokeStyle = '#3a3a42'; ctx.lineWidth = 1.5;
    const dentes = [-18, -12, -6, 0, 6, 12, 18];
    for (let i = 0; i < dentes.length; i++) {
        const dx = dentes[i];
        if (i < 4) { ctx.beginPath(); ctx.moveTo(dx-3, -6); ctx.lineTo(dx, 4); ctx.lineTo(dx+3, -6); ctx.closePath(); ctx.fill(); ctx.stroke(); }
        else { ctx.beginPath(); ctx.moveTo(dx-3, 16); ctx.lineTo(dx, 6); ctx.lineTo(dx+3, 16); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
    ctx.strokeStyle = '#2a2a32'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, 5, 25, 19, 0, 0, Math.PI*2); ctx.stroke();
    if (fireGlow > 5) {
        const alpha = (fireGlow - 5)/5;
        ctx.fillStyle = `rgba(255,240,200,${alpha*.7})`;
        ctx.beginPath(); ctx.arc(0, 5, 25*(1+alpha), 0, Math.PI*2); ctx.fill();
    }
    ctx.restore(); ctx.restore();
}

function desenharBolaDeFogo(bola) {
    const bx = bola.x - cameraX, by = bola.y;
    const pulso = 1 + Math.sin(tempoGlobal*.4 + bola.x*.1)*.08;
    const gradExt = ctx.createRadialGradient(bx, by, 0, bx, by, bola.raio*3);
    gradExt.addColorStop(0, 'rgba(255,200,80,.9)'); gradExt.addColorStop(.35, 'rgba(255,120,0,.7)');
    gradExt.addColorStop(.7, 'rgba(200,40,0,.4)'); gradExt.addColorStop(1, 'rgba(120,0,0,0)');
    ctx.fillStyle = gradExt;
    ctx.beginPath(); ctx.arc(bx, by, bola.raio*3, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 8; i++) {
        const ang = (Math.PI*2/8)*i + tempoGlobal*.15;
        const dist = bola.raio*(1.1 + Math.sin(tempoGlobal*.3 + i)*.2);
        const cx2 = bx + Math.cos(ang)*dist, cy2 = by + Math.sin(ang)*dist;
        const tam = bola.raio*(.5 + Math.sin(tempoGlobal*.4 + i*1.5)*.2);
        ctx.fillStyle = `rgba(255,${140+Math.floor(Math.sin(i)*40)},0,.75)`;
        ctx.beginPath(); ctx.moveTo(cx2, cy2-tam); ctx.lineTo(cx2+tam*.6, cy2+tam*.5); ctx.lineTo(cx2-tam*.6, cy2+tam*.5); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#ffcc33'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(bx, by, bola.raio*.9*pulso, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff8d0'; ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.arc(bx, by, bola.raio*.45*pulso, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bx, by, bola.raio*.22, 0, Math.PI*2); ctx.fill();
}

function desenharCipo(cip) {
    const ax = cip.ancoraX - cameraX, ay = cip.ancoraY;
    const px = cip.pontaX - cameraX, py = cip.pontaY;
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, py); ctx.stroke();
    ctx.strokeStyle = '#6b8a3a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = '#4a6a2a';
    for (let i = .2; i < .9; i += .2) {
        const fx = ax + (px-ax)*i, fy = ay + (py-ay)*i;
        ctx.beginPath(); ctx.ellipse(fx+6, fy, 6, 3, .5, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(fx-6, fy, 6, 3, -.5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#3a1a00';
    ctx.beginPath(); ctx.arc(ax, ay, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2; ctx.stroke();
    if (!jogadorAgravado && cooldownCipo <= 0) {
        const distX = Math.abs((player.x + player.w/2) - cip.pontaX);
        const distY = Math.abs((player.y + player.h/2) - cip.pontaY);
        if (distX < 250 && distY < 250) {
            const pulso = .6 + Math.sin(tempoGlobal*.25)*.4;
            ctx.strokeStyle = `rgba(255,255,100,${pulso})`; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(px, py, 40 + Math.sin(tempoGlobal*.2)*4, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = `rgba(255,255,100,${pulso})`;
            ctx.font = 'bold 14px "Pixelify Sans", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('ESPAÇO', px, py - 50);
            ctx.textAlign = 'left';
        }
    }
}

function desenharSabio(sx, sy) {
    const r = sabio.largura/2;
    const flutuacao = Math.sin(tempoGlobal*.04)*8;
    const balancoX = Math.cos(tempoGlobal*.03)*2;
    const rotLeve = Math.sin(tempoGlobal*.025)*.04;
    const tamMago = sabio.largura*4;
    const centroX = sx + r + balancoX;
    const centroY = sy + sabio.altura/2 + flutuacao - tamMago*1.2*.15;
    const sombraEscala = 1 - (flutuacao + 8)/60;
    ctx.fillStyle = `rgba(0,0,0,${.25 + .1*(1-sombraEscala)})`;
    ctx.beginPath(); ctx.ellipse(centroX, sy + sabio.altura + 4, tamMago*.35*sombraEscala, 6*sombraEscala, 0, 0, Math.PI*2); ctx.fill();
    const pulsoAura = .7 + Math.sin(tempoGlobal*.08)*.3;
    const raioAura = tamMago*.7;
    const gradAura = ctx.createRadialGradient(centroX, centroY, 0, centroX, centroY, raioAura);
    gradAura.addColorStop(0, `rgba(120,200,255,${.4*pulsoAura})`);
    gradAura.addColorStop(.6, `rgba(80,160,255,${.18*pulsoAura})`);
    gradAura.addColorStop(1, 'rgba(80,160,255,0)');
    ctx.fillStyle = gradAura;
    ctx.beginPath(); ctx.arc(centroX, centroY, raioAura, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.translate(centroX, centroY); ctx.rotate(rotLeve);
    if (imgMago.complete && imgMago.naturalWidth !== 0) {
        ctx.shadowColor = 'rgba(120,200,255,.7)'; ctx.shadowBlur = 20*pulsoAura;
        ctx.drawImage(imgMago, -tamMago/2, -tamMago*1.2/2, tamMago, tamMago*1.2);
        ctx.shadowBlur = 0;
    } else {
        ctx.fillStyle = sabio.cor;
        ctx.beginPath();
        ctx.moveTo(0, -tamMago*1.2/2); ctx.lineTo(tamMago/2, tamMago*1.2/2); ctx.lineTo(-tamMago/2, tamMago*1.2/2);
        ctx.closePath(); ctx.fill();
    }
    ctx.restore();
}

function desenharCenarioFundo() {
    if (bgImage.complete && bgImage.naturalWidth !== 0) ctx.drawImage(bgImage, 0, 0, W, H);
    else {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#1a2a6c'); grad.addColorStop(.5, '#b21f1f'); grad.addColorStop(1, '#fdbb2d');
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
    }
    const raioSol = 60 + Math.sin(tempoGlobal*.02)*5;
    const solX = W*.8 - cameraX*.02, solY = H*.2;
    const gradSol = ctx.createRadialGradient(solX, solY, 0, solX, solY, raioSol*3);
    gradSol.addColorStop(0, 'rgba(255,240,150,.9)'); gradSol.addColorStop(.3, 'rgba(255,200,80,.5)'); gradSol.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.fillStyle = gradSol;
    ctx.beginPath(); ctx.arc(solX, solY, raioSol*3, 0, Math.PI*2); ctx.fill();
    for (let n of nuvens) {
        ctx.globalAlpha = n.opacidade;
        ctx.fillStyle = 'rgba(255,255,255,.9)';
        ctx.beginPath();
        ctx.arc(n.x, n.y, 25*n.escala, 0, Math.PI*2);
        ctx.arc(n.x + 25*n.escala, n.y + 5, 20*n.escala, 0, Math.PI*2);
        ctx.arc(n.x - 25*n.escala, n.y + 5, 18*n.escala, 0, Math.PI*2);
        ctx.arc(n.x + 10*n.escala, n.y - 12*n.escala, 18*n.escala, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function desenharMatinhos() {
    for (let m of matinhos) {
        const mx = m.x - cameraX;
        if (mx < -20 || mx > W+20) continue;
        const balanco = Math.sin(tempoGlobal*.05 + m.fase)*2;
        ctx.strokeStyle = m.cor; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(mx, chaoY);
        ctx.quadraticCurveTo(mx + balanco*.5, chaoY - m.altura*.6, mx + balanco, chaoY - m.altura);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(mx, chaoY);
        ctx.quadraticCurveTo(mx - balanco*.5, chaoY - m.altura*.5, mx - balanco, chaoY - m.altura*.8);
        ctx.stroke();
    }
    ctx.lineCap = 'butt';
}

function desenharParticulas() {
    for (let p of particulas) {
        const op = p.vida/p.vidaMax;
        ctx.globalAlpha = op;
        ctx.fillStyle = p.cor; ctx.shadowColor = p.cor; ctx.shadowBlur = 8;
        ctx.beginPath(); ctx.arc(p.x - cameraX, p.y, p.tamanho*op, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }
}

function desenharParticulasAmbiente() {
    for (let p of particulasAmbiente) {
        const brilho = .4 + Math.sin(p.brilho)*.3;
        ctx.globalAlpha = brilho;
        ctx.fillStyle = p.cor; ctx.shadowColor = p.cor; ctx.shadowBlur = 6;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
    }
}

function desenharFolhas() {
    for (let f of folhas) {
        ctx.save();
        ctx.translate(f.x, f.y); ctx.rotate(f.rotacao);
        ctx.fillStyle = f.cor; ctx.globalAlpha = .75;
        ctx.beginPath(); ctx.ellipse(0, 0, f.tamanho, f.tamanho*.45, 0, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = .4; ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = .8;
        ctx.beginPath(); ctx.moveTo(-f.tamanho, 0); ctx.lineTo(f.tamanho, 0); ctx.stroke();
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}

function desenharBorboletas() {
    for (let b of borboletas) {
        const asaBat = Math.sin(tempoGlobal*.3 + b.fase)*.7 + .3;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.fillStyle = b.cor; ctx.globalAlpha = .85;
        ctx.save(); ctx.rotate(-asaBat*.6);
        ctx.beginPath(); ctx.ellipse(-b.tamanho*.6, 0, b.tamanho*.5, b.tamanho*.35, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.save(); ctx.rotate(asaBat*.6);
        ctx.beginPath(); ctx.ellipse(b.tamanho*.6, 0, b.tamanho*.5, b.tamanho*.35, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#3a2a1a';
        ctx.beginPath(); ctx.ellipse(0, 0, b.tamanho*.15, b.tamanho*.5, 0, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha = 1;
}

function desenharCaverna() {
    const cvx = caverna.x - cameraX, baseY = chaoY, topoY = chaoY - caverna.h;
    ctx.fillStyle = '#2a2530'; ctx.strokeStyle = '#0a0810'; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cvx - 260, baseY);
    ctx.lineTo(cvx - 200, baseY - 120); ctx.lineTo(cvx - 140, baseY - 60);
    ctx.lineTo(cvx - 100, baseY - 200); ctx.lineTo(cvx - 40, baseY - 100);
    ctx.lineTo(cvx + 30, baseY - 240); ctx.lineTo(cvx + 100, baseY - 120);
    ctx.lineTo(cvx + 160, baseY - 220); ctx.lineTo(cvx + 240, baseY - 100);
    ctx.lineTo(cvx + 300, baseY - 180); ctx.lineTo(cvx + 380, baseY - 60);
    ctx.lineTo(cvx + caverna.w + 200, baseY);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#1a1520'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
    const estal = [cvx-80, cvx-20, cvx+60, cvx+140, cvx+240, cvx+320];
    for (let i = 0; i < estal.length; i++) {
        const alt = 30 + Math.sin(i*1.3)*20;
        ctx.beginPath();
        ctx.moveTo(estal[i]-12, topoY-20); ctx.lineTo(estal[i], topoY-20+alt); ctx.lineTo(estal[i]+12, topoY-20);
        ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    const centroCavX = cvx + caverna.w/2;
    const entradaW = 100, entradaH = 180, entradaY = baseY - entradaH;
    const gradCav = ctx.createRadialGradient(centroCavX, entradaY + entradaH*.5, 10, centroCavX, entradaY + entradaH*.5, entradaH);
    gradCav.addColorStop(0, boss.morto ? '#000' : '#1a0010');
    gradCav.addColorStop(.5, '#000'); gradCav.addColorStop(1, '#000');
    ctx.fillStyle = gradCav;
    ctx.beginPath();
    ctx.moveTo(centroCavX - entradaW, baseY);
    ctx.quadraticCurveTo(centroCavX - entradaW, entradaY + 30, centroCavX, entradaY);
    ctx.quadraticCurveTo(centroCavX + entradaW, entradaY + 30, centroCavX + entradaW, baseY);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a2a3a'; ctx.lineWidth = 4; ctx.stroke();
    if (!boss.morto) {
        const pulso = .4 + Math.sin(tempoGlobal*.08)*.3;
        const gradLava = ctx.createRadialGradient(centroCavX, entradaY + entradaH*.7, 10, centroCavX, entradaY + entradaH*.7, entradaH*.9);
        gradLava.addColorStop(0, `rgba(255,60,0,${pulso*.7})`);
        gradLava.addColorStop(.4, `rgba(180,20,60,${pulso*.4})`);
        gradLava.addColorStop(1, 'rgba(80,0,30,0)');
        ctx.fillStyle = gradLava;
        ctx.beginPath();
        ctx.moveTo(centroCavX - entradaW + 10, baseY);
        ctx.quadraticCurveTo(centroCavX - entradaW + 10, entradaY + 40, centroCavX, entradaY + 10);
        ctx.quadraticCurveTo(centroCavX + entradaW - 10, entradaY + 40, centroCavX + entradaW - 10, baseY);
        ctx.closePath(); ctx.fill();
    }
}

function desenharBoss(bx, by) {
    const r = boss.w/2;
    const flap = Math.sin(boss.batidaAsa)*.7;
    const dir = player.x > boss.x ? 1 : -1;
    const pulsoAura = .6 + Math.sin(tempoGlobal*.08)*.4;
    const cargaGlow = boss.carregando > 0 ? (1 - boss.carregando/45) : 0;
    const boca = boss.bocaAberta;
    const hitFlash = boss.hitFlash || 0;
    ctx.save();
    ctx.translate(bx, by); ctx.scale(dir, 1); ctx.rotate(boss.rotacaoCorpo);
    const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r*2.2);
    gr.addColorStop(0, `rgba(120,0,40,${.55*pulsoAura})`);
    gr.addColorStop(.5, `rgba(60,0,60,${.3*pulsoAura})`);
    gr.addColorStop(1, 'rgba(40,0,40,0)');
    ctx.fillStyle = gr;
    ctx.beginPath(); ctx.arc(0, 0, r*2.2, 0, Math.PI*2); ctx.fill();
    const desenharAsa = (lado) => {
        ctx.save(); ctx.scale(lado, 1);
        const gradAsa = ctx.createLinearGradient(0, -r*.5, r*2, r*.3);
        gradAsa.addColorStop(0, '#5a1850'); gradAsa.addColorStop(.5, '#2a0a30'); gradAsa.addColorStop(1, '#100818');
        ctx.fillStyle = gradAsa; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(r*.35, -15);
        ctx.quadraticCurveTo(r*1.3, -r*(1.0+flap*.6), r*2.2, -r*(.55+flap*.5));
        ctx.lineTo(r*2.1, -r*.25);
        ctx.quadraticCurveTo(r*1.9, -r*.05, r*1.75, -r*.1);
        ctx.quadraticCurveTo(r*1.55, r*.35, r*1.35, r*.1);
        ctx.quadraticCurveTo(r*1.15, r*.4, r*.9, r*.15);
        ctx.quadraticCurveTo(r*.7, r*.4, r*.5, r*.15);
        ctx.lineTo(r*.35, 0);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
    };
    desenharAsa(-1); desenharAsa(1);
    const gradCorpo = ctx.createRadialGradient(0, 0, 0, 0, 0, r*.7);
    gradCorpo.addColorStop(0, '#5a2050'); gradCorpo.addColorStop(.5, '#3a1030'); gradCorpo.addColorStop(1, '#1a0820');
    ctx.fillStyle = gradCorpo; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(0, 0, r*.5, r*.65, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    const cabecaY = -r*.6;
    const gradCabeca = ctx.createRadialGradient(0, cabecaY - r*.05, 0, 0, cabecaY, r*.5);
    gradCabeca.addColorStop(0, '#6a2060'); gradCabeca.addColorStop(.6, '#3a1030'); gradCabeca.addColorStop(1, '#1a0820');
    ctx.fillStyle = gradCabeca; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, cabecaY, r*.45, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    const olhoDirX = (player.x - boss.x)/400, olhoDirY = (player.y - boss.y)/400;
    const eyeIntensity = .7 + Math.sin(tempoGlobal*.15)*.3 + cargaGlow*.5;
    ctx.fillStyle = `rgba(255,30,0,${.5*eyeIntensity})`;
    ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 35;
    ctx.beginPath();
    ctx.arc(-r*.18, cabecaY + r*.02, 14, 0, Math.PI*2);
    ctx.arc(r*.18, cabecaY + r*.02, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff4400';
    ctx.beginPath();
    ctx.arc(-r*.18, cabecaY + r*.02, 9, 0, Math.PI*2);
    ctx.arc(r*.18, cabecaY + r*.02, 9, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#ffcc00';
    ctx.beginPath();
    ctx.arc(-r*.18, cabecaY + r*.02, 5, 0, Math.PI*2);
    ctx.arc(r*.18, cabecaY + r*.02, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-r*.18 + olhoDirX*3, cabecaY + r*.02 + olhoDirY*3, 3, 0, Math.PI*2);
    ctx.arc(r*.18 + olhoDirX*3, cabecaY + r*.02 + olhoDirY*3, 3, 0, Math.PI*2);
    ctx.fill();
    const bocaY = cabecaY + r*.28;
    const alturaBoca = r*.14*(.4 + boca*1.3);
    ctx.fillStyle = '#1a0000'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.ellipse(0, bocaY, r*.22, alturaBoca, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    if (cargaGlow > 0) {
        const grBoca = ctx.createRadialGradient(0, bocaY, 0, 0, bocaY, r*.4);
        grBoca.addColorStop(0, `rgba(255,240,100,${cargaGlow})`);
        grBoca.addColorStop(.4, `rgba(255,100,0,${cargaGlow*.9})`);
        grBoca.addColorStop(1, 'rgba(255,0,0,0)');
        ctx.fillStyle = grBoca;
        ctx.beginPath(); ctx.arc(0, bocaY, r*.4, 0, Math.PI*2); ctx.fill();
    }
    if (hitFlash > 0) {
        const alphaFlash = Math.min(.6, hitFlash/12);
        ctx.fillStyle = `rgba(255,255,255,${alphaFlash})`;
        ctx.beginPath(); ctx.arc(0, 0, r*1.1, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

// ============================================
// DRAW
// ============================================
function draw() {
    ctx.clearRect(0, 0, W, H);
    let shakeX = 0, shakeY = 0;
    if (screenShake > 0.2) {
        shakeX = (Math.random()-.5)*screenShake;
        shakeY = (Math.random()-.5)*screenShake;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);
    desenharCenarioFundo();
    for (let plat of platforms) {
        const sx = plat.x - cameraX, sy = plat.y;
        if (plat.y === chaoY) {
            ctx.fillStyle = '#4a7c59';
            ctx.fillRect(sx, sy, plat.width, plat.height);
            const brilho = .8 + Math.sin(tempoGlobal*.03)*.2;
            ctx.fillStyle = `rgba(90,160,110,${brilho})`;
            ctx.fillRect(sx, sy, plat.width, 4);
        } else {
            if (imgPlataforma.complete && imgPlataforma.naturalWidth !== 0) {
                ctx.drawImage(imgPlataforma, sx, sy, plat.width, plat.height);
            } else {
                ctx.fillStyle = '#8e44ad';
                ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 12;
                ctx.fillRect(sx, sy, plat.width, plat.height);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#6c3483'; ctx.lineWidth = 2;
                ctx.strokeRect(sx, sy, plat.width, plat.height);
            }
        }
    }
    for (let pp of PLATAFORMAS_PODRES) {
        if (pp.destruida) continue;
        const sx = pp.x - cameraX;
        const tX = pp.tremendo ? (Math.random()-.5)*4 : 0;
        const tY = pp.tremendo ? (Math.random()-.5)*2 : 0;
        ctx.globalAlpha = pp.alpha;
        if (imgPlataformaPodre.complete && imgPlataformaPodre.naturalWidth !== 0) {
            ctx.drawImage(imgPlataformaPodre, sx + tX, pp.y + tY, pp.w, pp.h);
        } else {
            ctx.fillStyle = pp.tremendo ? '#6a3a1a' : '#8a5a3a';
            ctx.fillRect(sx + tX, pp.y + tY, pp.w, pp.h);
            ctx.strokeStyle = '#3a1a00'; ctx.lineWidth = 2;
            ctx.strokeRect(sx + tX, pp.y + tY, pp.w, pp.h);
        }
        ctx.globalAlpha = 1;
    }
    for (let b of BURACOS) {
        const bx = b.inicio - cameraX;
        const bw = b.fim - b.inicio;
        if (bx > W + 50 || bx + bw < -50) continue;
        const gradBuraco = ctx.createLinearGradient(0, chaoY, 0, chaoY + 80);
        gradBuraco.addColorStop(0, 'rgba(0,0,0,0.95)');
        gradBuraco.addColorStop(0.6, 'rgba(10,5,0,0.85)');
        gradBuraco.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradBuraco;
        ctx.fillRect(bx, chaoY, bw, 80);
        const gradSombra = ctx.createLinearGradient(bx, chaoY, bx + bw, chaoY + 20);
        gradSombra.addColorStop(0, 'rgba(0,0,0,0.3)');
        gradSombra.addColorStop(0.5, 'rgba(0,0,0,0.8)');
        gradSombra.addColorStop(1, 'rgba(0,0,0,0.3)');
        ctx.fillStyle = gradSombra;
        ctx.beginPath();
        ctx.ellipse(bx + bw/2, chaoY + 5, bw/2, 25, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.fillStyle = '#fff';
        ctx.font = '16px "Pixelify Sans", monospace';
        ctx.fillText('💀', bx + bw/2 - 8, chaoY - 5);
        ctx.globalAlpha = 1;
    }
    desenharMatinhos();
    for (let e of ESPINHOS) {
        const ex = e.x - cameraX, ey = e.y;
        const pulso = .8 + Math.sin(tempoGlobal*.08 + e.x)*.2;
        ctx.fillStyle = '#e74c3c';
        ctx.shadowColor = `rgba(231,76,60,${.4 + pulso*.2})`;
        ctx.shadowBlur = 12*pulso + 6;
        ctx.beginPath();
        ctx.moveTo(ex + e.w/2, ey - 3*pulso);
        ctx.lineTo(ex + e.w, ey + e.h);
        ctx.lineTo(ex, ey + e.h);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1; ctx.stroke();
    }
    for (let cip of CIPOS) desenharCipo(cip);
    for (let c of CANHOES) desenharCanhao(c);
    for (let b of bolasDeFogo) desenharBolaDeFogo(b);
    for (let m of moedasArray) {
        if (m.coletada) continue;
        const mx = m.x - cameraX;
        if (mx < -50 || mx > W+50) continue;
        const flut = Math.sin(tempoGlobal*.06 + m.fase)*3;
        const my = m.y + flut;
        const escala = .9 + Math.sin(tempoGlobal*.1 + m.fase)*.1;
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 15 + Math.sin(tempoGlobal*.1 + m.fase)*5;
        ctx.fillStyle = '#ffd700';
        ctx.beginPath(); ctx.arc(mx, my, m.raio*escala, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath(); ctx.arc(mx-2, my-2, m.raio*escala*.4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.7)';
        ctx.beginPath(); ctx.arc(mx-3, my-3, m.raio*escala*.2, 0, Math.PI*2); ctx.fill();
    }
    for (let cp of checkpoints) {
        const cx = cp.x - cameraX;
        if (cx < -50 || cx > W+50) continue;
        const cy = cp.y;
        ctx.fillStyle = '#888'; ctx.fillRect(cx + 4, cy, 3, cp.h);
        const onda = Math.sin(tempoGlobal*.1 + cp.x*.01)*3;
        ctx.fillStyle = cp.ativado ? '#2ecc71' : 'rgba(255,255,255,.9)';
        ctx.shadowColor = cp.ativado ? '#2ecc71' : 'rgba(0,0,0,.3)';
        ctx.shadowBlur = cp.ativado ? 15 : 8;
        ctx.beginPath();
        ctx.moveTo(cx + 7, cy + 5);
        ctx.quadraticCurveTo(cx + 20, cy + 12 + onda, cx + 30, cy + 15);
        ctx.lineTo(cx + 7, cy + 30);
        ctx.closePath(); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
    }
    const sxSabio = sabio.x - cameraX, sySabio = sabio.y;
    if (sabio.alpha > 0) {
        ctx.globalAlpha = sabio.alpha;
        desenharSabio(sxSabio, sySabio);
        ctx.globalAlpha = 1;
    }
    if (sabio.conversaAtiva && !sabio.conversaTerminada) {
        const fala = sabio.falas[sabio.falaIndex] || '';
        ctx.font = '16px "Pixelify Sans", monospace';
        const larg = ctx.measureText(fala).width;
        const padding = 20;
        const bw = Math.max(larg + padding*2, 60);
        const bh = 24 + padding;
        const flut = Math.sin(tempoGlobal*.04)*8;
        const bx = sxSabio + sabio.largura/2 - bw/2;
        const by = sySabio - 100 + flut;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#222';
        ctx.fillText(fala, bx + bw/2, by + bh/2);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    if (nivelAtual === 5) desenharCaverna();
    // MOBS
    for (let mob of mobs) {
        if (mob.morto) continue;
        const mx = mob.x - cameraX;
        if (mx < -100 || mx > W+100) continue;
        if (mob.tipo === 'voador') desenharMorcego(mx, mob.y, mob);
        else desenharOrc(mx, mob.y, mob);
        const offBar = mob.tipo === 'voador' ? mob.radius*1.9 : mob.radius*1.75;
        ctx.fillStyle = 'rgba(255,0,0,.7)';
        ctx.fillRect(mx - mob.radius, mob.y - offBar, mob.radius*2, 4);
        ctx.fillStyle = 'rgba(0,255,0,.7)';
        ctx.fillRect(mx - mob.radius, mob.y - offBar, mob.radius*2*(mob.hp/2), 4);
    }
    // CONE DE VISÃO (antes dos símbolos, para ficar sutil no fundo)
    for (let mob of mobs) {
        if (mob.morto) continue;
        desenharConeVisao(mob);
    }
    // SÍMBOLOS "!" e "?"
    for (let mob of mobs) {
        if (mob.morto) continue;
        desenharSimboloMob(mob);
    }
    if (!gameOver) {
        const px = player.x - cameraX, py = player.y;
        desenharPlayerNovo(px, py, player.w, player.h);
    }
    desenharParticulas();
    desenharParticulasAmbiente();
    desenharMorteAnims();
    if (passaroCarta.ativo) {
        const bx = passaroCarta.x - cameraX, by = passaroCarta.y;
        const flap = Math.sin(passaroCarta.fase*2)*.5;
        ctx.fillStyle = '#222';
        ctx.beginPath(); ctx.ellipse(bx, by, 20, 10, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath();
        ctx.moveTo(bx-8, by); ctx.lineTo(bx-35, by-15+flap*15); ctx.lineTo(bx-10, by+5);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(bx+8, by); ctx.lineTo(bx+35, by-15+flap*15); ctx.lineTo(bx+10, by+5);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath(); ctx.arc(bx+12, by-3, 2, 0, Math.PI*2); ctx.fill();
    }
    if (carta.ativa && !carta.coletada) {
        const cx = carta.x - cameraX, cy = carta.y;
        const flut = carta.caiu ? Math.sin(tempoGlobal*.1)*3 : 0;
        ctx.save();
        ctx.translate(cx, cy+flut);
        ctx.rotate(Math.sin(tempoGlobal*.04)*.15);
        ctx.fillStyle = '#f5e8c8'; ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
        ctx.fillRect(-18, -12, 36, 24);
        ctx.strokeRect(-18, -12, 36, 24);
        ctx.strokeStyle = '#c9a961';
        ctx.beginPath(); ctx.moveTo(-18, -12); ctx.lineTo(0, 2); ctx.lineTo(18, -12); ctx.stroke();
        ctx.fillStyle = '#aa2222';
        ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI*2); ctx.fill();
        ctx.restore();
        const pulso = .5 + Math.sin(tempoGlobal*.2)*.4;
        ctx.strokeStyle = `rgba(255,240,150,${pulso})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(cx, cy+flut, 40, 0, Math.PI*2); ctx.stroke();
    }
    if (espadaLancada) {
        const ex = espadaLancada.x - cameraX, ey = espadaLancada.y;
        ctx.save();
        ctx.translate(ex, ey); ctx.rotate(espadaLancada.angulo);
        const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
        gr.addColorStop(0, 'rgba(120,220,255,.7)'); gr.addColorStop(1, 'rgba(120,220,255,0)');
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI*2); ctx.fill();
        ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 20;
        ctx.fillStyle = '#d8ecff'; ctx.strokeStyle = '#4a7a9a'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-6, 15); ctx.lineTo(-4, -30); ctx.lineTo(0, -40); ctx.lineTo(4, -30); ctx.lineTo(6, 15);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#8a6a2a';
        ctx.fillRect(-4, 15, 8, 8);
        ctx.restore();
    }
    if (boss.ativo) {
        const bx = boss.x - cameraX, by = boss.y;
        if (boss.fase === 'aparecendo') {
            const escala = Math.min(1, boss.timer/90);
            ctx.save();
            ctx.globalAlpha = escala;
            ctx.fillStyle = '#000'; ctx.shadowColor = '#000'; ctx.shadowBlur = 40;
            ctx.beginPath(); ctx.ellipse(bx, by, boss.w*.6*escala, boss.h*.6*escala, 0, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            if (boss.timer > 40) {
                ctx.fillStyle = '#ff2200'; ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 25;
                ctx.beginPath();
                ctx.arc(bx-30, by-20, 8, 0, Math.PI*2); ctx.arc(bx+30, by-20, 8, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.restore();
        } else if (!boss.morto) desenharBoss(bx, by);
        if (!boss.morto && boss.fase === 'lutando') {
            const barW = 600, barX = W/2 - barW/2, barY = 80;
            ctx.fillStyle = 'rgba(0,0,0,.75)';
            ctx.fillRect(barX-6, barY-6, barW+12, 40);
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3;
            ctx.strokeRect(barX-6, barY-6, barW+12, 40);
            ctx.fillStyle = 'rgba(60,0,0,.9)';
            ctx.fillRect(barX, barY, barW, 28);
            const ratio = boss.hp/boss.hpMax;
            const grd = ctx.createLinearGradient(barX, 0, barX + barW, 0);
            grd.addColorStop(0, '#ff0000'); grd.addColorStop(1, '#ff6644');
            ctx.fillStyle = grd;
            ctx.fillRect(barX, barY, barW*ratio, 28);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px "Pixelify Sans", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('🦇 MORCEGO ANCESTRAL', W/2, barY-14);
            ctx.fillText(`${boss.hp} / ${boss.hpMax}`, W/2, barY+22);
            ctx.textAlign = 'left';
        }
        for (let b of boss.bolasFogo) {
            const bxx = b.x - cameraX, byy = b.y;
            const pulso = 1 + Math.sin(tempoGlobal*.4 + b.x*.1)*.1;
            const grad = ctx.createRadialGradient(bxx, byy, 0, bxx, byy, b.raio*3);
            grad.addColorStop(0, 'rgba(255,240,150,1)');
            grad.addColorStop(.25, 'rgba(255,180,40,.95)');
            grad.addColorStop(.55, 'rgba(255,80,0,.7)');
            grad.addColorStop(1, 'rgba(120,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(bxx, byy, b.raio*3, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ffcc33'; ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 25;
            ctx.beginPath(); ctx.arc(bxx, byy, b.raio*.85*pulso, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff8d0';
            ctx.beginPath(); ctx.arc(bxx, byy, b.raio*.4, 0, Math.PI*2); ctx.fill();
        }
        for (let m of boss.morcegos) {
            if (m.morto) continue;
            desenharMorcego(m.x - cameraX, m.y, m);
        }
    }
    desenharFolhas();
    desenharBorboletas();
    if (!gameOver) {
        ctx.fillStyle = 'rgba(255,255,255,.8)';
        ctx.font = '20px "Pixelify Sans", monospace';
        ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 8;
        ctx.fillText('❤️ ' + vidas, 20, 40);
        ctx.fillText('Nível ' + nivelAtual, 20, 70);
        ctx.fillText('🪙 ' + moedas + ' / 100', 20, 100);
        ctx.fillText('🏆 ' + contarConquistas() + ' / ' + totalConquistas(), 20, 130);
        ctx.shadowBlur = 0;
        const prog = Math.min(1, player.x/WORLD_WIDTH);
        ctx.fillStyle = 'rgba(255,255,255,.3)';
        ctx.fillRect(W/2-100, 20, 200, 8);
        ctx.fillStyle = 'rgba(46,204,113,.6)';
        ctx.fillRect(W/2-100, 20, 200*prog, 8);
        ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1;
        ctx.strokeRect(W/2-100, 20, 200, 8);
    }
    const titulos = [
        { ativo:mostrarTitulo, texto:'NÍVEL 1' },
        { ativo:mostrarTituloNivel2, texto:'NÍVEL 2' },
        { ativo:mostrarTituloNivel3, texto:'NÍVEL 3' },
        { ativo:mostrarTituloNivel4, texto:'NÍVEL 4 - PERIGO!' },
        { ativo:mostrarTituloNivel5, texto:'NÍVEL 5 - O GUARDIÃO' }
    ];
    for (let t of titulos) {
        if (t.ativo && !gameOver) {
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(255,255,255,.5)';
            ctx.font = 'bold 80px "Pixelify Sans", monospace';
            ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 20;
            ctx.fillText(t.texto, W/2, H/2-50);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
        }
    }
    ctx.restore();
    if (flashMorte > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${flashMorte})`;
        ctx.fillRect(0, 0, W, H);
    }
    if (fadeFinal > 0) {
        ctx.fillStyle = `rgba(0, 0, 0, ${fadeFinal})`;
        ctx.fillRect(0, 0, W, H);
    }
    if (fadeFinal >= 1) {
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = 'bold 44px "Press Start 2P", monospace';
        ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 40;
        ctx.fillText('VOCÊ VENCEU!', W/2, H/2 - 80);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 20px "Press Start 2P", monospace';
        ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 20;
        ctx.fillText('Acuílândia está salva', W/2, H/2 - 10);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#88ddff';
        ctx.font = 'bold 14px "Press Start 2P", monospace';
        ctx.fillText('Aguarde as próximas atualizações', W/2, H/2 + 60);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
    if (dialogo.ativo) {
        const fala = dialogo.falas[dialogo.index] || '';
        ctx.font = 'bold 22px "Pixelify Sans", monospace';
        const larg = ctx.measureText(fala).width;
        const padding = 40;
        const bw = Math.max(larg + padding*2, 500);
        const bh = 120;
        const bx = W/2 - bw/2, by = H - 200;
        ctx.fillStyle = 'rgba(0,0,0,.9)';
        ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 16); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 18px "Pixelify Sans", monospace';
        ctx.fillText(dialogo.titulo, bx + 20, by + 30);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 22px "Pixelify Sans", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(fala, W/2, by + bh/2 + 5);
        const pisca = Math.sin(tempoGlobal*.15)*.5 + .5;
        ctx.fillStyle = `rgba(241,196,15,${.5 + pisca*.5})`;
        ctx.font = 'bold 16px "Pixelify Sans", monospace';
        ctx.fillText('▼ ENTER PARA CONTINUAR', W/2, by + bh - 15);
        ctx.fillStyle = 'rgba(241,196,15,.6)';
        ctx.font = '14px "Pixelify Sans", monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`${dialogo.index + 1} / ${dialogo.falas.length}`, bx + bw - 20, by + 30);
        ctx.textAlign = 'left';
    }
    if (gameOver) {
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(0,0,0,.7)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 90px "Pixelify Sans", monospace';
        ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 40;
        ctx.fillText('PERDEU OTÁRIO', W/2, H/2-30);
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.font = '24px "Pixelify Sans", monospace';
        ctx.fillText('Pressione R para reiniciar', W/2, H/2+70);
        ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    }
}

if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (r > w/2) r = w/2;
        if (r > h/2) r = h/2;
        this.moveTo(x + r, y);
        this.lineTo(x + w - r, y);
        this.quadraticCurveTo(x + w, y, x + w, y + r);
        this.lineTo(x + w, y + h - r);
        this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        this.lineTo(x + r, y + h);
        this.quadraticCurveTo(x, y + h, x, y + h - r);
        this.lineTo(x, y + r);
        this.quadraticCurveTo(x, y, x + r, y);
        return this;
    };
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

function resize() {
    isResizing = true;
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    const newChaoAltura = Math.floor(H*.15);
    const newPlayerSize = Math.min(W, H)*.058;
    const newMobRadius = Math.min(W, H)*.025;
    const novoChaoY = H - newChaoAltura;
    const deltaY = novoChaoY - chaoY;
    chaoY = novoChaoY;
    for (let plat of platforms) {
        if (plat.y === chaoY - deltaY) { plat.y = chaoY; plat.height = newChaoAltura; }
        else { plat.y += deltaY; plat.height = 20; plat.width = 120; }
    }
    for (let e of ESPINHOS) e.y += deltaY;
    for (let mob of mobs) { mob.radius = newMobRadius; mob.y += deltaY; }
    for (let cp of checkpoints) cp.y += deltaY;
    sabio.y += deltaY;
    for (let m of moedasArray) m.y += deltaY;
    for (let pp of PLATAFORMAS_PODRES) pp.y += deltaY;
    for (let cip of CIPOS) cip.ancoraY += deltaY;
    for (let c of CANHOES) c.y += deltaY;
    for (let b of bolasDeFogo) b.y += deltaY;
    caverna.y = chaoY - caverna.h;
    boss.y += deltaY;
    for (let b of boss.bolasFogo) b.y += deltaY;
    for (let m of boss.morcegos) m.y += deltaY;
    player.w = newPlayerSize; player.h = newPlayerSize;
    if (player.onGround || player.y + player.h > chaoY) { player.y = chaoY - player.h; player.onGround = true; }
    else player.y += deltaY;
    player.spawnY = chaoY - player.h;
    checkpointY = player.spawnY;
    ajustarPosicaoBuraco();
    inicializarCenario();
    setTimeout(() => { isResizing = false; }, 50);
}
window.addEventListener('resize', resize);

const pauseBtn = document.getElementById('pauseBtn');
const configBtnTop = document.getElementById('configBtnTop');
const pauseMenu = document.getElementById('pauseMenu');
const configMenu = document.getElementById('configMenu');
const resumeBtn = document.getElementById('resumeBtn');
const configCloseBtn = document.getElementById('configCloseBtn');
const pauseAchCount = document.getElementById('pauseAchCount');
const pauseMoedas = document.getElementById('pauseMoedas');
const pauseVidas = document.getElementById('pauseVidas');
const pauseNivel = document.getElementById('pauseNivel');
const achDesbloqueadasDiv = document.getElementById('achDesbloqueadas');
const achBloqueadasDiv = document.getElementById('achBloqueadas');

function pausarJogo() {
    if (jogoPausado || !jogoIniciado || gameOver) return;
    jogoPausado = true;
    keys.a = keys.d = keys.w = keys.space = false;
    segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0;
    atualizarMenuPause();
    pauseMenu.classList.add('aberto');
}
function despausarJogo() {
    if (!jogoPausado) return;
    jogoPausado = false;
    pauseMenu.classList.remove('aberto');
}
function atualizarMenuPause() {
    pauseAchCount.textContent = `${contarConquistas()} / ${totalConquistas()}`;
    pauseMoedas.textContent = moedas;
    pauseVidas.textContent = vidas;
    pauseNivel.textContent = nivelAtual;
    const desbl = [], bloq = [];
    for (let k in CONQUISTAS) {
        const c = CONQUISTAS[k];
        const item = `<div class="ach-item ${c.desbloqueada ? 'desbloqueada' : ''}"><div class="ach-icon">${c.icone||'🏆'}</div><div class="ach-info"><div class="ach-name">${c.desbloqueada ? c.nome : '???'}</div><div class="ach-desc">${c.desbloqueada ? c.desc : 'Conquista bloqueada'}</div></div></div>`;
        if (c.desbloqueada) desbl.push(item); else bloq.push(item);
    }
    achDesbloqueadasDiv.innerHTML = `<div class="ach-section-title">✅ Desbloqueadas (${desbl.length})</div><div class="ach-list">${desbl.join('') || '<div style="color:#666;padding:10px">Nenhuma ainda...</div>'}</div>`;
    achBloqueadasDiv.innerHTML = `<div class="ach-section-title locked">🔒 Bloqueadas (${bloq.length})</div><div class="ach-list">${bloq.join('')}</div>`;
}
pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); pausarJogo(); });
resumeBtn.addEventListener('click', (e) => { e.stopPropagation(); despausarJogo(); });

function abrirConfig() {
    if (!jogoIniciado) return;
    if (!jogoPausado) { jogoPausado = true; keys.a = keys.d = keys.w = keys.space = false; }
    atualizarConfigUI();
    configMenu.classList.add('aberto');
}
function fecharConfig() {
    configMenu.classList.remove('aberto');
    bindAguardando = null;
    document.querySelectorAll('.bind-btn').forEach(b => b.classList.remove('aguardando'));
    if (!pauseMenu.classList.contains('aberto')) despausarJogo();
}
function atualizarConfigUI() {
    document.getElementById('volumeSlider').value = Math.round(volumeGeral * 100);
    document.getElementById('volumeValue').textContent = Math.round(volumeGeral * 100) + '%';
    const picker = document.getElementById('charPicker');
    picker.innerHTML = CORES_PERSONAGEM.map(c => `
        <div class="char-option ${c.id === personagemSelecionado.id ? 'selecionado' : ''}" data-id="${c.id}">
            <div class="char-preview" style="background:${c.cor}; box-shadow: 0 0 15px ${c.cor};"></div>
            <div class="char-name">${c.nome}</div>
        </div>
    `).join('');
    picker.querySelectorAll('.char-option').forEach(el => {
        el.addEventListener('click', () => {
            const c = CORES_PERSONAGEM.find(x => x.id === el.dataset.id);
            if (c) { personagemSelecionado = c; atualizarConfigUI(); }
        });
    });
    document.querySelectorAll('.bind-btn').forEach(btn => {
        const acao = btn.dataset.acao;
        const tecla = BINDS[acao];
        btn.textContent = tecla === ' ' ? 'ESPAÇO' : (tecla === '__vazio__' ? '---' : tecla.toUpperCase());
        btn.classList.toggle('aguardando', bindAguardando === acao);
    });
}
configBtnTop.addEventListener('click', (e) => { e.stopPropagation(); abrirConfig(); });
configCloseBtn.addEventListener('click', (e) => { e.stopPropagation(); fecharConfig(); });

document.getElementById('volumeSlider').addEventListener('input', (e) => {
    volumeGeral = parseInt(e.target.value) / 100;
    document.getElementById('volumeValue').textContent = e.target.value + '%';
    aplicarVolume();
});

document.querySelectorAll('.bind-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        e.stopPropagation();
        bindAguardando = btn.dataset.acao;
        atualizarConfigUI();
    });
});

document.addEventListener('keydown', (e) => {
    if (!jogoIniciado) return;
    const key = e.key.toLowerCase();
    if (bindAguardando) {
        e.preventDefault();
        if (key === 'escape') { bindAguardando = null; atualizarConfigUI(); return; }
        for (let acao in BINDS) {
            if (acao !== bindAguardando && BINDS[acao] === key) BINDS[acao] = '__vazio__';
        }
        BINDS[bindAguardando] = key;
        bindAguardando = null;
        atualizarConfigUI();
        return;
    }
    if (key === BINDS.pause || key === 'escape') {
        e.preventDefault();
        if (configMenu.classList.contains('aberto')) { fecharConfig(); return; }
        if (pauseMenu.classList.contains('aberto')) { despausarJogo(); return; }
        if (jogoPausado) despausarJogo(); else pausarJogo();
        return;
    }
    if (jogoPausado) return;
    if (dialogo.ativo) {
        if (e.key === 'Enter') { e.preventDefault(); avancarDialogo(); }
        return;
    }
    if (key === BINDS.esquerda) { e.preventDefault(); keys.a = true; return; }
    if (key === BINDS.direita) { e.preventDefault(); keys.d = true; return; }
    if (key === BINDS.pular) { e.preventDefault(); keys.w = true; return; }
    if (key === BINDS.atacar) {
        e.preventDefault();
        if (jogadorAgravado) {
            const omega = Math.cos(jogadorAgravado.fase) * jogadorAgravado.anguloMax * jogadorAgravado.velocidade;
            const velLinear = jogadorAgravado.comprimento * omega;
            player.vx = velLinear * Math.cos(jogadorAgravado.angulo);
            player.vy = -velLinear * Math.sin(jogadorAgravado.angulo) - 6;
            if (omega > 0) player.vx += 3;
            else if (omega < 0) player.vx -= 3;
            jogadorAgravado.ocupado = false;
            jogadorAgravado = null;
            cooldownCipo = 15;
            cipoUsos++;
            if (cipoUsos >= 10) desbloquearConquista('tarzan');
            return;
        }
        if (e.repeat) return;
        if (cooldownCipo <= 0 && !espadaLancada) {
            let maisProx = null, menorDist = Infinity;
            for (let cip of CIPOS) {
                const dX = Math.abs((player.x + player.w/2) - cip.pontaX);
                const dY = Math.abs((player.y + player.h/2) - cip.pontaY);
                const dist = Math.sqrt(dX*dX + dY*dY);
                if (dX < 250 && dY < 250 && dist < menorDist) { menorDist = dist; maisProx = cip; }
            }
            if (maisProx) {
                jogadorAgravado = maisProx;
                maisProx.ocupado = true;
                player.x = maisProx.pontaX - player.w/2;
                player.y = maisProx.pontaY;
                player.vx = 0; player.vy = 0;
            } else {
                executarAtaque();
                segurandoAtaque = true;
                tempoSegurando = 0;
                inicioHold = performance.now();
            }
        }
        return;
    }
    if (key === 'r') { e.preventDefault(); if (gameOver) restartGame(); }
});

document.addEventListener('keyup', (e) => {
    if (!jogoIniciado) return;
    const key = e.key.toLowerCase();
    if (key === BINDS.esquerda) { keys.a = false; return; }
    if (key === BINDS.direita) { keys.d = false; return; }
    if (key === BINDS.pular) { keys.w = false; return; }
    if (key === BINDS.atacar) { segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0; }
});

function iniciarJogo() {
    if (jogoIniciado) return;
    jogoIniciado = true;
    tempoInicioJogo = performance.now();
    ultimoXTracking = player.x;
    gerarMoedas();
    resize();
    checkpointY = player.spawnY;
    pauseBtn.classList.add('visivel');
    configBtnTop.classList.add('visivel');
    gameLoop();
}
</script>
