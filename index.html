                for (let plat of platforms) {

        ];

        const checkpoints = [
            { x: 5700, y: chaoY - 60, w: 10, h: 60, ativado: false, tipo: 'bandeira' },
            { x: 9300, y: chaoY - 40, w: 10, h: 40, ativado: false, tipo: 'bandeira' },

        const sabio = {
            x: 5950, y: chaoY - 50, largura: 40, altura: 40, cor: '#3498db',

        };

        let cameraX = 0;
        const keys = { a: false, d: false, w: false, space: false };

        let matinhos = [];

        function inicializarCenario() {
            matinhos = [];
            for (let x = 0; x < WORLD_WIDTH; x += 30) {
                if (estaSobreBuraco(x)) continue;
                let noChao = false;
                for (let plat of platforms) {
                    if (plat.y === chaoY && x > plat.x && x < plat.x + plat.width) { noChao = true; break; }
                }
                if (noChao) {
                    matinhos.push({
                        x: x, altura: 8 + Math.random() * 8,
                        fase: Math.random() * Math.PI * 2,
                        cor: Math.random() > 0.5 ? '#5d9c6b' : '#4a7c59'
                    });
                }
            }

            nuvens = [];
            for (let i = 0; i < 30; i++) {
                nuvens.push({
                    x: Math.random() * W * 3,
                    y: 40 + Math.random() * (H * 0.35),
                    escala: 0.5 + Math.random() * 1.2,
                    velocidade: 0.15 + Math.random() * 0.3,
                    opacidade: 0.3 + Math.random() * 0.4
                });
            }

            particulasAmbiente = [];
            for (let i = 0; i < 60; i++) {
                particulasAmbiente.push({
                    x: Math.random() * W, y: Math.random() * H * 0.8,
                    vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.2,
                    tamanho: 1 + Math.random() * 2,
                    brilho: Math.random() * Math.PI * 2,
                    cor: Math.random() > 0.5 ? '#fff8c4' : '#c4e8ff'
                });
            }
        }

        function atualizarCenario() {
            for (let n of nuvens) {
                n.x -= n.velocidade;
                if (n.x < -300) {
                    n.x = W + 200 + Math.random() * 200;
                    n.y = 40 + Math.random() * (H * 0.35);
                }
            }
            for (let p of particulasAmbiente) {
                p.x += p.vx; p.y += p.vy; p.brilho += 0.05;
                if (p.x < -20) p.x = W + 20;
                if (p.x > W + 20) p.x = -20;
                if (p.y < -20) p.y = H * 0.85;
                if (p.y > H * 0.9) p.y = -20;
            }
        }

        function resetPlayer() {
            if (vidas <= 0) { gameOver = true; return; }
            let checkpointEncontrado = null;
            for (let cp of checkpoints) if (cp.ativado) checkpointEncontrado = cp;
            if (checkpointEncontrado) {
                player.x = checkpointX; player.y = checkpointY;
            } else {
                player.x = player.spawnX; player.y = player.spawnY;
            }
            player.vx = 0; player.vy = 0; player.onGround = false;
            vidas--;
            if (vidas < 0) vidas = 0;
            mostrarTitulo = true;
            contadorTitulo = 0;
        }

        function checkCollisions() {
            for (let mob of mobs) {
                if (mob.morto || mob.emKnockback) continue;
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                if (Math.sqrt(dx*dx + dy*dy) < player.w/2 + mob.radius) { resetPlayer(); return; }
            }
        }

        function checkEspinhos() {
            for (let espinho of ESPINHOS) {
                if (player.x + player.w > espinho.x && player.x < espinho.x + espinho.w &&
                    player.y + player.h > espinho.y && player.y < espinho.y + espinho.h) {
                    resetPlayer(); return;
                }
            }
        }

        let particulas = [];

        function criarParticulas(x, y, quantidade, cor, velocidade, vida) {
            for (let i = 0; i < quantidade; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const vel = Math.random() * velocidade + 1;
                particulas.push({
                    x: x, y: y,
                    vx: Math.cos(angulo) * vel, vy: Math.sin(angulo) * vel - 1,
                    vida: vida || 30, vidaMax: vida || 30,
                    cor: cor,
                    tamanho: Math.random() * 6 + 3
                });
            }
        }

        function atualizarParticulas() {
            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.05; p.vx *= 0.98; p.vy *= 0.98;
                p.vida--;
                if (p.vida <= 0) particulas.splice(i, 1);
            }
        }

        function desenharParticulas() {
            for (let p of particulas) {
                const op = p.vida / p.vidaMax;
                ctx.globalAlpha = op;
                ctx.fillStyle = p.cor;
                ctx.shadowColor = p.cor;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(p.x - cameraX, p.y, p.tamanho * op, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        function checkCheckpoints() {
            for (let cp of checkpoints) {
                if (cp.ativado) continue;
                if (player.x + player.w > cp.x && player.x < cp.x + cp.w + 30 &&
                    player.y + player.h > cp.y && player.y < cp.y + cp.h) {
                    cp.ativado = true;
                    checkpointX = player.x; checkpointY = player.y;
                    if (vidas < MAX_VIDAS) {
                        vidas++;
                        criarParticulas(player.x + player.w/2, player.y + player.h/2, 20, '#ff6b6b', 4, 30);
                    }
                }
            }
        }

        function iniciarConversa() {
            if (sabio.conversaTerminada || !checkpoints[0].ativado || sabio.conversaAtiva) return;
            sabio.conversaAtiva = true;
            sabio.falaIndex = 0; sabio.timer = 0; sabio.esperandoProxima = false;
        }

        function avancarConversa() {
            sabio.falaIndex++;
            if (sabio.falaIndex >= sabio.falas.length) {
                sabio.conversaTerminada = true;
                sabio.conversaAtiva = false;
                temEspada = true;
                return;
            }
            sabio.timer = 0; sabio.esperandoProxima = false;
        }

        function updateConversa() {
            if (!sabio.conversaAtiva || sabio.conversaTerminada) return;
            const dx = (player.x + player.w/2) - (sabio.x + sabio.largura/2);
            const dy = (player.y + player.h/2) - (sabio.y + sabio.altura/2);
            if (Math.sqrt(dx*dx + dy*dy) > 150) return;
            if (!sabio.esperandoProxima) {
                sabio.timer++;
                if (sabio.timer > 120) avancarConversa();
            }
        }

        function executarAtaque() {
            if (!temEspada || atacando) return;
            atacando = true;
            ataqueTimer = 0;

            criarParticulas(player.x + player.w/2, player.y + player.h/2, 15, '#ffffff', 5, 10);

            for (let mob of mobs) {
                if (mob.morto) continue;
                const dx = (player.x + player.w/2) - mob.x;
                const dy = (player.y + player.h/2) - mob.y;
                if (Math.sqrt(dx*dx + dy*dy) < ALCANCE_ATAQUE) {
                    mob.hp--;
                    if (mob.hp <= 0) {
                        mob.morto = true;
                        criarParticulas(mob.x, mob.y, 30, mob.color, 6, 40);
                        criarParticulas(mob.x, mob.y, 15, '#ffffff', 3, 20);
                    } else {
                        const forca = 20;
                        if (mob.tipo === 'voador') {
                            mob.knockbackX = ultimaDirecao * 25;
                            mob.knockbackY = 0;
                        } else {
                            mob.knockbackX = -mob.direction * forca;
                            mob.knockbackY = 0;
                        }
                        mob.emKnockback = true;
                    }
                }
            }
        }

        function restartGame() {
            gameOver = false; nivelConcluido = false; nivelAtual = 1;
            vidas = 5; moedas = 0; temEspada = false; atacando = false;
            sabio.conversaAtiva = false; sabio.conversaTerminada = false;
            sabio.falaIndex = 0; sabio.timer = 0; sabio.esperandoProxima = false;
            checkpointX = player.spawnX; checkpointY = player.spawnY;
            mostrarTitulo = true; mostrarTituloNivel2 = false; mostrarTituloNivel3 = false;
            contadorTitulo = 0; contadorTituloNivel2 = 0; contadorTituloNivel3 = 0;
            particulas = [];

            for (let cp of checkpoints) cp.ativado = false;
            for (let m of moedasArray) m.coletada = false;

            player.x = player.spawnX; player.y = player.spawnY;
            player.vx = 0; player.vy = 0; player.onGround = false;

            const posicoesIniciais = [
                900, 2000, 3300, 5000, 6400, 7100, 7900,
                10500, 11500, 12500, 14000, 15500, 17000, 18500, 20000, 21500, 23000,
                26000, 27000, 28000, 29000, 30000, 31000, 32000, 33000, 34000, 35000,
                36000, 37000, 38000, 39000, 40000, 41000, 42000, 43000, 44000, 45000, 46000
            ];
            for (let i = 0; i < mobs.length; i++) {
                if (i < posicoesIniciais.length) mobs[i].x = posicoesIniciais[i];
                mobs[i].morto = false; mobs[i].direction = 1; mobs[i].hp = 2;
                mobs[i].knockbackX = 0; mobs[i].knockbackY = 0;
                mobs[i].emKnockback = false;
                mobs[i].fase = Math.random() * Math.PI * 2;
            }

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));
        }

        function atualizarNivel() {
            if (nivelAtual === 1 && player.x > 6200) {
                nivelAtual = 2; mostrarTituloNivel2 = true; contadorTituloNivel2 = 0;
            }
            if (nivelAtual === 2 && player.x > 9500) {
                nivelAtual = 3; mostrarTituloNivel3 = true; contadorTituloNivel3 = 0;
            }
        }

        function update() {
            tempoGlobal++;
            atualizarCenario();

            if (nivelConcluido || isResizing || gameOver) return;

            if (keys.a) { player.vx = -player.speed; ultimaDirecao = -1; }
            else if (keys.d) { player.vx = player.speed; ultimaDirecao = 1; }
            else player.vx = 0;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;

            if (keys.w && player.onGround) { player.vy = player.jumpPower; player.onGround = false; }
            player.vy += player.gravity;
            player.y += player.vy;

            player.onGround = false;
            for (let plat of platforms) {
                if (player.x + player.w > plat.x && player.x < plat.x + plat.width) {
                    if (player.vy >= 0 && player.y + player.h >= plat.y &&
                        player.y + player.h <= plat.y + plat.height + player.vy + 2) {
                        player.y = plat.y - player.h;
                        player.vy = 0; player.onGround = true;
                    }
                }
            }

            if (!player.onGround && player.vy > 0 && player.y > chaoY + 30) {
                for (let buraco of BURACOS) {
                    if (player.x + player.w > buraco.inicio && player.x < buraco.fim) {
                        resetPlayer(); return;
                    }
                }
            }

            for (let mob of mobs) {
                if (mob.morto) continue;
                if (mob.knockbackX !== 0 || mob.knockbackY !== 0) {
                    mob.x += mob.knockbackX; mob.y += mob.knockbackY;
                    mob.knockbackX *= 0.85; mob.knockbackY *= 0.85;
                    if (Math.abs(mob.knockbackX) < 0.1) mob.knockbackX = 0;
                    if (Math.abs(mob.knockbackY) < 0.1) mob.knockbackY = 0;
                    if (mob.y > chaoY - mob.radius) { mob.y = chaoY - mob.radius; mob.knockbackY = 0; }
                    if (mob.knockbackX === 0 && mob.knockbackY === 0) mob.emKnockback = false;
                    if (mob.x < mob.minX) { mob.x = mob.minX; mob.direction = 1; mob.knockbackX = 0; mob.emKnockback = false; }
                    if (mob.x > mob.maxX) { mob.x = mob.maxX; mob.direction = -1; mob.knockbackX = 0; mob.emKnockback = false; }
                    continue;
                }

                if (mob.tipo === 'voador') {
                    mob.x += mob.speed * mob.direction;
                    if (mob.x > mob.maxX || mob.x < mob.minX) {
                        mob.direction *= -1;
                        if (mob.x < mob.minX) mob.x = mob.minX;
                        if (mob.x > mob.maxX) mob.x = mob.maxX;
                    }
                    mob.fase += 0.03;
                    mob.y = (chaoY - 100) + Math.sin(mob.fase) * mob.amplitude;
                } else {
                    mob.x += mob.speed * mob.direction;
                    if (mob.x > mob.maxX || mob.x < mob.minX) {
                        mob.direction *= -1;
                        if (mob.x < mob.minX) mob.x = mob.minX;
                        if (mob.x > mob.maxX) mob.x = mob.maxX;
                    }
                }
            }

            if (atacando) {
                ataqueTimer++;
                if (ataqueTimer > DURACAO_ATAQUE) atacando = false;
            }

            for (let m of moedasArray) {
                if (m.coletada) continue;
                const dx = (player.x + player.w/2) - m.x;
                const dy = (player.y + player.h/2) - m.y;
                if (Math.sqrt(dx*dx + dy*dy) < m.raio + 20) {
                    m.coletada = true;
                    moedas++;
                    criarParticulas(m.x, m.y, 12, '#ffd700', 3, 20);
                    if (moedas % 100 === 0 && vidas < MAX_VIDAS) {
                        vidas++;
                        criarParticulas(player.x + player.w/2, player.y, 25, '#ff6b6b', 5, 30);
                    }
                }
            }

            checkCollisions();
            checkEspinhos();
            checkCheckpoints();

            const dxSabio = (player.x + player.w/2) - (sabio.x + sabio.largura/2);
            const dySabio = (player.y + player.h/2) - (sabio.y + sabio.altura/2);
            if (Math.sqrt(dxSabio*dxSabio + dySabio*dySabio) < 120 &&
                checkpoints[0].ativado && !sabio.conversaTerminada) {
                if (!sabio.conversaAtiva) iniciarConversa();
            }

            updateConversa();
            atualizarNivel();

            if (nivelAtual === 3 && player.x > 48000) nivelConcluido = true;

            atualizarParticulas();

            cameraX = player.x - W / 2;
            cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));

            if (mostrarTitulo) { contadorTitulo++; if (contadorTitulo > 120) mostrarTitulo = false; }
            if (mostrarTituloNivel2) { contadorTituloNivel2++; if (contadorTituloNivel2 > 120) mostrarTituloNivel2 = false; }
            if (mostrarTituloNivel3) { contadorTituloNivel3++; if (contadorTituloNivel3 > 120) mostrarTituloNivel3 = false; }
        }

        // ============================================
        // DESENHAR ORC
        // ============================================
        function desenharOrc(mx, my, mob) {
            const r = mob.radius;
            const walkCycle = tempoGlobal * 0.18 + mob.fase;
            const legSwing = Math.sin(walkCycle);
            const armSwing = -legSwing;
            const bodyBob = Math.abs(Math.cos(walkCycle)) * r * 0.06;
            const pele = mob.color;
            const peleEsc = mob.stroke;

            ctx.save();
            ctx.translate(mx, my + bodyBob);

            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.beginPath();
            ctx.ellipse(0, r * 0.95 - bodyBob, r * 0.85, r * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();

            const legBaseY = r * 0.15;
            const legLen = r * 0.65;
            const legLeftY = legSwing * r * 0.12;
            const legRightY = -legSwing * r * 0.12;

            ctx.fillStyle = pele;
            ctx.strokeStyle = peleEsc;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(-r * 0.32, legBaseY + legLen / 2 + legLeftY, r * 0.19, legLen / 2, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(r * 0.32, legBaseY + legLen / 2 + legRightY, r * 0.19, legLen / 2, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#3a2010';
            ctx.strokeStyle = '#1a0800';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(-r * 0.32, legBaseY + legLen + legLeftY, r * 0.27, r * 0.15, 0, 0, Math.PI * 2);

        // ============================================
        // DESENHAR MORCEGO
        // ============================================
        function desenharMorcego(mx, my, mob) {
            const r = mob.radius;
            const asaBat = Math.sin(tempoGlobal * 0.5 + mob.fase);
            const dir = mob.direction >= 0 ? 1 : -1;

            ctx.save();
            ctx.translate(mx, my);
            ctx.scale(dir, 1);

            ctx.fillStyle = mob.color;
            ctx.strokeStyle = mob.stroke;
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 12;

            ctx.beginPath();
            ctx.moveTo(-r * 0.4, -r * 0.2);
            ctx.quadraticCurveTo(-r * 1.3, -r * (0.9 + asaBat * 0.5), -r * 2.1, -r * (0.3 + asaBat * 1.0));
            ctx.lineTo(-r * 1.7, -r * 0.05);
            ctx.quadraticCurveTo(-r * 1.55, r * 0.15, -r * 1.45, r * 0.05);
            ctx.quadraticCurveTo(-r * 1.25, r * 0.25, -r * 1.1, r * 0.1);
            ctx.quadraticCurveTo(-r * 0.9, r * 0.35, -r * 0.75, r * 0.15);
            ctx.quadraticCurveTo(-r * 0.6, r * 0.35, -r * 0.45, r * 0.1);
            ctx.lineTo(-r * 0.4, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(r * 0.4, -r * 0.2);
            ctx.quadraticCurveTo(r * 1.3, -r * (0.9 + asaBat * 0.5), r * 2.1, -r * (0.3 + asaBat * 1.0));
            ctx.lineTo(r * 1.7, -r * 0.05);
            ctx.quadraticCurveTo(r * 1.55, r * 0.15, r * 1.45, r * 0.05);
            ctx.quadraticCurveTo(r * 1.25, r * 0.25, r * 1.1, r * 0.1);
            ctx.quadraticCurveTo(r * 0.9, r * 0.35, r * 0.75, r * 0.15);
            ctx.quadraticCurveTo(r * 0.6, r * 0.35, r * 0.45, r * 0.1);
            ctx.lineTo(r * 0.4, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(0, 0, r * 0.55, r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.arc(0, -r * 0.7, r * 0.45, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-r * 0.35, -r * 0.95);
            ctx.lineTo(-r * 0.55, -r * 1.5);
            ctx.lineTo(-r * 0.1, -r * 1.0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.35, -r * 0.95);
            ctx.lineTo(r * 0.55, -r * 1.5);
            ctx.lineTo(r * 0.1, -r * 1.0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#ffeb3b';
            ctx.shadowColor = '#ffeb3b';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(-r * 0.18, -r * 0.7, r * 0.13, 0, Math.PI * 2);
            ctx.arc(r * 0.18, -r * 0.7, r * 0.13, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-r * 0.18, -r * 0.7, r * 0.06, 0, Math.PI * 2);
            ctx.arc(r * 0.18, -r * 0.7, r * 0.06, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // ============================================
        // DESENHAR ESPADA MÁGICA (GIRO 360°)
        // ============================================
        function desenharEspadaMagica(px, py, w, h, estaAtacando, progresso) {
            const escala = w / 40;

            const maoX = px + w * 0.9;
            const maoY = py + h * 0.5;

            const rotInicial = -Math.PI * 0.78;

            let rotacao;
            if (estaAtacando) {
                const t = progresso;
                const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                rotacao = rotInicial + eased * Math.PI * 2;
            } else {
                rotacao = -0.15;
            }

            const pulso = 0.75 + Math.sin(tempoGlobal * 0.12) * 0.25;
            const intensidadeAtaque = estaAtacando ? 1.6 : 1;
            const flutuacao = estaAtacando ? 0 : Math.sin(tempoGlobal * 0.08) * 1.5;

            const raioAura = 45 * (estaAtacando ? 1.4 : 1);
            const gradAura = ctx.createRadialGradient(maoX, maoY + flutuacao, 0, maoX, maoY + flutuacao, raioAura);
            gradAura.addColorStop(0, `rgba(120, 220, 255, ${0.55 * pulso * intensidadeAtaque})`);
            gradAura.addColorStop(0.5, `rgba(80, 180, 255, ${0.25 * pulso * intensidadeAtaque})`);
            gradAura.addColorStop(1, 'rgba(80, 180, 255, 0)');
            ctx.fillStyle = gradAura;
            ctx.beginPath();
            ctx.arc(maoX, maoY + flutuacao, raioAura, 0, Math.PI * 2);
            ctx.fill();

            if (estaAtacando && progresso > 0.05) {
                const distPonta = 46 * escala;
                const rotAtual = rotacao;
                const numSegmentos = 24;
                for (let i = 0; i < numSegmentos; i++) {
                    const tIni = i / numSegmentos;
                    const tFim = (i + 1) / numSegmentos;
                    const rot1 = rotInicial + (rotAtual - rotInicial) * tIni;
                    const rot2 = rotInicial + (rotAtual - rotInicial) * tFim;
                    const x1 = maoX + Math.sin(rot1) * distPonta;
                    const y1 = maoY + flutuacao - Math.cos(rot1) * distPonta;
                    const x2 = maoX + Math.sin(rot2) * distPonta;
                    const y2 = maoY + flutuacao - Math.cos(rot2) * distPonta;
                    const alpha = (i / numSegmentos) * 0.75 * (1 - progresso * 0.4);
                    const larguraSeg = (2 + i * 0.3) * escala;

                    ctx.strokeStyle = `rgba(150, 230, 255, ${alpha})`;
                    ctx.lineWidth = larguraSeg;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = '#66ccff';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
                ctx.lineCap = 'butt';
            }

            ctx.save();
            ctx.translate(maoX, maoY + flutuacao);
            ctx.rotate(rotacao);

            ctx.fillStyle = '#8a6a2a';
            ctx.strokeStyle = '#4a3000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 22 * escala, 4 * escala, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#ff2244';
            ctx.shadowColor = '#ff2244';
            ctx.shadowBlur = 8 * pulso;
            ctx.beginPath();
            ctx.arc(0, 22 * escala, 2.2 * escala, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#5a3a1a';
            ctx.strokeStyle = '#3a1a00';
            ctx.lineWidth = 1;
            ctx.fillRect(-3 * escala, 8 * escala, 6 * escala, 12 * escala);
            ctx.strokeRect(-3 * escala, 8 * escala, 6 * escala, 12 * escala);

            ctx.strokeStyle = '#3a1a00';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < 4; i++) {
                const yy = 9 * escala + i * 3 * escala;
                ctx.beginPath();
                ctx.moveTo(-3 * escala, yy);
                ctx.lineTo(3 * escala, yy + 1.5 * escala);
                ctx.stroke();
            }

            ctx.fillStyle = '#d4a44a';
            ctx.strokeStyle = '#8a5a10';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-10 * escala, 6 * escala);
            ctx.lineTo(10 * escala, 6 * escala);
            ctx.lineTo(8 * escala, 9 * escala);
            ctx.lineTo(-8 * escala, 9 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-10 * escala, 6 * escala);
            ctx.lineTo(-13 * escala, 4 * escala);
            ctx.lineTo(-11 * escala, 8 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(10 * escala, 6 * escala);
            ctx.lineTo(13 * escala, 4 * escala);
            ctx.lineTo(11 * escala, 8 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#ff2244';
            ctx.shadowColor = '#ff2244';
            ctx.shadowBlur = 10 * pulso;
            ctx.beginPath();
            ctx.moveTo(0, 4 * escala);
            ctx.lineTo(3 * escala, 7 * escala);
            ctx.lineTo(0, 10 * escala);
            ctx.lineTo(-3 * escala, 7 * escala);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#8a0010';
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.shadowColor = '#66ccff';
            ctx.shadowBlur = 14 * pulso * intensidadeAtaque;

            const gradLamina = ctx.createLinearGradient(0, 0, 0, -45 * escala);
            gradLamina.addColorStop(0, '#e8f4ff');
            gradLamina.addColorStop(0.4, '#b8d8ee');
            gradLamina.addColorStop(0.7, '#88aacc');
            gradLamina.addColorStop(1, '#aaddff');
            ctx.fillStyle = gradLamina;
            ctx.strokeStyle = '#4a7a9a';
            ctx.lineWidth = 1.2;

            ctx.beginPath();
            ctx.moveTo(-3.5 * escala, 5 * escala);
            ctx.lineTo(-3 * escala, -38 * escala);
            ctx.lineTo(0, -46 * escala);
            ctx.lineTo(3 * escala, -38 * escala);
            ctx.lineTo(3.5 * escala, 5 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(0, 3 * escala);
            ctx.lineTo(0, -42 * escala);
            ctx.stroke();

            const runaPulso = 0.5 + Math.sin(tempoGlobal * 0.15) * 0.5;
            ctx.strokeStyle = `rgba(120, 220, 255, ${runaPulso * intensidadeAtaque})`;
            ctx.shadowColor = '#66ccff';
            ctx.shadowBlur = 8 * pulso;
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(0, -20 * escala);
            ctx.lineTo(2.5 * escala, -17 * escala);
            ctx.lineTo(0, -14 * escala);
            ctx.lineTo(-2.5 * escala, -17 * escala);
            ctx.closePath();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -26 * escala);
            ctx.lineTo(0, -22 * escala);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -12 * escala);
            ctx.lineTo(0, -8 * escala);
            ctx.stroke();

            ctx.shadowBlur = 0;
            ctx.restore();

            const numFaiscas = estaAtacando ? 9 : 4;
            for (let i = 0; i < numFaiscas; i++) {
                const faseFaisca = tempoGlobal * 0.08 + i * 1.5;
                const angulo = faseFaisca;
                const raio = 18 + Math.sin(faseFaisca * 1.3) * 6;
                const fx = maoX + Math.cos(angulo) * raio;
                const fy = maoY + flutuacao + Math.sin(angulo * 0.8) * raio - 5;
                const tamanhoFaisca = 1.5 + Math.sin(faseFaisca * 2) * 1;

                ctx.fillStyle = `rgba(150, 230, 255, ${0.6 + Math.sin(faseFaisca * 3) * 0.3})`;
                ctx.shadowColor = '#66ccff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(fx, fy, tamanhoFaisca, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            if (estaAtacando) {
                let intensidade = 0;
                if (progresso > 0.45 && progresso < 0.6) {
                    intensidade = 1 - Math.abs(progresso - 0.525) / 0.075;
                } else if (progresso > 0.85) {
                    intensidade = 1 - Math.abs(progresso - 0.925) / 0.075;
                }

                if (intensidade > 0) {
                    const distPonta = 46 * escala;
                    const pontaX = maoX + Math.sin(rotacao) * distPonta;
                    const pontaY = maoY + flutuacao - Math.cos(rotacao) * distPonta;

                    const gradFlash = ctx.createRadialGradient(pontaX, pontaY, 0, pontaX, pontaY, 35 * intensidade);
                    gradFlash.addColorStop(0, `rgba(255, 255, 255, ${0.9 * intensidade})`);
                    gradFlash.addColorStop(0.4, `rgba(150, 230, 255, ${0.6 * intensidade})`);
                    gradFlash.addColorStop(1, 'rgba(150, 230, 255, 0)');
                    ctx.fillStyle = gradFlash;
                    ctx.beginPath();
                    ctx.arc(pontaX, pontaY, 35 * intensidade, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // ============================================
        // DESENHAR SÁBIO (MAGO) COM FLUTUAÇÃO
        // ============================================
        function desenharSabio(sx, sy) {
            const r = sabio.largura / 2;

            // Animação de flutuação: sobe e desce 8px + leve balanço horizontal
            const flutuacao = Math.sin(tempoGlobal * 0.04) * 8;
            const balancoX = Math.cos(tempoGlobal * 0.03) * 2;
            const rotacaoLeve = Math.sin(tempoGlobal * 0.025) * 0.04;

            const centroX = sx + r + balancoX;
            const centroY = sy + r + flutuacao;

            // Sombra no chão (que muda de tamanho conforme ele flutua)
            const sombraEscala = 1 - (flutuacao + 8) / 40;
            ctx.fillStyle = `rgba(0,0,0,${0.25 + 0.1 * (1 - sombraEscala)})`;
            ctx.beginPath();
            ctx.ellipse(centroX, sy + sabio.altura + 4, r * 0.7 * sombraEscala, 5 * sombraEscala, 0, 0, Math.PI * 2);
            ctx.fill();

            // Aura mágica pulsante ao redor do mago
            const pulsoAura = 0.7 + Math.sin(tempoGlobal * 0.08) * 0.3;
            const raioAura = r * 1.8;
            const gradAura = ctx.createRadialGradient(centroX, centroY, 0, centroX, centroY, raioAura);
            gradAura.addColorStop(0, `rgba(120, 200, 255, ${0.35 * pulsoAura})`);
            gradAura.addColorStop(0.6, `rgba(80, 160, 255, ${0.15 * pulsoAura})`);
            gradAura.addColorStop(1, 'rgba(80, 160, 255, 0)');
            ctx.fillStyle = gradAura;
            ctx.beginPath();
            ctx.arc(centroX, centroY, raioAura, 0, Math.PI * 2);
            ctx.fill();

            // Desenhar o mago com rotação leve
            ctx.save();
            ctx.translate(centroX, centroY);
            ctx.rotate(rotacaoLeve);

            if (imgMago.complete && imgMago.naturalWidth !== 0) {
                // Imagem do mago
                const larguraMago = r * 2.4;
                const alturaMago = r * 2.8;
                ctx.shadowColor = 'rgba(120, 200, 255, 0.6)';
                ctx.shadowBlur = 15 * pulsoAura;
                ctx.drawImage(
                    imgMago,
                    -larguraMago / 2,
                    -alturaMago / 2,
                    larguraMago,
                    alturaMago
                );
                ctx.shadowBlur = 0;
            } else {
                // Fallback: triângulo azul caso a imagem não carregue
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = sabio.cor;
                ctx.beginPath();
                ctx.moveTo(0, -r);
                ctx.lineTo(r, r);
                ctx.lineTo(-r, r);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            ctx.restore();

            // Partículas mágicas flutuando ao redor do mago
            for (let i = 0; i < 5; i++) {
                const fase = tempoGlobal * 0.05 + i * 1.3;
                const raioOrbita = r * 1.4;
                const orbX = centroX + Math.cos(fase) * raioOrbita;
                const orbY = centroY + Math.sin(fase * 1.5) * raioOrbita * 0.6;
                const tamanhoOrb = 2 + Math.sin(fase * 2) * 1;

                ctx.fillStyle = `rgba(150, 220, 255, ${0.6 + Math.sin(fase * 3) * 0.3})`;
                ctx.shadowColor = '#88ddff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(orbX, orbY, tamanhoOrb, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================
        // DESENHAR CENÁRIO DE FUNDO
        // ============================================
        function desenharCenarioFundo() {
            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, W, H);
            } else {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a2a6c');
                grad.addColorStop(0.5, '#b21f1f');
                grad.addColorStop(1, '#fdbb2d');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }

            const raioSol = 60 + Math.sin(tempoGlobal * 0.02) * 5;
            const solX = W * 0.8 - cameraX * 0.02;
            const solY = H * 0.2;
            const gradSol = ctx.createRadialGradient(solX, solY, 0, solX, solY, raioSol * 3);
            gradSol.addColorStop(0, 'rgba(255, 240, 150, 0.9)');
            gradSol.addColorStop(0.3, 'rgba(255, 200, 80, 0.5)');
            gradSol.addColorStop(1, 'rgba(255, 200, 80, 0)');
            ctx.fillStyle = gradSol;
            ctx.beginPath();
            ctx.arc(solX, solY, raioSol * 3, 0, Math.PI * 2);
            ctx.fill();

            for (let n of nuvens) {
                ctx.globalAlpha = n.opacidade;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 25 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x + 25 * n.escala, n.y + 5, 20 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x - 25 * n.escala, n.y + 5, 18 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x + 10 * n.escala, n.y - 12 * n.escala, 18 * n.escala, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function desenharMatinhos() {
            for (let m of matinhos) {
                const mx = m.x - cameraX;
                if (mx < -20 || mx > W + 20) continue;
                const balanco = Math.sin(tempoGlobal * 0.05 + m.fase) * 2;
                ctx.strokeStyle = m.cor;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(mx, chaoY);
                ctx.quadraticCurveTo(mx + balanco * 0.5, chaoY - m.altura * 0.6, mx + balanco, chaoY - m.altura);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mx, chaoY);
                ctx.quadraticCurveTo(mx - balanco * 0.5, chaoY - m.altura * 0.5, mx - balanco, chaoY - m.altura * 0.8);
                ctx.stroke();
            }
            ctx.lineCap = 'butt';
        }

        function desenharParticulasAmbiente() {
            for (let p of particulasAmbiente) {
                const brilho = 0.4 + Math.sin(p.brilho) * 0.3;
                ctx.globalAlpha = brilho;
                ctx.fillStyle = p.cor;
                ctx.shadowColor = p.cor;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        // ============================================
        // RENDERIZAÇÃO
        // ============================================
        function draw() {
            ctx.clearRect(0, 0, W, H);

            desenharCenarioFundo();

            for (let plat of platforms) {
                const sx = plat.x - cameraX;
                const sy = plat.y;
                if (plat.y === chaoY) {
                    ctx.fillStyle = '#4a7c59';
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    const brilho = 0.8 + Math.sin(tempoGlobal * 0.03) * 0.2;
                    ctx.fillStyle = `rgba(90, 160, 110, ${brilho})`;
                    ctx.fillRect(sx, sy, plat.width, 4);
                } else {
                    if (imgPlataforma.complete && imgPlataforma.naturalWidth !== 0) {
                        ctx.drawImage(imgPlataforma, sx, sy, plat.width, plat.height);
                    } else {
                        ctx.fillStyle = '#8e44ad';
                        ctx.shadowColor = 'rgba(0,0,0,0.4)';
                        ctx.shadowBlur = 12;
                        ctx.fillRect(sx, sy, plat.width, plat.height);
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#6c3483';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(sx, sy, plat.width, plat.height);
                    }
                }
            }

            desenharMatinhos();

            for (let espinho of ESPINHOS) {
                const ex = espinho.x - cameraX;
                const ey = espinho.y;
                const pulso = 0.8 + Math.sin(tempoGlobal * 0.08 + espinho.x) * 0.2;
                ctx.fillStyle = '#e74c3c';
                ctx.shadowColor = `rgba(231,76,60,${0.4 + pulso * 0.2})`;
                ctx.shadowBlur = 12 * pulso + 6;
                ctx.beginPath();
                ctx.moveTo(ex + espinho.w/2, ey - 3 * pulso);
                ctx.lineTo(ex + espinho.w, ey + espinho.h);
                ctx.lineTo(ex, ey + espinho.h);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            for (let buraco of BURACOS) {
                const bx = buraco.inicio - cameraX;
                ctx.fillStyle = 'rgba(255,0,0,0.15)';
                ctx.fillRect(bx, chaoY, buraco.fim - buraco.inicio, 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '16px "Pixelify Sans", monospace';
                ctx.fillText('💀', bx + 10, chaoY - 10);
            }

            for (let m of moedasArray) {
                if (m.coletada) continue;
                const mx = m.x - cameraX;
                const flutuacao = Math.sin(tempoGlobal * 0.06 + m.fase) * 3;
                const my = m.y + flutuacao;
                const escala = 0.9 + Math.sin(tempoGlobal * 0.1 + m.fase) * 0.1;

                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15 + Math.sin(tempoGlobal * 0.1 + m.fase) * 5;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(mx, my, m.raio * escala, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(mx - 2, my - 2, m.raio * escala * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(mx - 3, my - 3, m.raio * escala * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let cp of checkpoints) {
                const cx = cp.x - cameraX;
                const cy = cp.y;
                ctx.fillStyle = '#888';
                ctx.fillRect(cx + 4, cy, 3, cp.h);
                const onda = Math.sin(tempoGlobal * 0.1 + cp.x * 0.01) * 3;
                ctx.fillStyle = cp.ativado ? '#2ecc71' : 'rgba(255,255,255,0.9)';
                ctx.shadowColor = cp.ativado ? '#2ecc71' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = cp.ativado ? 15 : 8;
                ctx.beginPath();
                ctx.moveTo(cx + 7, cy + 5);
                ctx.quadraticCurveTo(cx + 20, cy + 12 + onda, cx + 30, cy + 15);
                ctx.lineTo(cx + 7, cy + 30);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // ============================================
            // SÁBIO (MAGO) - substitui o triângulo
            // ============================================
            const sxSabio = sabio.x - cameraX;
            const sySabio = sabio.y;
            desenharSabio(sxSabio, sySabio);

            // Balão de fala do mago (posicionado acima dele)
            if (sabio.conversaAtiva && !sabio.conversaTerminada) {
                const falaAtual = sabio.falas[sabio.falaIndex] || '';
                ctx.font = '16px "Pixelify Sans", monospace';
                const larguraTexto = ctx.measureText(falaAtual).width;
                const padding = 20;
                const bw = Math.max(larguraTexto + padding * 2, 60);
                const bh = 24 + padding;

                // Posição do balão acompanha a flutuação
                const flutuacao = Math.sin(tempoGlobal * 0.04) * 8;
                const balancoX = Math.cos(tempoGlobal * 0.03) * 2;
                const bx = sxSabio + sabio.largura/2 - bw/2 + balancoX;
                const by = sySabio - bh - 16 + flutuacao;

                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(bx, by, bw, bh, 12);
                ctx.stroke();
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.beginPath();
                ctx.moveTo(sxSabio + sabio.largura/2 - 8 + balancoX, by + bh);
                ctx.lineTo(sxSabio + sabio.largura/2 + balancoX, by + bh + 12);
                ctx.lineTo(sxSabio + sabio.largura/2 + 8 + balancoX, by + bh);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(sxSabio + sabio.largura/2 - 8 + balancoX, by + bh);
                ctx.lineTo(sxSabio + sabio.largura/2 + balancoX, by + bh + 12);
                ctx.lineTo(sxSabio + sabio.largura/2 + 8 + balancoX, by + bh);
                ctx.stroke();

                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#222';
                ctx.shadowBlur = 0;
                ctx.fillText(falaAtual, bx + bw/2, by + bh/2);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            for (let mob of mobs) {
                if (mob.morto) continue;
                const mx = mob.x - cameraX;
                const my = mob.y;

                if (mob.tipo === 'voador') {
                    desenharMorcego(mx, my, mob);
                } else {
                    desenharOrc(mx, my, mob);
                }

                const offsetBarra = mob.tipo === 'voador' ? mob.radius * 1.9 : mob.radius * 1.75;
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.fillRect(mx - mob.radius, my - offsetBarra, mob.radius * 2, 4);
                ctx.fillStyle = 'rgba(0,255,0,0.7)';
                ctx.fillRect(mx - mob.radius, my - offsetBarra, mob.radius * 2 * (mob.hp / 2), 4);
            }

            if (!gameOver) {
                const px = player.x - cameraX;
                const py = player.y;
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(px + player.w/2, chaoY + 3, player.w * 0.5, 4, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(px, py, player.w, player.h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.strokeRect(px, py, player.w, player.h);

                const eyeSize = player.w * 0.2;
                const eyeOffset = player.w * 0.2;
                ctx.fillStyle = '#fff';
                ctx.fillRect(px + eyeOffset, py + eyeOffset, eyeSize, eyeSize);
                ctx.fillRect(px + player.w - eyeOffset - eyeSize, py + eyeOffset, eyeSize, eyeSize);
                ctx.fillStyle = '#2c3e50';
                const pupil = eyeSize * 0.4;
                ctx.fillRect(px + eyeOffset + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);
                ctx.fillRect(px + player.w - eyeOffset - eyeSize + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);

                if (temEspada) {
                    const progressoAtaque = atacando ? (ataqueTimer / DURACAO_ATAQUE) : 0;
                    desenharEspadaMagica(px, py, player.w, player.h, atacando, progressoAtaque);
                }
            }

            desenharParticulas();
            desenharParticulasAmbiente();

            if (!gameOver) {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = '20px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText('❤️ ' + vidas, 20, 40);
                ctx.fillText('Nível ' + nivelAtual, 20, 70);
                ctx.fillText('🪙 ' + moedas, 20, 100);
                if (temEspada) {
                    ctx.fillStyle = 'rgba(120, 220, 255, 0.9)';
                    ctx.fillText('🗡️ Espada Mágica', 20, 130);
                }
                ctx.shadowBlur = 0;

                const progresso = Math.min(1, player.x / WORLD_WIDTH);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(W/2 - 100, 20, 200, 8);
                ctx.fillStyle = 'rgba(46, 204, 113, 0.6)';
                ctx.fillRect(W/2 - 100, 20, 200 * progresso, 8);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.strokeRect(W/2 - 100, 20, 200, 8);
            }

            if (mostrarTitulo && !gameOver) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 80px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('NÍVEL 1', W/2, H/2 - 50);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            if (mostrarTituloNivel2 && !gameOver) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 80px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('NÍVEL 2', W/2, H/2 - 50);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            if (mostrarTituloNivel3 && !gameOver) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 80px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('NÍVEL 3', W/2, H/2 - 50);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            if (nivelConcluido) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(46, 204, 113, 0.9)';
                ctx.font = 'bold 60px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('🏆 JOGO CONCLUÍDO! 🏆', W/2, H/2);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            if (gameOver) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 90px "Pixelify Sans", monospace';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 40;
                ctx.fillText('PERDEU OTÁRIO', W/2, H/2 - 30);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px "Pixelify Sans", monospace';
                ctx.fillText('Pressione R para reiniciar', W/2, H/2 + 70);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resize() {
            isResizing = true;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;

            const newChaoAltura = Math.floor(H * 0.15);
            const newPlayerSize = Math.min(W, H) * 0.045;
            const newMobRadius = Math.min(W, H) * 0.025;
            const newPlatformWidth = 120;

            const novoChaoY = H - newChaoAltura;
            const deltaY = novoChaoY - chaoY;
            chaoY = novoChaoY;

            for (let plat of platforms) {
                if (plat.y === chaoY - deltaY) {
                    plat.y = chaoY;
                    plat.height = newChaoAltura;
                } else {
                    plat.y += deltaY;
                    plat.height = 20;
                    plat.width = newPlatformWidth;
                }
            }

            for (let espinho of ESPINHOS) espinho.y += deltaY;
            for (let mob of mobs) { mob.radius = newMobRadius; mob.y += deltaY; }
            for (let cp of checkpoints) cp.y += deltaY;
            sabio.y += deltaY;
            for (let m of moedasArray) m.y += deltaY;

            player.w = newPlayerSize;
            player.h = newPlayerSize;
            if (player.onGround || player.y + player.h > chaoY) {
                player.y = chaoY - player.h;
                player.onGround = true;
            } else {
                player.y += deltaY;
            }
            player.spawnY = chaoY - player.h;
            checkpointY = player.spawnY;

            ajustarPosicaoBuraco();
            inicializarCenario();

            setTimeout(() => { isResizing = false; }, 50);
        }

        window.addEventListener('resize', resize);

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault(); keys[key] = true;
            }
            if (key === ' ') { e.preventDefault(); executarAtaque(); }
            if (key === 'r') { e.preventDefault(); if (gameOver) restartGame(); }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault(); keys[key] = false;
            }
        });

        gerarMoedas();
        resize();
        checkpointY = player.spawnY;
        gameLoop();
    </script>
</body>
</html>
