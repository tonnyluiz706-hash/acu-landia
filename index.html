            ctx.beginPath(); ctx.moveTo(0, 3 * escala); ctx.lineTo(0, -42 * escala); ctx.stroke();
            const runaPulso = 0.5 + Math.sin(tempoGlobal * 0.15) * 0.5;
            ctx.strokeStyle = `rgba(120, 220, 255, ${runaPulso * intensidadeAtaque})`;
            ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 8 * pulso; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -20 * escala); ctx.lineTo(2.5 * escala, -17 * escala);
            ctx.lineTo(0, -14 * escala); ctx.lineTo(-2.5 * escala, -17 * escala);
            ctx.closePath(); ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
            const numFaiscas = estaAtacando ? 9 : 4;
            for (let i = 0; i < numFaiscas; i++) {
                const faseFaisca = tempoGlobal * 0.08 + i * 1.5;
                const raio = 18 + Math.sin(faseFaisca * 1.3) * 6;
                const fx = maoX + Math.cos(faseFaisca) * raio;
                const fy = maoY + flutuacao + Math.sin(faseFaisca * 0.8) * raio - 5;
                const tamanhoFaisca = 1.5 + Math.sin(faseFaisca * 2) * 1;
                ctx.fillStyle = `rgba(150, 230, 255, ${0.6 + Math.sin(faseFaisca * 3) * 0.3})`;
                ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.arc(fx, fy, tamanhoFaisca, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function desenharCipo(cip) {
            const ax = cip.ancoraX - cameraX, ay = cip.ancoraY;
            const px = cip.pontaX - cameraX, py = cip.pontaY;
            ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, py); ctx.stroke();
            ctx.strokeStyle = '#6b8a3a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(px, py); ctx.stroke();
            ctx.fillStyle = '#4a6a2a';
            for (let i = 0.2; i < 0.9; i += 0.2) {
                const fx = ax + (px - ax) * i, fy = ay + (py - ay) * i;
                ctx.beginPath(); ctx.ellipse(fx + 6, fy, 6, 3, 0.5, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(fx - 6, fy, 6, 3, -0.5, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = '#3a1a00';
            ctx.beginPath(); ctx.arc(ax, ay, 7, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(px, py, 9, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2; ctx.stroke();
            if (!jogadorAgravado && cooldownCipo <= 0) {
                const distX = Math.abs((player.x + player.w/2) - cip.pontaX);
                const distY = Math.abs((player.y + player.h/2) - cip.pontaY);
                if (distX < 250 && distY < 250) {
                    const pulso = 0.6 + Math.sin(tempoGlobal * 0.25) * 0.4;
                    ctx.strokeStyle = `rgba(255, 255, 100, ${pulso})`; ctx.lineWidth = 3;
                    ctx.beginPath(); ctx.arc(px, py, 40 + Math.sin(tempoGlobal * 0.2) * 4, 0, Math.PI * 2); ctx.stroke();
                    ctx.fillStyle = `rgba(255, 255, 100, ${pulso})`;
                    ctx.font = 'bold 14px "Pixelify Sans", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('ESPAÇO', px, py - 50);
                    ctx.textAlign = 'left';
                }
            }
        }

        function desenharSabio(sx, sy) {
            const r = sabio.largura / 2;
            const flutuacao = Math.sin(tempoGlobal * 0.04) * 8;
            const balancoX = Math.cos(tempoGlobal * 0.03) * 2;
            const rotacaoLeve = Math.sin(tempoGlobal * 0.025) * 0.04;
            const tamanhoMago = sabio.largura * 4;
            const centroX = sx + r + balancoX;
            const centroY = sy + sabio.altura / 2 + flutuacao - tamanhoMago * 1.2 * 0.15;
            const sombraEscala = 1 - (flutuacao + 8) / 60;
            ctx.fillStyle = `rgba(0,0,0,${0.25 + 0.1 * (1 - sombraEscala)})`;
            ctx.beginPath(); ctx.ellipse(centroX, sy + sabio.altura + 4, tamanhoMago * 0.35 * sombraEscala, 6 * sombraEscala, 0, 0, Math.PI * 2); ctx.fill();
            const pulsoAura = 0.7 + Math.sin(tempoGlobal * 0.08) * 0.3;
            const raioAura = tamanhoMago * 0.7;
            const gradAura = ctx.createRadialGradient(centroX, centroY, 0, centroX, centroY, raioAura);
            gradAura.addColorStop(0, `rgba(120, 200, 255, ${0.4 * pulsoAura})`);
            gradAura.addColorStop(0.6, `rgba(80, 160, 255, ${0.18 * pulsoAura})`);
            gradAura.addColorStop(1, 'rgba(80, 160, 255, 0)');
            ctx.fillStyle = gradAura;
            ctx.beginPath(); ctx.arc(centroX, centroY, raioAura, 0, Math.PI * 2); ctx.fill();
            ctx.save();
            ctx.translate(centroX, centroY); ctx.rotate(rotacaoLeve);
            if (imgMago.complete && imgMago.naturalWidth !== 0) {
                ctx.shadowColor = 'rgba(120, 200, 255, 0.7)'; ctx.shadowBlur = 20 * pulsoAura;
                ctx.drawImage(imgMago, -tamanhoMago / 2, -tamanhoMago * 1.2 / 2, tamanhoMago, tamanhoMago * 1.2);
                ctx.shadowBlur = 0;
            } else {
                ctx.fillStyle = sabio.cor;
                ctx.beginPath();
                ctx.moveTo(0, -tamanhoMago * 1.2 / 2);
                ctx.lineTo(tamanhoMago / 2, tamanhoMago * 1.2 / 2);
                ctx.lineTo(-tamanhoMago / 2, tamanhoMago * 1.2 / 2);
                ctx.closePath(); ctx.fill();
            }
            ctx.restore();
            for (let i = 0; i < 6; i++) {
                const fase = tempoGlobal * 0.05 + i * 1.3;
                const raioOrbita = tamanhoMago * 0.55;
                const orbX = centroX + Math.cos(fase) * raioOrbita;
                const orbY = centroY + Math.sin(fase * 1.5) * raioOrbita * 0.5;
                const tamanhoOrb = 2.5 + Math.sin(fase * 2) * 1.5;
                ctx.fillStyle = `rgba(150, 220, 255, ${0.6 + Math.sin(fase * 3) * 0.3})`;
                ctx.shadowColor = '#88ddff'; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(orbX, orbY, tamanhoOrb, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function desenharCenarioFundo() {
            if (bgImage.complete && bgImage.naturalWidth !== 0) ctx.drawImage(bgImage, 0, 0, W, H);
            else {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a2a6c'); grad.addColorStop(0.5, '#b21f1f'); grad.addColorStop(1, '#fdbb2d');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);
            }
            const raioSol = 60 + Math.sin(tempoGlobal * 0.02) * 5;
            const solX = W * 0.8 - cameraX * 0.02, solY = H * 0.2;
            const gradSol = ctx.createRadialGradient(solX, solY, 0, solX, solY, raioSol * 3);
            gradSol.addColorStop(0, 'rgba(255, 240, 150, 0.9)');
            gradSol.addColorStop(0.3, 'rgba(255, 200, 80, 0.5)');
            gradSol.addColorStop(1, 'rgba(255, 200, 80, 0)');
            ctx.fillStyle = gradSol;
            ctx.beginPath(); ctx.arc(solX, solY, raioSol * 3, 0, Math.PI * 2); ctx.fill();
            for (let n of nuvens) {
                ctx.globalAlpha = n.opacidade;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 25 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x + 25 * n.escala, n.y + 5, 20 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x - 25 * n.escala, n.y + 5, 18 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x + 10 * n.escala, n.y - 12 * n.escala, 18 * n.escala, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function desenharMatinhos() {
            for (let m of matinhos) {
                const mx = m.x - cameraX;
                if (mx < -20 || mx > W + 20) continue;
                const balanco = Math.sin(tempoGlobal * 0.05 + m.fase) * 2;
                ctx.strokeStyle = m.cor; ctx.lineWidth = 2; ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(mx, chaoY);
                ctx.quadraticCurveTo(mx + balanco * 0.5, chaoY - m.altura * 0.6, mx + balanco, chaoY - m.altura);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mx, chaoY);
                ctx.quadraticCurveTo(mx - balanco * 0.5, chaoY - m.altura * 0.5, mx - balanco, chaoY - m.altura * 0.8);
                ctx.stroke();
            }
            ctx.lineCap = 'butt';
        }

        function desenharParticulas() {
            for (let p of particulas) {
                const op = p.vida / p.vidaMax;
                ctx.globalAlpha = op;
                ctx.fillStyle = p.cor; ctx.shadowColor = p.cor; ctx.shadowBlur = 8;
                ctx.beginPath(); ctx.arc(p.x - cameraX, p.y, p.tamanho * op, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        function desenharParticulasAmbiente() {
            for (let p of particulasAmbiente) {
                const brilho = 0.4 + Math.sin(p.brilho) * 0.3;
                ctx.globalAlpha = brilho;
                ctx.fillStyle = p.cor; ctx.shadowColor = p.cor; ctx.shadowBlur = 6;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        function desenharFolhas() {
            for (let f of folhas) {
                ctx.save();
                ctx.translate(f.x, f.y); ctx.rotate(f.rotacao);
                ctx.fillStyle = f.cor; ctx.globalAlpha = 0.75;
                ctx.beginPath(); ctx.ellipse(0, 0, f.tamanho, f.tamanho * 0.45, 0, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 0.4; ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 0.8;
                ctx.beginPath(); ctx.moveTo(-f.tamanho, 0); ctx.lineTo(f.tamanho, 0); ctx.stroke();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
        }

        function desenharBorboletas() {
            for (let b of borboletas) {
                const asaBat = Math.sin(tempoGlobal * 0.3 + b.fase) * 0.7 + 0.3;
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.fillStyle = b.cor;
                ctx.globalAlpha = 0.85;
                ctx.save(); ctx.rotate(-asaBat * 0.6);
                ctx.beginPath(); ctx.ellipse(-b.tamanho * 0.6, 0, b.tamanho * 0.5, b.tamanho * 0.35, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                ctx.save(); ctx.rotate(asaBat * 0.6);
                ctx.beginPath(); ctx.ellipse(b.tamanho * 0.6, 0, b.tamanho * 0.5, b.tamanho * 0.35, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                ctx.fillStyle = '#3a2a1a';
                ctx.beginPath(); ctx.ellipse(0, 0, b.tamanho * 0.15, b.tamanho * 0.5, 0, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
        }

        function desenharCaverna() {
            const cvx = caverna.x - cameraX;
            const baseY = chaoY;
            const topoY = chaoY - caverna.h;

            ctx.fillStyle = '#2a2530';
            ctx.strokeStyle = '#0a0810';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(cvx - 260, baseY);
            ctx.lineTo(cvx - 200, baseY - 120);
            ctx.lineTo(cvx - 140, baseY - 60);
            ctx.lineTo(cvx - 100, baseY - 200);
            ctx.lineTo(cvx - 40, baseY - 100);
            ctx.lineTo(cvx + 30, baseY - 240);
            ctx.lineTo(cvx + 100, baseY - 120);
            ctx.lineTo(cvx + 160, baseY - 220);
            ctx.lineTo(cvx + 240, baseY - 100);
            ctx.lineTo(cvx + 300, baseY - 180);
            ctx.lineTo(cvx + 380, baseY - 60);
            ctx.lineTo(cvx + caverna.w + 200, baseY);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 12; i++) {
                const rx = cvx - 200 + i * 60;
                const ry = baseY - 80 - Math.sin(i * 0.7) * 60;
                ctx.beginPath();
                ctx.moveTo(rx, ry);
                ctx.lineTo(rx + 15, ry + 30);
                ctx.lineTo(rx + 5, ry + 50);
                ctx.stroke();
            }

            ctx.fillStyle = '#1a1520';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            const estalactites = [cvx - 80, cvx - 20, cvx + 60, cvx + 140, cvx + 240, cvx + 320];
            for (let i = 0; i < estalactites.length; i++) {
                const ex = estalactites[i];
                const alt = 30 + Math.sin(i * 1.3) * 20;
                const ey = topoY - 20;
                ctx.beginPath();
                ctx.moveTo(ex - 12, ey);
                ctx.lineTo(ex, ey + alt);
                ctx.lineTo(ex + 12, ey);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
            }

            const centroCavX = cvx + caverna.w / 2;
            const entradaW = 100;
            const entradaH = 180;
            const entradaY = baseY - entradaH;
            const gradCav = ctx.createRadialGradient(centroCavX, entradaY + entradaH * 0.5, 10, centroCavX, entradaY + entradaH * 0.5, entradaH);
            gradCav.addColorStop(0, boss.morto ? '#000' : '#1a0010');
            gradCav.addColorStop(0.5, '#000');
            gradCav.addColorStop(1, '#000');
            ctx.fillStyle = gradCav;
            ctx.beginPath();
            ctx.moveTo(centroCavX - entradaW, baseY);
            ctx.quadraticCurveTo(centroCavX - entradaW, entradaY + 30, centroCavX, entradaY);
            ctx.quadraticCurveTo(centroCavX + entradaW, entradaY + 30, centroCavX + entradaW, baseY);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#3a2a3a';
            ctx.lineWidth = 4;
            ctx.stroke();

            if (!boss.morto) {
                const pulso = 0.4 + Math.sin(tempoGlobal * 0.08) * 0.3;
                const gradLava = ctx.createRadialGradient(centroCavX, entradaY + entradaH * 0.7, 10, centroCavX, entradaY + entradaH * 0.7, entradaH * 0.9);
                gradLava.addColorStop(0, `rgba(255, 60, 0, ${pulso * 0.7})`);
                gradLava.addColorStop(0.4, `rgba(180, 20, 60, ${pulso * 0.4})`);
                gradLava.addColorStop(1, 'rgba(80, 0, 30, 0)');
                ctx.fillStyle = gradLava;
                ctx.beginPath();
                ctx.moveTo(centroCavX - entradaW + 10, baseY);
                ctx.quadraticCurveTo(centroCavX - entradaW + 10, entradaY + 40, centroCavX, entradaY + 10);
                ctx.quadraticCurveTo(centroCavX + entradaW - 10, entradaY + 40, centroCavX + entradaW - 10, baseY);
                ctx.closePath();
                ctx.fill();

                if (tempoGlobal % 6 === 0) {
                    particulas.push({
                        x: centroCavX + (Math.random() - 0.5) * 100,
                        y: baseY - Math.random() * 50,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -0.5 - Math.random() * 0.8,
                        vida: 40, vidaMax: 40,
                        cor: Math.random() > 0.5 ? '#ff6600' : '#ff2200',
                        tamanho: 2 + Math.random() * 3
                    });
                }
            }

            ctx.fillStyle = '#3a2a3a';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            const pedras = [
                { x: centroCavX - 140, y: baseY - 5, r: 18 },
                { x: centroCavX - 110, y: baseY - 3, r: 12 },
                { x: centroCavX + 120, y: baseY - 4, r: 15 },
                { x: centroCavX + 150, y: baseY - 2, r: 10 }
            ];
            for (let p of pedras) {
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.r, p.r * 0.7, 0, 0, Math.PI * 2);
                ctx.fill(); ctx.stroke();
            }
        }

        function desenharBoss(bx, by) {
            const r = boss.w / 2;
            const flap = Math.sin(boss.batidaAsa) * 0.7;
            const dir = player.x > boss.x ? 1 : -1;
            const pulsoAura = 0.6 + Math.sin(tempoGlobal * 0.08) * 0.4;
            const cargaGlow = boss.carregando > 0 ? (1 - boss.carregando / 45) : 0;
            const boca = boss.bocaAberta;
            const hitFlash = boss.hitFlash || 0;

            ctx.save();
            ctx.translate(bx, by);
            ctx.scale(dir, 1);
            ctx.rotate(boss.rotacaoCorpo);

            const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
            gr.addColorStop(0, `rgba(120, 0, 40, ${0.55 * pulsoAura})`);
            gr.addColorStop(0.5, `rgba(60, 0, 60, ${0.3 * pulsoAura})`);
            gr.addColorStop(1, 'rgba(40, 0, 40, 0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, Math.PI * 2); ctx.fill();

            for (let i = 0; i < 6; i++) {
                const ang = tempoGlobal * 0.03 + i * Math.PI / 3;
                const dist = r * (0.9 + Math.sin(tempoGlobal * 0.05 + i) * 0.15);
                const px = Math.cos(ang) * dist;
                const py = Math.sin(ang) * dist * 0.7;
                const tam = 2 + Math.sin(tempoGlobal * 0.15 + i) * 1.5;
                ctx.fillStyle = `rgba(255, 60, 80, ${0.6 + Math.sin(tempoGlobal * 0.2 + i) * 0.3})`;
                ctx.shadowColor = '#ff3344'; ctx.shadowBlur = 12;
                ctx.beginPath(); ctx.arc(px, py, tam, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
            }

            const desenharAsa = (lado) => {
                ctx.save();
                ctx.scale(lado, 1);
                const gradAsa = ctx.createLinearGradient(0, -r * 0.5, r * 2, r * 0.3);
                gradAsa.addColorStop(0, '#5a1850');
                gradAsa.addColorStop(0.5, '#2a0a30');
                gradAsa.addColorStop(1, '#100818');
                ctx.fillStyle = gradAsa;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(r * 0.35, -15);
                ctx.quadraticCurveTo(r * 1.3, -r * (1.0 + flap * 0.6), r * 2.2, -r * (0.55 + flap * 0.5));
                ctx.lineTo(r * 2.1, -r * 0.25);
                ctx.quadraticCurveTo(r * 1.9, -r * 0.05, r * 1.75, -r * 0.1);
                ctx.quadraticCurveTo(r * 1.55, r * 0.35, r * 1.35, r * 0.1);
                ctx.quadraticCurveTo(r * 1.15, r * 0.4, r * 0.9, r * 0.15);
                ctx.quadraticCurveTo(r * 0.7, r * 0.4, r * 0.5, r * 0.15);
                ctx.lineTo(r * 0.35, 0);
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                ctx.strokeStyle = '#d8c0a0';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(r * 0.35, -15);
                ctx.quadraticCurveTo(r * 1.4, -r * (0.7 + flap * 0.4), r * 2.15, -r * (0.45 + flap * 0.4));
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(r * 0.35, -15);
                ctx.quadraticCurveTo(r * 1.1, r * 0.0, r * 1.75, -r * 0.15);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(r * 0.35, -15);
                ctx.quadraticCurveTo(r * 0.9, r * 0.15, r * 1.35, r * 0.05);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(r * 0.35, -15);
                ctx.quadraticCurveTo(r * 0.7, r * 0.2, r * 0.9, r * 0.1);
                ctx.stroke();
                ctx.lineCap = 'butt';

                ctx.fillStyle = '#e8d8c0';
                ctx.strokeStyle = '#3a2a1a';
                ctx.lineWidth = 1.5;
                for (let i = 0; i < 3; i++) {
                    const gx = r * (1.75 + i * 0.15);
                    const gy = -r * (0.15 + i * 0.1) + flap * r * 0.1;
                    ctx.beginPath();
                    ctx.moveTo(gx, gy - 4);
                    ctx.lineTo(gx + 12, gy - 12);
                    ctx.lineTo(gx + 6, gy + 2);
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                }
                ctx.restore();
            };
            desenharAsa(-1);
            desenharAsa(1);

            const gradCorpo = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 0.7);
            gradCorpo.addColorStop(0, '#5a2050');
            gradCorpo.addColorStop(0.5, '#3a1030');
            gradCorpo.addColorStop(1, '#1a0820');
            ctx.fillStyle = gradCorpo;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 0.5, r * 0.65, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = 'rgba(0,0,0,0.6)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -r * 0.3);
            ctx.lineTo(0, r * 0.4);
            ctx.stroke();
            for (let i = 0; i < 3; i++) {
                const yy = -r * 0.05 + i * r * 0.18;
                ctx.beginPath();
                ctx.moveTo(-r * 0.35, yy);
                ctx.quadraticCurveTo(0, yy + r * 0.05, r * 0.35, yy);
                ctx.stroke();
            }

            ctx.strokeStyle = 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 16; i++) {
                const ang = (Math.PI * 2 / 16) * i;
                const px = Math.cos(ang) * r * 0.46;
                const py = Math.sin(ang) * r * 0.6;
                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(px + Math.cos(ang) * 8, py + Math.sin(ang) * 8);
                ctx.stroke();
            }

            const cabecaY = -r * 0.6;
            const gradCabeca = ctx.createRadialGradient(0, cabecaY - r * 0.05, 0, 0, cabecaY, r * 0.5);
            gradCabeca.addColorStop(0, '#6a2060');
            gradCabeca.addColorStop(0.6, '#3a1030');
            gradCabeca.addColorStop(1, '#1a0820');
            ctx.fillStyle = gradCabeca;
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, cabecaY, r * 0.45, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#c9b896';
            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-r * 0.32, cabecaY - r * 0.32);
            ctx.quadraticCurveTo(-r * 0.65, cabecaY - r * 0.85, -r * 0.55, cabecaY - r * 1.15);
            ctx.quadraticCurveTo(-r * 0.45, cabecaY - r * 0.9, -r * 0.18, cabecaY - r * 0.4);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.32, cabecaY - r * 0.32);
            ctx.quadraticCurveTo(r * 0.65, cabecaY - r * 0.85, r * 0.55, cabecaY - r * 1.15);
            ctx.quadraticCurveTo(r * 0.45, cabecaY - r * 0.9, r * 0.18, cabecaY - r * 0.4);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#8a7a5a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-r * 0.4, cabecaY - r * 0.55);
            ctx.quadraticCurveTo(-r * 0.5, cabecaY - r * 0.8, -r * 0.5, cabecaY - r * 1.0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.4, cabecaY - r * 0.55);
            ctx.quadraticCurveTo(r * 0.5, cabecaY - r * 0.8, r * 0.5, cabecaY - r * 1.0);
            ctx.stroke();

            const olhoDirX = (player.x - boss.x) / 400;
            const olhoDirY = (player.y - boss.y) / 400;

            ctx.fillStyle = `rgba(255, 140, 60, ${0.7 + Math.sin(tempoGlobal * 0.3) * 0.3})`;
            ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(-r * 0.22, cabecaY - r * 0.18, 3, 0, Math.PI * 2);
            ctx.arc(r * 0.22, cabecaY - r * 0.18, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            const eyeIntensity = 0.7 + Math.sin(tempoGlobal * 0.15) * 0.3 + cargaGlow * 0.5;
            ctx.fillStyle = `rgba(255, 30, 0, ${0.5 * eyeIntensity})`;
            ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 35;
            ctx.beginPath();
            ctx.arc(-r * 0.18, cabecaY + r * 0.02, 14, 0, Math.PI * 2);
            ctx.arc(r * 0.18, cabecaY + r * 0.02, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#ff4400';
            ctx.beginPath();
            ctx.arc(-r * 0.18, cabecaY + r * 0.02, 9, 0, Math.PI * 2);
            ctx.arc(r * 0.18, cabecaY + r * 0.02, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffcc00';
            ctx.beginPath();
            ctx.arc(-r * 0.18, cabecaY + r * 0.02, 5, 0, Math.PI * 2);
            ctx.arc(r * 0.18, cabecaY + r * 0.02, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-r * 0.18 + olhoDirX * 3, cabecaY + r * 0.02 + olhoDirY * 3, 3, 0, Math.PI * 2);
            ctx.arc(r * 0.18 + olhoDirX * 3, cabecaY + r * 0.02 + olhoDirY * 3, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(-r * 0.2, cabecaY - r * 0.01, 1.8, 0, Math.PI * 2);
            ctx.arc(r * 0.16, cabecaY - r * 0.01, 1.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#2a0820';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-r * 0.32, cabecaY - r * 0.15);
            ctx.lineTo(-r * 0.05, cabecaY - r * 0.02);
            ctx.lineTo(-r * 0.05, cabecaY - r * 0.1);
            ctx.lineTo(-r * 0.32, cabecaY - r * 0.24);
            ctx.closePath(); ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.32, cabecaY - r * 0.15);
            ctx.lineTo(r * 0.05, cabecaY - r * 0.02);
            ctx.lineTo(r * 0.05, cabecaY - r * 0.1);
            ctx.lineTo(r * 0.32, cabecaY - r * 0.24);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#3a1030';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.ellipse(0, cabecaY + r * 0.14, r * 0.12, r * 0.08, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-r * 0.04, cabecaY + r * 0.14, 2, 0, Math.PI * 2);
            ctx.arc(r * 0.04, cabecaY + r * 0.14, 2, 0, Math.PI * 2);
            ctx.fill();

            const bocaY = cabecaY + r * 0.28;
            const alturaBoca = r * 0.14 * (0.4 + boca * 1.3);
            ctx.fillStyle = '#1a0000';
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(0, bocaY, r * 0.22, alturaBoca, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();

            if (cargaGlow > 0) {
                const grBoca = ctx.createRadialGradient(0, bocaY, 0, 0, bocaY, r * 0.4);
                grBoca.addColorStop(0, `rgba(255, 240, 100, ${cargaGlow})`);
                grBoca.addColorStop(0.4, `rgba(255, 100, 0, ${cargaGlow * 0.9})`);
                grBoca.addColorStop(1, 'rgba(255, 0, 0, 0)');
                ctx.fillStyle = grBoca;
                ctx.beginPath(); ctx.arc(0, bocaY, r * 0.4, 0, Math.PI * 2); ctx.fill();
            }

            ctx.fillStyle = '#fff8e0';
            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 1.5;
            const presasSup = [-0.15, -0.07, 0.07, 0.15];
            for (let i = 0; i < presasSup.length; i++) {
                const px = presasSup[i] * r;
                const altP = (0.3 + Math.abs(Math.sin(i)) * 0.2) * alturaBoca;
                ctx.beginPath();
                ctx.moveTo(px - r * 0.035, bocaY - alturaBoca * 0.6);
                ctx.lineTo(px, bocaY - alturaBoca * 0.6 + altP);
                ctx.lineTo(px + r * 0.035, bocaY - alturaBoca * 0.6);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }
            const presasInf = [-0.12, -0.03, 0.03, 0.12];
            for (let i = 0; i < presasInf.length; i++) {
                const px = presasInf[i] * r;
                const altP = (0.25 + Math.abs(Math.cos(i)) * 0.15) * alturaBoca;
                ctx.beginPath();
                ctx.moveTo(px - r * 0.03, bocaY + alturaBoca * 0.6);
                ctx.lineTo(px, bocaY + alturaBoca * 0.6 - altP);
                ctx.lineTo(px + r * 0.03, bocaY + alturaBoca * 0.6);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }

            ctx.fillStyle = '#c9b896';
            ctx.strokeStyle = '#3a2a1a';
            ctx.lineWidth = 2;
            for (let i = 0; i < 5; i++) {
                const ang = -Math.PI * 0.7 + (i / 4) * Math.PI * 0.4;
                const px = Math.cos(ang) * r * 0.35;
                const py = cabecaY - r * 0.35 + Math.sin(ang) * r * 0.05;
                ctx.beginPath();
                ctx.moveTo(px - 4, py + 4);
                ctx.lineTo(px, py - 8);
                ctx.lineTo(px + 4, py + 4);
                ctx.closePath(); ctx.fill(); ctx.stroke();
            }

            if (hitFlash > 0) {
                const alphaFlash = Math.min(0.6, hitFlash / 12);
                ctx.fillStyle = `rgba(255, 255, 255, ${alphaFlash})`;
                ctx.beginPath();
                ctx.arc(0, 0, r * 1.1, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            desenharCenarioFundo();

            for (let plat of platforms) {
                const sx = plat.x - cameraX, sy = plat.y;
                if (plat.y === chaoY) {
                    ctx.fillStyle = '#4a7c59';
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    const brilho = 0.8 + Math.sin(tempoGlobal * 0.03) * 0.2;
                    ctx.fillStyle = `rgba(90, 160, 110, ${brilho})`;
                    ctx.fillRect(sx, sy, plat.width, 4);
                } else {
                    if (imgPlataforma.complete && imgPlataforma.naturalWidth !== 0) {
                        ctx.drawImage(imgPlataforma, sx, sy, plat.width, plat.height);
                    } else {
                        ctx.fillStyle = '#8e44ad';
                        ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 12;
                        ctx.fillRect(sx, sy, plat.width, plat.height);
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#6c3483'; ctx.lineWidth = 2;
                        ctx.strokeRect(sx, sy, plat.width, plat.height);
                    }
                }
            }

            for (let pp of PLATAFORMAS_PODRES) {
                if (pp.destruida) continue;
                const sx = pp.x - cameraX;
                const tremorX = pp.tremendo ? (Math.random() - 0.5) * 4 : 0;
                const tremorY = pp.tremendo ? (Math.random() - 0.5) * 2 : 0;
                ctx.globalAlpha = pp.alpha;
                if (imgPlataformaPodre.complete && imgPlataformaPodre.naturalWidth !== 0) {
                    ctx.drawImage(imgPlataformaPodre, sx + tremorX, pp.y + tremorY, pp.w, pp.h);
                } else {
                    ctx.fillStyle = pp.tremendo ? '#6a3a1a' : '#8a5a3a';
                    ctx.fillRect(sx + tremorX, pp.y + tremorY, pp.w, pp.h);
                    ctx.strokeStyle = '#3a1a00'; ctx.lineWidth = 2;
                    ctx.strokeRect(sx + tremorX, pp.y + tremorY, pp.w, pp.h);
                }
                ctx.globalAlpha = 1;
            }

            desenharMatinhos();

            for (let espinho of ESPINHOS) {
                const ex = espinho.x - cameraX, ey = espinho.y;
                const pulso = 0.8 + Math.sin(tempoGlobal * 0.08 + espinho.x) * 0.2;
                ctx.fillStyle = '#e74c3c';
                ctx.shadowColor = `rgba(231,76,60,${0.4 + pulso * 0.2})`;
                ctx.shadowBlur = 12 * pulso + 6;
                ctx.beginPath();
                ctx.moveTo(ex + espinho.w/2, ey - 3 * pulso);
                ctx.lineTo(ex + espinho.w, ey + espinho.h);
                ctx.lineTo(ex, ey + espinho.h);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1; ctx.stroke();
            }

            for (let buraco of BURACOS) {
                const bx = buraco.inicio - cameraX;
                ctx.fillStyle = 'rgba(255,0,0,0.15)';
                ctx.fillRect(bx, chaoY, buraco.fim - buraco.inicio, 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '16px "Pixelify Sans", monospace';
                ctx.fillText('💀', bx + 10, chaoY - 10);
            }

            for (let cip of CIPOS) desenharCipo(cip);
            for (let canhao of CANHOES) desenharCanhao(canhao);
            for (let bola of bolasDeFogo) desenharBolaDeFogo(bola);

            for (let m of moedasArray) {
                if (m.coletada) continue;
                const mx = m.x - cameraX;
                if (mx < -50 || mx > W + 50) continue;
                const flutuacao = Math.sin(tempoGlobal * 0.06 + m.fase) * 3;
                const my = m.y + flutuacao;
                const escala = 0.9 + Math.sin(tempoGlobal * 0.1 + m.fase) * 0.1;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15 + Math.sin(tempoGlobal * 0.1 + m.fase) * 5;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath(); ctx.arc(mx, my, m.raio * escala, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath(); ctx.arc(mx - 2, my - 2, m.raio * escala * 0.4, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath(); ctx.arc(mx - 3, my - 3, m.raio * escala * 0.2, 0, Math.PI * 2); ctx.fill();
            }

            for (let cp of checkpoints) {
                const cx = cp.x - cameraX;
                if (cx < -50 || cx > W + 50) continue;
                const cy = cp.y;
                ctx.fillStyle = '#888'; ctx.fillRect(cx + 4, cy, 3, cp.h);
                const onda = Math.sin(tempoGlobal * 0.1 + cp.x * 0.01) * 3;
                ctx.fillStyle = cp.ativado ? '#2ecc71' : 'rgba(255,255,255,0.9)';
                ctx.shadowColor = cp.ativado ? '#2ecc71' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = cp.ativado ? 15 : 8;
                ctx.beginPath();
                ctx.moveTo(cx + 7, cy + 5);
                ctx.quadraticCurveTo(cx + 20, cy + 12 + onda, cx + 30, cy + 15);
                ctx.lineTo(cx + 7, cy + 30);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#666'; ctx.lineWidth = 1; ctx.stroke();
            }

            const sxSabio = sabio.x - cameraX;
            const sySabio = sabio.y;
            if (sabio.alpha > 0) {
                ctx.globalAlpha = sabio.alpha;
                desenharSabio(sxSabio, sySabio);
                ctx.globalAlpha = 1;
            }

            if (sabio.conversaAtiva && !sabio.conversaTerminada) {
                const falaAtual = sabio.falas[sabio.falaIndex] || '';
                ctx.font = '16px "Pixelify Sans", monospace';
                const larguraTexto = ctx.measureText(falaAtual).width;
                const padding = 20;
                const bw = Math.max(larguraTexto + padding * 2, 60);
                const bh = 24 + padding;
                const flutuacao = Math.sin(tempoGlobal * 0.04) * 8;
                const balancoX = Math.cos(tempoGlobal * 0.03) * 2;
                const alturaMago = sabio.largura * 4 * 1.2;
                const bx = sxSabio + sabio.largura/2 - bw/2 + balancoX;
                const by = sySabio + sabio.altura/2 - alturaMago * 0.94 + flutuacao;
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 12;
                ctx.fillStyle = 'rgba(255,255,255,0.95)';
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 12); ctx.stroke();
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = '#222';
                ctx.fillText(falaAtual, bx + bw/2, by + bh/2);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            }

            if (nivelAtual === 5) desenharCaverna();

            for (let mob of mobs) {
                if (mob.morto) continue;
                const mx = mob.x - cameraX;
                if (mx < -100 || mx > W + 100) continue;
                const my = mob.y;
                if (mob.tipo === 'voador') desenharMorcego(mx, my, mob);
                else desenharOrc(mx, my, mob);
                const offsetBarra = mob.tipo === 'voador' ? mob.radius * 1.9 : mob.radius * 1.75;
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.fillRect(mx - mob.radius, my - offsetBarra, mob.radius * 2, 4);
                ctx.fillStyle = 'rgba(0,255,0,0.7)';
                ctx.fillRect(mx - mob.radius, my - offsetBarra, mob.radius * 2 * (mob.hp / 2), 4);
            }

            if (!gameOver) {
                const px = player.x - cameraX, py = player.y;
                if (!jogadorAgravado) {
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(px + player.w/2, chaoY + 3, player.w * 0.5 * (1 - playerSquash * 0.4), 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                const sw = player.w * (1 + playerSquash * 0.5);
                const sh = player.h * (1 - playerSquash * 0.5);
                const sx2 = px + (player.w - sw) / 2;
                const sy2 = py + (player.h - sh);
                ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowBlur = 12;
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(sx2, sy2, sw, sh);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 2;
                ctx.strokeRect(sx2, sy2, sw, sh);
                const eyeSize = sw * 0.2, eyeOffset = sw * 0.2;
                ctx.fillStyle = '#fff';
                ctx.fillRect(sx2 + eyeOffset, sy2 + eyeOffset, eyeSize, eyeSize);
                ctx.fillRect(sx2 + sw - eyeOffset - eyeSize, sy2 + eyeOffset, eyeSize, eyeSize);
                ctx.fillStyle = '#2c3e50';
                const pupil = eyeSize * 0.4;
                ctx.fillRect(sx2 + eyeOffset + pupil * 0.5, sy2 + eyeOffset + pupil * 0.5, pupil, pupil);
                ctx.fillRect(sx2 + sw - eyeOffset - eyeSize + pupil * 0.5, sy2 + eyeOffset + pupil * 0.5, pupil, pupil);
                if (temEspada && !espadaLancada) {
                    const progressoAtaque = atacando ? (ataqueTimer / DURACAO_ATAQUE) : 0;
                    desenharEspadaMagica(px, py, player.w, player.h, atacando, progressoAtaque);
                }
            }

            desenharParticulas();
            desenharParticulasAmbiente();
            desenharMorteAnims();

            if (passaroCarta.ativo) {
                const bx = passaroCarta.x - cameraX, by = passaroCarta.y;
                const flap = Math.sin(passaroCarta.fase * 2) * 0.5;
                ctx.fillStyle = '#222';
                ctx.beginPath(); ctx.ellipse(bx, by, 20, 10, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(bx - 8, by); ctx.lineTo(bx - 35, by - 15 + flap * 15); ctx.lineTo(bx - 10, by + 5);
                ctx.closePath(); ctx.fill();
                ctx.beginPath();
                ctx.moveTo(bx + 8, by); ctx.lineTo(bx + 35, by - 15 + flap * 15); ctx.lineTo(bx + 10, by + 5);
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = '#ffcc00';
                ctx.beginPath(); ctx.arc(bx + 12, by - 3, 2, 0, Math.PI * 2); ctx.fill();
            }
            if (carta.ativa && !carta.coletada) {
                const cx = carta.x - cameraX, cy = carta.y;
                const flutua = carta.caiu ? Math.sin(tempoGlobal * 0.1) * 3 : 0;
                ctx.save();
                ctx.translate(cx, cy + flutua);
                ctx.rotate(Math.sin(tempoGlobal * 0.04) * 0.15);
                ctx.fillStyle = '#f5e8c8'; ctx.strokeStyle = '#8a6a3a'; ctx.lineWidth = 2;
                ctx.fillRect(-18, -12, 36, 24);
                ctx.strokeRect(-18, -12, 36, 24);
                ctx.strokeStyle = '#c9a961';
                ctx.beginPath(); ctx.moveTo(-18, -12); ctx.lineTo(0, 2); ctx.lineTo(18, -12); ctx.stroke();
                ctx.fillStyle = '#aa2222';
                ctx.beginPath(); ctx.arc(0, 2, 4, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                const pulso = 0.5 + Math.sin(tempoGlobal * 0.2) * 0.4;
                ctx.strokeStyle = `rgba(255, 240, 150, ${pulso})`; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(cx, cy + flutua, 40, 0, Math.PI * 2); ctx.stroke();
            }

            if (espadaLancada) {
                const ex = espadaLancada.x - cameraX, ey = espadaLancada.y;
                ctx.save();
                ctx.translate(ex, ey); ctx.rotate(espadaLancada.angulo);
                const gr = ctx.createRadialGradient(0, 0, 0, 0, 0, 50);
                gr.addColorStop(0, 'rgba(120, 220, 255, 0.7)');
                gr.addColorStop(1, 'rgba(120, 220, 255, 0)');
                ctx.fillStyle = gr;
                ctx.beginPath(); ctx.arc(0, 0, 50, 0, Math.PI * 2); ctx.fill();
                ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 20;
                ctx.fillStyle = '#d8ecff'; ctx.strokeStyle = '#4a7a9a'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-6, 15); ctx.lineTo(-4, -30); ctx.lineTo(0, -40);
                ctx.lineTo(4, -30); ctx.lineTo(6, 15);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#8a6a2a';
                ctx.fillRect(-4, 15, 8, 8);
                ctx.restore();
            }

            if (boss.ativo) {
                const bx = boss.x - cameraX, by = boss.y;
                if (boss.fase === 'aparecendo') {
                    const escala = Math.min(1, boss.timer / 90);
                    ctx.save();
                    ctx.globalAlpha = escala;
                    ctx.fillStyle = '#000';
                    ctx.shadowColor = '#000'; ctx.shadowBlur = 40;
                    ctx.beginPath();
                    ctx.ellipse(bx, by, boss.w * 0.6 * escala, boss.h * 0.6 * escala, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    if (boss.timer > 40) {
                        ctx.fillStyle = '#ff2200';
                        ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 25;
                        ctx.beginPath();
                        ctx.arc(bx - 30, by - 20, 8, 0, Math.PI * 2);
                        ctx.arc(bx + 30, by - 20, 8, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                    }
                    ctx.restore();
                } else if (!boss.morto) {
                    desenharBoss(bx, by);
                }

                if (!boss.morto && boss.fase === 'lutando') {
                    const barW = 600, barX = W / 2 - barW / 2, barY = 80;
                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(barX - 6, barY - 6, barW + 12, 40);
                    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3;
                    ctx.strokeRect(barX - 6, barY - 6, barW + 12, 40);
                    ctx.fillStyle = 'rgba(60, 0, 0, 0.9)';
                    ctx.fillRect(barX, barY, barW, 28);
                    const ratio = boss.hp / boss.hpMax;
                    const grd = ctx.createLinearGradient(barX, 0, barX + barW, 0);
                    grd.addColorStop(0, '#ff0000'); grd.addColorStop(1, '#ff6644');
                    ctx.fillStyle = grd;
                    ctx.fillRect(barX, barY, barW * ratio, 28);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 20px "Pixelify Sans", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('🦇 MORCEGO ANCESTRAL', W / 2, barY - 14);
                    ctx.fillText(`${boss.hp} / ${boss.hpMax}`, W / 2, barY + 22);
                    ctx.textAlign = 'left';
                }

                for (let b of boss.bolasFogo) {
                    const bxx = b.x - cameraX, byy = b.y;
                    const pulso = 1 + Math.sin(tempoGlobal * 0.4 + b.x * 0.1) * 0.1;
                    const grad = ctx.createRadialGradient(bxx, byy, 0, bxx, byy, b.raio * 3);
                    grad.addColorStop(0, 'rgba(255, 240, 150, 1)');
                    grad.addColorStop(0.25, 'rgba(255, 180, 40, 0.95)');
                    grad.addColorStop(0.55, 'rgba(255, 80, 0, 0.7)');
                    grad.addColorStop(1, 'rgba(120, 0, 0, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath(); ctx.arc(bxx, byy, b.raio * 3, 0, Math.PI * 2); ctx.fill();
                    for (let i = 0; i < 6; i++) {
                        const ang = (Math.PI * 2 / 6) * i + tempoGlobal * 0.2;
                        const dx2 = Math.cos(ang) * b.raio * (1.0 + Math.sin(tempoGlobal * 0.3 + i) * 0.15);
                        const dy2 = Math.sin(ang) * b.raio * (1.0 + Math.sin(tempoGlobal * 0.3 + i) * 0.15);
                        ctx.fillStyle = `rgba(255, ${120 + Math.floor(Math.sin(i + tempoGlobal * 0.2) * 60)}, 0, 0.7)`;
                        ctx.beginPath();
                        ctx.moveTo(bxx + dx2, byy + dy2 - b.raio * 0.4);
                        ctx.lineTo(bxx + dx2 * 1.3, byy + dy2);
                        ctx.lineTo(bxx + dx2 - b.raio * 0.3, byy + dy2);
                        ctx.closePath(); ctx.fill();
                    }
                    ctx.fillStyle = '#ffcc33';
                    ctx.shadowColor = '#ff6600'; ctx.shadowBlur = 25;
                    ctx.beginPath(); ctx.arc(bxx, byy, b.raio * 0.85 * pulso, 0, Math.PI * 2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#fff8d0';
                    ctx.beginPath(); ctx.arc(bxx, byy, b.raio * 0.4, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath(); ctx.arc(bxx, byy, b.raio * 0.2, 0, Math.PI * 2); ctx.fill();
                }

                for (let m of boss.morcegos) {
                    if (m.morto) continue;
                    desenharMorcego(m.x - cameraX, m.y, m);
                }
            }

            desenharFolhas();
            desenharBorboletas();

            if (!gameOver) {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = '20px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 8;
                ctx.fillText('❤️ ' + vidas, 20, 40);
                ctx.fillText('Nível ' + nivelAtual, 20, 70);
                ctx.fillText('🪙 ' + moedas + ' / 100', 20, 100);
                ctx.fillText('🏆 ' + contarConquistas() + ' / ' + totalConquistas(), 20, 130);
                if (jogadorAgravado) {
                    ctx.fillStyle = 'rgba(255, 255, 100, 0.9)';
                    ctx.fillText('🌿 Agarrado! (ESPAÇO para soltar)', 20, 160);
                }
                if (podeLancarEspada && temEspada && segurandoAtaque && !espadaLancada && inicioHold > 0) {
                    const pct = Math.min(1, (performance.now() - inicioHold) / TEMPO_HOLD_MS);
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(20, 180, 220, 20);
                    ctx.fillStyle = 'rgba(120, 220, 255, 0.9)';
                    ctx.fillRect(20, 180, 220 * pct, 20);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
                    ctx.strokeRect(20, 180, 220, 20);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 12px "Pixelify Sans", monospace';
                    ctx.fillText('⚔️ LANÇANDO...', 30, 195);
                }
                ctx.shadowBlur = 0;
                const progresso = Math.min(1, player.x / WORLD_WIDTH);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(W/2 - 100, 20, 200, 8);
                ctx.fillStyle = 'rgba(46, 204, 113, 0.6)';
                ctx.fillRect(W/2 - 100, 20, 200 * progresso, 8);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
                ctx.strokeRect(W/2 - 100, 20, 200, 8);
            }

            const titulos = [
                { ativo: mostrarTitulo, texto: 'NÍVEL 1' },
                { ativo: mostrarTituloNivel2, texto: 'NÍVEL 2' },
                { ativo: mostrarTituloNivel3, texto: 'NÍVEL 3' },
                { ativo: mostrarTituloNivel4, texto: 'NÍVEL 4 - PERIGO!' },
                { ativo: mostrarTituloNivel5, texto: 'NÍVEL 5 - O GUARDIÃO' }
            ];
            for (let t of titulos) {
                if (t.ativo && !gameOver) {
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'rgba(255,255,255,0.5)';
                    ctx.font = 'bold 80px "Pixelify Sans", monospace';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 20;
                    ctx.fillText(t.texto, W/2, H/2 - 50);
                    ctx.shadowBlur = 0;
                    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
                }
            }

            if (fadeFinal > 0) {
                ctx.fillStyle = `rgba(0, 0, 0, ${fadeFinal})`;
                ctx.fillRect(0, 0, W, H);
            }
            if (fadeFinal >= 1) {
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.font = 'bold 72px "Pixelify Sans", monospace';
                ctx.shadowColor = '#f1c40f'; ctx.shadowBlur = 30;
                ctx.fillText('Você chegou ao final!', W / 2, H / 2 - 50);
                ctx.shadowBlur = 0;
                ctx.font = '32px "Pixelify Sans", monospace';
                ctx.fillText('Aguarde as próximas atualizações', W / 2, H / 2 + 50);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            }

            if (dialogo.ativo) {
                const fala = dialogo.falas[dialogo.index] || '';
                ctx.font = 'bold 22px "Pixelify Sans", monospace';
                const largura = ctx.measureText(fala).width;
                const padding = 40;
                const bw = Math.max(largura + padding * 2, 500);
                const bh = 120;
                const bx = W / 2 - bw / 2;
                const by = H - 200;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.9)';
                ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 16); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#f1c40f';
                ctx.font = 'bold 18px "Pixelify Sans", monospace';
                ctx.fillText(dialogo.titulo, bx + 20, by + 30);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 22px "Pixelify Sans", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(fala, W / 2, by + bh / 2 + 5);
                const pisca = Math.sin(tempoGlobal * 0.15) * 0.5 + 0.5;
                ctx.fillStyle = `rgba(241, 196, 15, ${0.5 + pisca * 0.5})`;
                ctx.font = 'bold 16px "Pixelify Sans", monospace';
                ctx.fillText('▼ PRESSIONE ENTER PARA CONTINUAR', W / 2, by + bh - 15);
                ctx.fillStyle = 'rgba(241, 196, 15, 0.6)';
                ctx.font = '14px "Pixelify Sans", monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`${dialogo.index + 1} / ${dialogo.falas.length}`, bx + bw - 20, by + 30);
                ctx.textAlign = 'left';
            }

            if (gameOver) {
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 90px "Pixelify Sans", monospace';
                ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 40;
                ctx.fillText('PERDEU OTÁRIO', W/2, H/2 - 30);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px "Pixelify Sans", monospace';
                ctx.fillText('Pressione R para reiniciar', W/2, H/2 + 70);
                ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }

        function resize() {
            isResizing = true;
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
            const newChaoAltura = Math.floor(H * 0.15);
            const newPlayerSize = Math.min(W, H) * 0.045;
            const newMobRadius = Math.min(W, H) * 0.025;
            const novoChaoY = H - newChaoAltura;
            const deltaY = novoChaoY - chaoY;
            chaoY = novoChaoY;
            for (let plat of platforms) {
                if (plat.y === chaoY - deltaY) { plat.y = chaoY; plat.height = newChaoAltura; }
                else { plat.y += deltaY; plat.height = 20; plat.width = 120; }
            }
            for (let espinho of ESPINHOS) espinho.y += deltaY;
            for (let mob of mobs) { mob.radius = newMobRadius; mob.y += deltaY; }
            for (let cp of checkpoints) cp.y += deltaY;
            sabio.y += deltaY;
            for (let m of moedasArray) m.y += deltaY;
            for (let pp of PLATAFORMAS_PODRES) pp.y += deltaY;
            for (let cip of CIPOS) cip.ancoraY += deltaY;
            for (let canhao of CANHOES) canhao.y += deltaY;
            for (let bola of bolasDeFogo) bola.y += deltaY;
            caverna.y = chaoY - caverna.h;
            boss.y += deltaY;
            for (let bola of boss.bolasFogo) bola.y += deltaY;
            for (let m of boss.morcegos) m.y += deltaY;
            player.w = newPlayerSize; player.h = newPlayerSize;
            if (player.onGround || player.y + player.h > chaoY) { player.y = chaoY - player.h; player.onGround = true; }
            else player.y += deltaY;
            player.spawnY = chaoY - player.h;
            checkpointY = player.spawnY;
            ajustarPosicaoBuraco();
            inicializarCenario();
            setTimeout(() => { isResizing = false; }, 50);
        }
        window.addEventListener('resize', resize);

        const pauseBtn = document.getElementById('pauseBtn');
        const pauseMenu = document.getElementById('pauseMenu');
        const resumeBtn = document.getElementById('resumeBtn');
        const pauseAchCount = document.getElementById('pauseAchCount');
        const pauseMoedas = document.getElementById('pauseMoedas');
        const pauseVidas = document.getElementById('pauseVidas');
        const pauseNivel = document.getElementById('pauseNivel');
        const achDesbloqueadasDiv = document.getElementById('achDesbloqueadas');
        const achBloqueadasDiv = document.getElementById('achBloqueadas');

        function pausarJogo() {
            if (jogoPausado || !jogoIniciado || gameOver) return;
            jogoPausado = true;
            keys.a = keys.d = keys.w = keys.space = false;
            segurandoAtaque = false;
            tempoSegurando = 0;
            inicioHold = 0;
            atualizarMenuPause();
            pauseMenu.classList.add('aberto');
        }

        function despausarJogo() {
            if (!jogoPausado) return;
            jogoPausado = false;
            pauseMenu.classList.remove('aberto');
        }

        function atualizarMenuPause() {
            pauseAchCount.textContent = `${contarConquistas()} / ${totalConquistas()}`;
            pauseMoedas.textContent = moedas;
            pauseVidas.textContent = vidas;
            pauseNivel.textContent = nivelAtual;

            const desbloqueadas = [];
            const bloqueadas = [];
            for (let k in CONQUISTAS) {
                const c = CONQUISTAS[k];
                const item = `
                    <div class="ach-item ${c.desbloqueada ? 'desbloqueada' : ''}">
                        <div class="ach-icon">${c.icone || '🏆'}</div>
                        <div class="ach-info">
                            <div class="ach-name">${c.desbloqueada ? c.nome : '???'}</div>
                            <div class="ach-desc">${c.desbloqueada ? c.desc : 'Conquista bloqueada'}</div>
                        </div>
                    </div>`;
                if (c.desbloqueada) desbloqueadas.push(item);
                else bloqueadas.push(item);
            }

            achDesbloqueadasDiv.innerHTML = `<div class="ach-section-title">✅ Desbloqueadas (${desbloqueadas.length})</div>
                <div class="ach-list">${desbloqueadas.join('') || '<div style="color:#666;padding:10px">Nenhuma ainda...</div>'}</div>`;

            achBloqueadasDiv.innerHTML = `<div class="ach-section-title locked">🔒 Bloqueadas (${bloqueadas.length})</div>
                <div class="ach-list">${bloqueadas.join('')}</div>`;
        }

        pauseBtn.addEventListener('click', (e) => { e.stopPropagation(); pausarJogo(); });
        resumeBtn.addEventListener('click', (e) => { e.stopPropagation(); despausarJogo(); });

        document.addEventListener('keydown', (e) => {
            if (!jogoIniciado) return;
            const key = e.key.toLowerCase();

            if (key === 'p' || key === 'escape') {
                e.preventDefault();
                if (jogoPausado) despausarJogo(); else pausarJogo();
                return;
            }
            if (jogoPausado) return;

            if (dialogo.ativo) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    avancarDialogo();
                }
                return;
            }

            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault();
                keys[key] = true;
                return;
            }
            if (key === ' ') {
                e.preventDefault();
                if (jogadorAgravado) {
                    const omega = Math.cos(jogadorAgravado.fase) * jogadorAgravado.anguloMax * jogadorAgravado.velocidade;
                    const velLinear = jogadorAgravado.comprimento * omega;
                    player.vx = velLinear * Math.cos(jogadorAgravado.angulo);
                    player.vy = -velLinear * Math.sin(jogadorAgravado.angulo) - 6;
                    if (omega > 0) player.vx += 3;
                    else if (omega < 0) player.vx -= 3;
                    jogadorAgravado.ocupado = false;
                    jogadorAgravado = null;
                    cooldownCipo = 15;
                    cipoUsos++;
                    if (cipoUsos >= 10) desbloquearConquista('tarzan');
                    return;
                }
                if (e.repeat) return;
                if (cooldownCipo <= 0 && !espadaLancada) {
                    let maisProximo = null, menorDist = Infinity;
                    for (let cip of CIPOS) {
                        const distX = Math.abs((player.x + player.w/2) - cip.pontaX);
                        const distY = Math.abs((player.y + player.h/2) - cip.pontaY);
                        const dist = Math.sqrt(distX*distX + distY*distY);
                        if (distX < 250 && distY < 250 && dist < menorDist) { menorDist = dist; maisProximo = cip; }
                    }
                    if (maisProximo) {
                        jogadorAgravado = maisProximo;
                        maisProximo.ocupado = true;
                        player.x = maisProximo.pontaX - player.w/2;
                        player.y = maisProximo.pontaY;
                        player.vx = 0; player.vy = 0;
                    } else {
                        executarAtaque();
                        segurandoAtaque = true;
                        tempoSegurando = 0;
                        inicioHold = performance.now();
                    }
                }
                return;
            }
            if (key === 'r') { e.preventDefault(); if (gameOver) restartGame(); }
        });

        document.addEventListener('keyup', (e) => {
            if (!jogoIniciado) return;
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') { e.preventDefault(); keys[key] = false; return; }
            if (key === ' ') { segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0; }
        });

        function iniciarJogo() {
            if (jogoIniciado) return;
            jogoIniciado = true;
            tempoInicioJogo = performance.now();
            ultimoXTracking = player.x;
            gerarMoedas();
            resize();
            checkpointY = player.spawnY;
            pauseBtn.classList.add('visivel');
            gameLoop();
        }
    </script>
</body>
</html>
