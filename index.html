        // ============================================
        // DESENHAR MORCEGO
        // ============================================
        function desenharMorcego(mx, my, mob) {
            const r = mob.radius;
            const asaBat = Math.sin(tempoGlobal * 0.5 + mob.fase);
            const dir = mob.direction >= 0 ? 1 : -1;
            ctx.save();
            ctx.translate(mx, my);
            ctx.scale(dir, 1);
            ctx.fillStyle = mob.color;
            ctx.strokeStyle = mob.stroke;
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.moveTo(-r * 0.4, -r * 0.2);
            ctx.quadraticCurveTo(-r * 1.3, -r * (0.9 + asaBat * 0.5), -r * 2.1, -r * (0.3 + asaBat * 1.0));
            ctx.lineTo(-r * 1.7, -r * 0.05);
            ctx.quadraticCurveTo(-r * 1.55, r * 0.15, -r * 1.45, r * 0.05);
            ctx.quadraticCurveTo(-r * 1.25, r * 0.25, -r * 1.1, r * 0.1);
            ctx.quadraticCurveTo(-r * 0.9, r * 0.35, -r * 0.75, r * 0.15);
            ctx.quadraticCurveTo(-r * 0.6, r * 0.35, -r * 0.45, r * 0.1);
            ctx.lineTo(-r * 0.4, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.4, -r * 0.2);
            ctx.quadraticCurveTo(r * 1.3, -r * (0.9 + asaBat * 0.5), r * 2.1, -r * (0.3 + asaBat * 1.0));
            ctx.lineTo(r * 1.7, -r * 0.05);
            ctx.quadraticCurveTo(r * 1.55, r * 0.15, r * 1.45, r * 0.05);
            ctx.quadraticCurveTo(r * 1.25, r * 0.25, r * 1.1, r * 0.1);
            ctx.quadraticCurveTo(r * 0.9, r * 0.35, r * 0.75, r * 0.15);
            ctx.quadraticCurveTo(r * 0.6, r * 0.35, r * 0.45, r * 0.1);
            ctx.lineTo(r * 0.4, 0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.ellipse(0, 0, r * 0.55, r * 0.75, 0, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, -r * 0.7, r * 0.45, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-r * 0.35, -r * 0.95);
            ctx.lineTo(-r * 0.55, -r * 1.5);
            ctx.lineTo(-r * 0.1, -r * 1.0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(r * 0.35, -r * 0.95);
            ctx.lineTo(r * 0.55, -r * 1.5);
            ctx.lineTo(r * 0.1, -r * 1.0);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowColor = '#ffeb3b';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(-r * 0.18, -r * 0.7, r * 0.13, 0, Math.PI * 2);
            ctx.arc(r * 0.18, -r * 0.7, r * 0.13, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(-r * 0.18, -r * 0.7, r * 0.06, 0, Math.PI * 2);
            ctx.arc(r * 0.18, -r * 0.7, r * 0.06, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // ============================================
        // DESENHAR ESPADA MÁGICA
        // ============================================
        function desenharEspadaMagica(px, py, w, h, estaAtacando, progresso) {
            const escala = w / 40;
            const maoX = px + w * 0.9;
            const maoY = py + h * 0.5;
            const rotInicial = -Math.PI * 0.78;
            let rotacao;
            if (estaAtacando) {
                const t = progresso;
                const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                rotacao = rotInicial + eased * Math.PI * 2;
            } else {
                rotacao = -0.15;
            }
            const pulso = 0.75 + Math.sin(tempoGlobal * 0.12) * 0.25;
            const intensidadeAtaque = estaAtacando ? 1.6 : 1;
            const flutuacao = estaAtacando ? 0 : Math.sin(tempoGlobal * 0.08) * 1.5;
            const raioAura = 45 * (estaAtacando ? 1.4 : 1);
            const gradAura = ctx.createRadialGradient(maoX, maoY + flutuacao, 0, maoX, maoY + flutuacao, raioAura);
            gradAura.addColorStop(0, `rgba(120, 220, 255, ${0.55 * pulso * intensidadeAtaque})`);
            gradAura.addColorStop(0.5, `rgba(80, 180, 255, ${0.25 * pulso * intensidadeAtaque})`);
            gradAura.addColorStop(1, 'rgba(80, 180, 255, 0)');
            ctx.fillStyle = gradAura;
            ctx.beginPath();
            ctx.arc(maoX, maoY + flutuacao, raioAura, 0, Math.PI * 2);
            ctx.fill();
            if (estaAtacando && progresso > 0.05) {
                const distPonta = 46 * escala;
                const numSegmentos = 24;
                for (let i = 0; i < numSegmentos; i++) {
                    const tIni = i / numSegmentos;
                    const tFim = (i + 1) / numSegmentos;
                    const rot1 = rotInicial + (rotacao - rotInicial) * tIni;
                    const rot2 = rotInicial + (rotacao - rotInicial) * tFim;
                    const x1 = maoX + Math.sin(rot1) * distPonta;
                    const y1 = maoY + flutuacao - Math.cos(rot1) * distPonta;
                    const x2 = maoX + Math.sin(rot2) * distPonta;
                    const y2 = maoY + flutuacao - Math.cos(rot2) * distPonta;
                    const alpha = (i / numSegmentos) * 0.75 * (1 - progresso * 0.4);
                    const larguraSeg = (2 + i * 0.3) * escala;
                    ctx.strokeStyle = `rgba(150, 230, 255, ${alpha})`;
                    ctx.lineWidth = larguraSeg;
                    ctx.lineCap = 'round';
                    ctx.shadowColor = '#66ccff';
                    ctx.shadowBlur = 14;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
                ctx.shadowBlur = 0;
                ctx.lineCap = 'butt';
            }
            ctx.save();
            ctx.translate(maoX, maoY + flutuacao);
            ctx.rotate(rotacao);
            ctx.fillStyle = '#8a6a2a';
            ctx.strokeStyle = '#4a3000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, 22 * escala, 4 * escala, 0, Math.PI * 2);
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ff2244';
            ctx.shadowColor = '#ff2244';
            ctx.shadowBlur = 8 * pulso;
            ctx.beginPath();
            ctx.arc(0, 22 * escala, 2.2 * escala, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#5a3a1a';
            ctx.strokeStyle = '#3a1a00';
            ctx.lineWidth = 1;
            ctx.fillRect(-3 * escala, 8 * escala, 6 * escala, 12 * escala);
            ctx.strokeRect(-3 * escala, 8 * escala, 6 * escala, 12 * escala);
            ctx.strokeStyle = '#3a1a00';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < 4; i++) {
                const yy = 9 * escala + i * 3 * escala;
                ctx.beginPath();
                ctx.moveTo(-3 * escala, yy);
                ctx.lineTo(3 * escala, yy + 1.5 * escala);
                ctx.stroke();
            }
            ctx.fillStyle = '#d4a44a';
            ctx.strokeStyle = '#8a5a10';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-10 * escala, 6 * escala);
            ctx.lineTo(10 * escala, 6 * escala);
            ctx.lineTo(8 * escala, 9 * escala);
            ctx.lineTo(-8 * escala, 9 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-10 * escala, 6 * escala);
            ctx.lineTo(-13 * escala, 4 * escala);
            ctx.lineTo(-11 * escala, 8 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(10 * escala, 6 * escala);
            ctx.lineTo(13 * escala, 4 * escala);
            ctx.lineTo(11 * escala, 8 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#ff2244';
            ctx.shadowColor = '#ff2244';
            ctx.shadowBlur = 10 * pulso;
            ctx.beginPath();
            ctx.moveTo(0, 4 * escala);
            ctx.lineTo(3 * escala, 7 * escala);
            ctx.lineTo(0, 10 * escala);
            ctx.lineTo(-3 * escala, 7 * escala);
            ctx.closePath();
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#8a0010';
            ctx.lineWidth = 0.8;
            ctx.stroke();
            ctx.shadowColor = '#66ccff';
            ctx.shadowBlur = 14 * pulso * intensidadeAtaque;
            const gradLamina = ctx.createLinearGradient(0, 0, 0, -45 * escala);
            gradLamina.addColorStop(0, '#e8f4ff');
            gradLamina.addColorStop(0.4, '#b8d8ee');
            gradLamina.addColorStop(0.7, '#88aacc');
            gradLamina.addColorStop(1, '#aaddff');
            ctx.fillStyle = gradLamina;
            ctx.strokeStyle = '#4a7a9a';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(-3.5 * escala, 5 * escala);
            ctx.lineTo(-3 * escala, -38 * escala);
            ctx.lineTo(0, -46 * escala);
            ctx.lineTo(3 * escala, -38 * escala);
            ctx.lineTo(3.5 * escala, 5 * escala);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(0, 3 * escala);
            ctx.lineTo(0, -42 * escala);
            ctx.stroke();
            const runaPulso = 0.5 + Math.sin(tempoGlobal * 0.15) * 0.5;
            ctx.strokeStyle = `rgba(120, 220, 255, ${runaPulso * intensidadeAtaque})`;
            ctx.shadowColor = '#66ccff';
            ctx.shadowBlur = 8 * pulso;
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -20 * escala);
            ctx.lineTo(2.5 * escala, -17 * escala);
            ctx.lineTo(0, -14 * escala);
            ctx.lineTo(-2.5 * escala, -17 * escala);
            ctx.closePath();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -26 * escala);
            ctx.lineTo(0, -22 * escala);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -12 * escala);
            ctx.lineTo(0, -8 * escala);
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
            const numFaiscas = estaAtacando ? 9 : 4;
            for (let i = 0; i < numFaiscas; i++) {
                const faseFaisca = tempoGlobal * 0.08 + i * 1.5;
                const raio = 18 + Math.sin(faseFaisca * 1.3) * 6;
                const fx = maoX + Math.cos(faseFaisca) * raio;
                const fy = maoY + flutuacao + Math.sin(faseFaisca * 0.8) * raio - 5;
                const tamanhoFaisca = 1.5 + Math.sin(faseFaisca * 2) * 1;
                ctx.fillStyle = `rgba(150, 230, 255, ${0.6 + Math.sin(faseFaisca * 3) * 0.3})`;
                ctx.shadowColor = '#66ccff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(fx, fy, tamanhoFaisca, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // ============================================
        // DESENHAR ESTÁTUA DE PEDRA
        // ============================================
        function desenharCanhao(canhao) {
            const cx = canhao.x - cameraX;
            const cy = canhao.y;
            const dir = canhao.direcao;

            ctx.save();
            ctx.translate(cx, cy);
            if (dir === -1) ctx.scale(-1, 1);

            ctx.fillStyle = '#3a3a42';
            ctx.strokeStyle = '#1a1a22';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-32, 60);
            ctx.lineTo(32, 60);
            ctx.lineTo(24, 35);
            ctx.lineTo(-24, 35);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#5a5a62';
            ctx.strokeStyle = '#2a2a32';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-22, 35);
            ctx.lineTo(-26, -10);
            ctx.lineTo(-20, -45);
            ctx.lineTo(20, -45);
            ctx.lineTo(26, -10);
            ctx.lineTo(22, 35);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-14, 25);
            ctx.lineTo(-8, 10);
            ctx.lineTo(-16, -5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(12, 20);
            ctx.lineTo(16, 5);
            ctx.lineTo(10, -10);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(-4, -40);
            ctx.lineTo(0, -30);
            ctx.stroke();
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath();
            ctx.ellipse(-12, 15, 5, 3, 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(14, 8, 4, 2.5, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#6a6a72';
            ctx.strokeStyle = '#3a3a42';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-20, -45);
            ctx.lineTo(-16, -60);
            ctx.lineTo(-8, -55);
            ctx.lineTo(0, -65);
            ctx.lineTo(8, -57);
            ctx.lineTo(16, -60);
            ctx.lineTo(20, -45);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#3a3a42';
            ctx.beginPath();
            ctx.moveTo(-16, -40);
            ctx.lineTo(-6, -36);
            ctx.lineTo(-6, -33);
            ctx.lineTo(-16, -37);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(16, -40);
            ctx.lineTo(6, -36);
            ctx.lineTo(6, -33);
            ctx.lineTo(16, -37);
            ctx.closePath();
            ctx.fill();

            const brilhoOlho = 0.85 + Math.sin(tempoGlobal * 0.2) * 0.15;
            ctx.fillStyle = `rgba(255, 120, 0, ${brilhoOlho})`;
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 18;
            ctx.beginPath();
            ctx.arc(-11, -35, 3.5, 0, Math.PI * 2);
            ctx.arc(11, -35, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#1a0800';
            ctx.beginPath();
            ctx.arc(-11, -35, 1.5, 0, Math.PI * 2);
            ctx.arc(11, -35, 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.ellipse(0, 5, 22, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            const intensidadeFogo = 0.7 + Math.sin(tempoGlobal * 0.2) * 0.3;
            const glowBoca = ctx.createRadialGradient(0, 5, 0, 0, 5, 24);
            glowBoca.addColorStop(0, `rgba(255, 240, 150, ${intensidadeFogo})`);
            glowBoca.addColorStop(0.4, `rgba(255, 140, 0, ${intensidadeFogo * 0.85})`);
            glowBoca.addColorStop(1, 'rgba(255, 60, 0, 0)');
            ctx.fillStyle = glowBoca;
            ctx.beginPath();
            ctx.ellipse(0, 5, 22, 16, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#8a8a92';
            ctx.strokeStyle = '#4a4a52';
            ctx.lineWidth = 1.5;

            ctx.beginPath();
            ctx.moveTo(-16, -8);
            ctx.lineTo(-13, 3);
            ctx.lineTo(-10, -8);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-6, -10);
            ctx.lineTo(-3, 4);
            ctx.lineTo(0, -10);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(4, -10);
            ctx.lineTo(7, 4);
            ctx.lineTo(10, -10);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(12, -8);
            ctx.lineTo(15, 3);
            ctx.lineTo(18, -8);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-16, 18);
            ctx.lineTo(-13, 7);
            ctx.lineTo(-10, 18);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-6, 20);
            ctx.lineTo(-3, 6);
            ctx.lineTo(0, 20);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(4, 20);
            ctx.lineTo(7, 6);
            ctx.lineTo(10, 20);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(12, 18);
            ctx.lineTo(15, 7);
            ctx.lineTo(18, 18);
            ctx.closePath();
            ctx.fill(); ctx.stroke();

            ctx.strokeStyle = '#3a3a42';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(0, 5, 23, 17, 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function desenharBolaDeFogo(bola) {
            const bx = bola.x - cameraX;
            const by = bola.y;
            const grad = ctx.createRadialGradient(bx, by, 0, bx, by, bola.raio * 2);
            grad.addColorStop(0, 'rgba(255, 255, 200, 0.95)');
            grad.addColorStop(0.4, 'rgba(255, 140, 0, 0.85)');
            grad.addColorStop(1, 'rgba(255, 60, 0, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(bx, by, bola.raio * 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffee88';
            ctx.shadowColor = '#ff6600';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(bx, by, bola.raio, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function desenharCipo(cip) {
            const ax = cip.ancoraX - cameraX;
            const ay = cip.ancoraY;
            const px = cip.pontaX - cameraX;
            const py = cip.pontaY;

            // Corda
            ctx.strokeStyle = '#5a3a1a';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(px, py);
            ctx.stroke();
            ctx.strokeStyle = '#6b8a3a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            ctx.lineTo(px, py);
            ctx.stroke();

            // Folhas ao longo do cipó (decorativo)
            ctx.fillStyle = '#4a6a2a';
            for (let i = 0.2; i < 0.9; i += 0.2) {
                const fx = ax + (px - ax) * i;
                const fy = ay + (py - ay) * i;
                ctx.beginPath();
                ctx.ellipse(fx + 6, fy, 6, 3, 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(fx - 6, fy, 6, 3, -0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Nó de ancoragem no topo
            ctx.fillStyle = '#3a1a00';
            ctx.beginPath();
            ctx.arc(ax, ay, 7, 0, Math.PI * 2);
            ctx.fill();

            // Nó na ponta
            ctx.fillStyle = '#3a1a00';
            ctx.beginPath();
            ctx.arc(px, py, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#5a3a1a';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Indicador quando o jogador está perto
            if (!jogadorAgarrado && cooldownCipo <= 0) {
                const distX = Math.abs((player.x + player.w/2) - cip.pontaX);
                const distY = Math.abs((player.y + player.h/2) - cip.pontaY);
                if (distX < 90 && distY < 90) {
                    const pulso = 0.6 + Math.sin(tempoGlobal * 0.25) * 0.4;
                    ctx.strokeStyle = `rgba(255, 255, 100, ${pulso})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(px, py, 22 + Math.sin(tempoGlobal * 0.2) * 3, 0, Math.PI * 2);
                    ctx.stroke();
                    // Texto "ESPAÇO"
                    ctx.fillStyle = `rgba(255, 255, 100, ${pulso})`;
                    ctx.font = 'bold 12px "Pixelify Sans", monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText('ESPAÇO', px, py - 35);
                    ctx.textAlign = 'left';
                }
            }
        }

        function desenharCenarioFundo() {
            if (bgImage.complete && bgImage.naturalWidth !== 0) {
                ctx.drawImage(bgImage, 0, 0, W, H);
            } else {
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, '#1a2a6c');
                grad.addColorStop(0.5, '#b21f1f');
                grad.addColorStop(1, '#fdbb2d');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);
            }
            const raioSol = 60 + Math.sin(tempoGlobal * 0.02) * 5;
            const solX = W * 0.8 - cameraX * 0.02;
            const solY = H * 0.2;
            const gradSol = ctx.createRadialGradient(solX, solY, 0, solX, solY, raioSol * 3);
            gradSol.addColorStop(0, 'rgba(255, 240, 150, 0.9)');
            gradSol.addColorStop(0.3, 'rgba(255, 200, 80, 0.5)');
            gradSol.addColorStop(1, 'rgba(255, 200, 80, 0)');
            ctx.fillStyle = gradSol;
            ctx.beginPath();
            ctx.arc(solX, solY, raioSol * 3, 0, Math.PI * 2);
            ctx.fill();
            for (let n of nuvens) {
                ctx.globalAlpha = n.opacidade;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.beginPath();
                ctx.arc(n.x, n.y, 25 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x + 25 * n.escala, n.y + 5, 20 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x - 25 * n.escala, n.y + 5, 18 * n.escala, 0, Math.PI * 2);
                ctx.arc(n.x + 10 * n.escala, n.y - 12 * n.escala, 18 * n.escala, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function desenharMatinhos() {
            for (let m of matinhos) {
                const mx = m.x - cameraX;
                if (mx < -20 || mx > W + 20) continue;
                const balanco = Math.sin(tempoGlobal * 0.05 + m.fase) * 2;
                ctx.strokeStyle = m.cor;
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(mx, chaoY);
                ctx.quadraticCurveTo(mx + balanco * 0.5, chaoY - m.altura * 0.6, mx + balanco, chaoY - m.altura);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(mx, chaoY);
                ctx.quadraticCurveTo(mx - balanco * 0.5, chaoY - m.altura * 0.5, mx - balanco, chaoY - m.altura * 0.8);
                ctx.stroke();
            }
            ctx.lineCap = 'butt';
        }

        function desenharParticulasAmbiente() {
            for (let p of particulasAmbiente) {
                const brilho = 0.4 + Math.sin(p.brilho) * 0.3;
                ctx.globalAlpha = brilho;
                ctx.fillStyle = p.cor;
                ctx.shadowColor = p.cor;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            }
        }

        // ============================================
        // DRAW
        // ============================================
        function draw() {
            ctx.clearRect(0, 0, W, H);
            desenharCenarioFundo();

            for (let plat of platforms) {
                const sx = plat.x - cameraX;
                const sy = plat.y;
                if (plat.y === chaoY) {
                    ctx.fillStyle = '#4a7c59';
                    ctx.fillRect(sx, sy, plat.width, plat.height);
                    const brilho = 0.8 + Math.sin(tempoGlobal * 0.03) * 0.2;
                    ctx.fillStyle = `rgba(90, 160, 110, ${brilho})`;
                    ctx.fillRect(sx, sy, plat.width, 4);
                } else {
                    if (imgPlataforma.complete && imgPlataforma.naturalWidth !== 0) {
                        ctx.drawImage(imgPlataforma, sx, sy, plat.width, plat.height);
                    } else {
                        ctx.fillStyle = '#8e44ad';
                        ctx.shadowColor = 'rgba(0,0,0,0.4)';
                        ctx.shadowBlur = 12;
                        ctx.fillRect(sx, sy, plat.width, plat.height);
                        ctx.shadowBlur = 0;
                        ctx.strokeStyle = '#6c3483';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(sx, sy, plat.width, plat.height);
                    }
                }
            }

            for (let pm of PLATAFORMAS_MOVEIS) {
                const sx = pm.x - cameraX;
                ctx.fillStyle = '#5566aa';
                ctx.shadowColor = 'rgba(100, 150, 255, 0.6)';
                ctx.shadowBlur = 15;
                ctx.fillRect(sx, pm.y, pm.w, pm.h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#3344aa';
                ctx.lineWidth = 2;
                ctx.strokeRect(sx, pm.y, pm.w, pm.h);
                ctx.fillStyle = 'rgba(200, 220, 255, 0.5)';
                ctx.fillRect(sx + 5, pm.y + 3, pm.w - 10, 3);
            }

            for (let pp of PLATAFORMAS_PODRES) {
                if (pp.destruida) continue;
                const sx = pp.x - cameraX;
                const tremorX = pp.tremendo ? (Math.random() - 0.5) * 4 : 0;
                const tremorY = pp.tremendo ? (Math.random() - 0.5) * 2 : 0;
                ctx.globalAlpha = pp.alpha;
                const corBase = pp.tremendo ? '#6a3a1a' : '#8a5a3a';
                ctx.fillStyle = corBase;
                ctx.fillRect(sx + tremorX, pp.y + tremorY, pp.w, pp.h);
                ctx.strokeStyle = '#3a1a00';
                ctx.lineWidth = 2;
                ctx.strokeRect(sx + tremorX, pp.y + tremorY, pp.w, pp.h);
                ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(sx + pp.w * 0.3 + tremorX, pp.y + tremorY);
                ctx.lineTo(sx + pp.w * 0.4 + tremorX, pp.y + pp.h + tremorY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(sx + pp.w * 0.7 + tremorX, pp.y + tremorY);
                ctx.lineTo(sx + pp.w * 0.6 + tremorX, pp.y + pp.h + tremorY);
                ctx.stroke();
                ctx.globalAlpha = 1;
            }

            desenharMatinhos();

            for (let buraco of BURACOS) {
                const bx = buraco.inicio - cameraX;
                ctx.fillStyle = 'rgba(255,0,0,0.15)';
                ctx.fillRect(bx, chaoY, buraco.fim - buraco.inicio, 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '16px "Pixelify Sans", monospace';
                ctx.fillText('💀', bx + 10, chaoY - 10);
            }

            // Cipós
            for (let cip of CIPOS) {
                desenharCipo(cip);
            }

            // Canhões/Estátuas
            for (let canhao of CANHOES) {
                desenharCanhao(canhao);
            }

            // Bolas de fogo
            for (let bola of bolasDeFogo) {
                desenharBolaDeFogo(bola);
            }

            // Moedas
            for (let m of moedasArray) {
                if (m.coletada) continue;
                const mx = m.x - cameraX;
                const flutuacao = Math.sin(tempoGlobal * 0.06 + m.fase) * 3;
                const my = m.y + flutuacao;
                const escala = 0.9 + Math.sin(tempoGlobal * 0.1 + m.fase) * 0.1;
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 15 + Math.sin(tempoGlobal * 0.1 + m.fase) * 5;
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(mx, my, m.raio * escala, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffaa00';
                ctx.beginPath();
                ctx.arc(mx - 2, my - 2, m.raio * escala * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(mx - 3, my - 3, m.raio * escala * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Checkpoints
            for (let cp of checkpoints) {
                const cx = cp.x - cameraX;
                const cy = cp.y;
                ctx.fillStyle = '#888';
                ctx.fillRect(cx + 4, cy, 3, cp.h);
                const onda = Math.sin(tempoGlobal * 0.1 + cp.x * 0.01) * 3;
                ctx.fillStyle = cp.ativado ? '#2ecc71' : 'rgba(255,255,255,0.9)';
                ctx.shadowColor = cp.ativado ? '#2ecc71' : 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = cp.ativado ? 15 : 8;
                ctx.beginPath();
                ctx.moveTo(cx + 7, cy + 5);
                ctx.quadraticCurveTo(cx + 20, cy + 12 + onda, cx + 30, cy + 15);
                ctx.lineTo(cx + 7, cy + 30);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            // Mobs
            for (let mob of mobs) {
                if (mob.morto) continue;
                const mx = mob.x - cameraX;
                const my = mob.y;
                if (mob.tipo === 'voador') {
                    desenharMorcego(mx, my, mob);
                } else {
                    desenharOrc(mx, my, mob);
                }
                const offsetBarra = mob.tipo === 'voador' ? mob.radius * 1.9 : mob.radius * 1.75;
                ctx.fillStyle = 'rgba(255,0,0,0.7)';
                ctx.fillRect(mx - mob.radius, my - offsetBarra, mob.radius * 2, 4);
                ctx.fillStyle = 'rgba(0,255,0,0.7)';
                ctx.fillRect(mx - mob.radius, my - offsetBarra, mob.radius * 2 * (mob.hp / 2), 4);
            }

            // Jogador
            if (!gameOver) {
                const px = player.x - cameraX;
                const py = player.y;
                if (!jogadorAgarrado) {
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(px + player.w/2, chaoY + 3, player.w * 0.5, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowColor = 'rgba(0,0,0,0.3)';
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(px, py, player.w, player.h);
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 2;
                ctx.strokeRect(px, py, player.w, player.h);
                const eyeSize = player.w * 0.2;
                const eyeOffset = player.w * 0.2;
                ctx.fillStyle = '#fff';
                ctx.fillRect(px + eyeOffset, py + eyeOffset, eyeSize, eyeSize);
                ctx.fillRect(px + player.w - eyeOffset - eyeSize, py + eyeOffset, eyeSize, eyeSize);
                ctx.fillStyle = '#2c3e50';
                const pupil = eyeSize * 0.4;
                ctx.fillRect(px + eyeOffset + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);
                ctx.fillRect(px + player.w - eyeOffset - eyeSize + pupil * 0.5, py + eyeOffset + pupil * 0.5, pupil, pupil);
                if (temEspada) {
                    const progressoAtaque = atacando ? (ataqueTimer / DURACAO_ATAQUE) : 0;
                    desenharEspadaMagica(px, py, player.w, player.h, atacando, progressoAtaque);
                }
            }

            desenharParticulas();
            desenharParticulasAmbiente();

            // UI
            if (!gameOver) {
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.font = '20px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText('❤️ ' + vidas, 20, 40);
                ctx.fillText('Nível 4', 20, 70);
                ctx.fillText('🪙 ' + moedas + ' / 100', 20, 100);
                if (jogadorAgarrado) {
                    ctx.fillStyle = 'rgba(255, 255, 100, 0.9)';
                    ctx.fillText('🌿 Agarrado! (ESPAÇO para soltar)', 20, 130);
                }
                ctx.shadowBlur = 0;
                const progresso = Math.min(1, player.x / WORLD_WIDTH);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(W/2 - 100, 20, 200, 8);
                ctx.fillStyle = 'rgba(46, 204, 113, 0.6)';
                ctx.fillRect(W/2 - 100, 20, 200 * progresso, 8);
                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 1;
                ctx.strokeRect(W/2 - 100, 20, 200, 8);
            }

            if (nivelConcluido) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(46, 204, 113, 0.9)';
                ctx.font = 'bold 60px "Pixelify Sans", monospace';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 20;
                ctx.fillText('🏆 NÍVEL 4 CONCLUÍDO! 🏆', W/2, H/2);
                ctx.shadowBlur = 0;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }

            if (gameOver) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, W, H);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 90px "Pixelify Sans", monospace';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 40;
                ctx.fillText('PERDEU OTÁRIO', W/2, H/2 - 30);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ffffff';
                ctx.font = '24px "Pixelify Sans", monospace';
                ctx.fillText('Pressione R para reiniciar', W/2, H/2 + 70);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.lineTo(x + w - r, y);
                this.quadraticCurveTo(x + w, y, x + w, y + r);
                this.lineTo(x + w, y + h - r);
                this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                this.lineTo(x + r, y + h);
                this.quadraticCurveTo(x, y + h, x, y + h - r);
                this.lineTo(x, y + r);
                this.quadraticCurveTo(x, y, x + r, y);
                return this;
            };
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function resize() {
            isResizing = true;
            W = window.innerWidth;
            H = window.innerHeight;
            canvas.width = W;
            canvas.height = H;
            const newChaoAltura = Math.floor(H * 0.15);
            const newPlayerSize = Math.min(W, H) * 0.045;
            const newMobRadius = Math.min(W, H) * 0.025;
            const newPlatformWidth = 120;
            const novoChaoY = H - newChaoAltura;
            const deltaY = novoChaoY - chaoY;
            chaoY = novoChaoY;
            for (let plat of platforms) {
                if (plat.y === chaoY - deltaY) {
                    plat.y = chaoY;
                    plat.height = newChaoAltura;
                } else {
                    plat.y += deltaY;
                    plat.height = 20;
                    plat.width = newPlatformWidth;
                }
            }
            for (let mob of mobs) { mob.radius = newMobRadius; mob.y += deltaY; }
            for (let cp of checkpoints) cp.y += deltaY;
            for (let m of moedasArray) m.y += deltaY;
            for (let pm of PLATAFORMAS_MOVEIS) {
                pm.y += deltaY;
                pm.minY += deltaY;
                pm.maxY += deltaY;
            }
            for (let pp of PLATAFORMAS_PODRES) pp.y += deltaY;
            for (let cip of CIPOS) cip.ancoraY += deltaY;
            for (let canhao of CANHOES) canhao.y += deltaY;
            for (let bola of bolasDeFogo) bola.y += deltaY;
            player.w = newPlayerSize;
            player.h = newPlayerSize;
            if (player.onGround || player.y + player.h > chaoY) {
                player.y = chaoY - player.h;
                player.onGround = true;
            } else {
                player.y += deltaY;
            }
            player.spawnY = chaoY - player.h;
            checkpointY = player.spawnY;
            ajustarPosicaoBuraco();
            inicializarCenario();
            setTimeout(() => { isResizing = false; }, 50);
        }

        window.addEventListener('resize', resize);

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault(); keys[key] = true;
            }
            if (key === ' ') {
                e.preventDefault();
                if (!jogadorAgarrado && cooldownCipo <= 0) {
                    // Procura o cipó mais próximo dentro do alcance
                    let maisProximo = null;
                    let menorDist = Infinity;
                    for (let cip of CIPOS) {
                        const distX = Math.abs((player.x + player.w/2) - cip.pontaX);
                        const distY = Math.abs((player.y + player.h/2) - cip.pontaY);
                        const dist = Math.sqrt(distX*distX + distY*distY);
                        if (distX < 90 && distY < 90 && dist < menorDist) {
                            menorDist = dist;
                            maisProximo = cip;
                        }
                    }
                    if (maisProximo) {
                        jogadorAgarrado = maisProximo;
                        maisProximo.ocupado = true;
                        // Snapa o jogador na ponta
                        player.x = maisProximo.pontaX - player.w/2;
                        player.y = maisProximo.pontaY;
                        player.vx = 0;
                        player.vy = 0;
                    } else {
                        executarAtaque();
                    }
                } else if (jogadorAgarrado) {
                    // SOLTAR com impulso
                    const omega = Math.cos(jogadorAgarrado.fase) * jogadorAgarrado.anguloMax * jogadorAgarrado.velocidade;
                    const velLinear = jogadorAgarrado.comprimento * omega;
                    // Componentes tangenciais
                    player.vx = velLinear * Math.cos(jogadorAgarrado.angulo);
                    player.vy = -velLinear * Math.sin(jogadorAgarrado.angulo) - 6;
                    // Boost horizontal extra na direção do movimento
                    if (omega > 0) player.vx += 3;
                    else if (omega < 0) player.vx -= 3;

                    jogadorAgarrado.ocupado = false;
                    jogadorAgarrado = null;
                    cooldownCipo = 15;
                }
            }
            if (key === 'r') { e.preventDefault(); if (gameOver) restartGame(); }
        });
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a' || key === 'd' || key === 'w') {
                e.preventDefault(); keys[key] = false;
            }
        });

        gerarMoedas();
        resize();
        checkpointY = player.spawnY;
        gameLoop();
    </script>
</body>
