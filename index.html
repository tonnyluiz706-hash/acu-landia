<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Acuílândia</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background:#000; overflow:hidden; display:flex; justify-content:center; align-items:center; width:100vw; height:100vh; font-family:'Pixelify Sans',monospace; }
canvas { display:block; width:100vw; height:100vh; background:#000; }
#startOverlay { position:fixed; top:0; left:0; width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; z-index:2000; user-select:none; background-image:url('Home.png'); background-size:cover; background-position:center; background-repeat:no-repeat; background-color:#000; }
#startBtn { font-family:'Pixelify Sans',monospace; font-size:clamp(22px,4vw,32px); font-weight:700; letter-spacing:4px; color:#1a1a1a; padding:clamp(12px,2vh,18px) clamp(40px,8vw,70px); background:linear-gradient(180deg,#ffe066 0%,#f1c40f 50%,#c9a20a 100%); border:4px solid #8a6a00; border-radius:10px; cursor:pointer; text-shadow:0 1px 0 rgba(255,255,255,.4); box-shadow:0 0 25px rgba(241,196,15,.7),0 6px 0 #6a4a00,inset 0 2px 0 rgba(255,255,255,.5); transition:transform .1s,box-shadow .1s,filter .15s; }
#startBtn:hover { transform:translateY(-2px); filter:brightness(1.1); box-shadow:0 0 40px rgba(241,196,15,1),0 8px 0 #6a4a00,inset 0 2px 0 rgba(255,255,255,.5); }
#startBtn:active { transform:translateY(4px); box-shadow:0 0 25px rgba(241,196,15,.7),0 2px 0 #6a4a00,inset 0 2px 0 rgba(255,255,255,.5); }
#cutscene { position:fixed; top:0; left:0; width:100vw; height:100vh; background:#000; z-index:1500; overflow:hidden; display:none; }
#cutsceneVideo { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s; z-index:1; }
#cutsceneText { position:absolute; bottom:0; left:0; width:100%; background:#000; color:#fff; font-family:'Pixelify Sans',monospace; font-size:34px; font-weight:700; text-align:center; line-height:1.4; opacity:0; transition:opacity .5s; z-index:2; padding:40px 20px; min-height:20vh; display:flex; align-items:center; justify-content:center; }
#boaSorte { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#f1c40f; font-family:'Pixelify Sans',monospace; font-size:140px; font-weight:700; letter-spacing:8px; text-align:center; text-shadow:0 0 30px #f1c40f,0 0 60px #f39c12,0 0 100px #e67e22; opacity:0; transition:opacity .8s; z-index:3; user-select:none; }
#cutsceneFade { position:absolute; top:0; left:0; width:100%; height:100%; background:#000; opacity:0; pointer-events:none; transition:opacity .5s; z-index:10; }
#skipBtn { position:absolute; top:20px; right:20px; z-index:20; font-family:'Pixelify Sans',monospace; font-size:18px; font-weight:700; letter-spacing:2px; color:#fff; padding:10px 22px; background:rgba(0,0,0,.6); border:2px solid rgba(255,255,255,.85); border-radius:8px; cursor:pointer; text-shadow:0 2px 4px rgba(0,0,0,.9); box-shadow:0 0 15px rgba(0,0,0,.6); transition:all .15s; user-select:none; }
#skipBtn:hover { background:rgba(241,196,15,.95); color:#1a1a1a; border-color:#f1c40f; transform:scale(1.05); text-shadow:none; }
#skipBtn:active { transform:scale(.97); }
#skipBtn .tecla { display:inline-block; margin-left:8px; padding:2px 8px; border:1px solid currentColor; border-radius:4px; font-size:14px; opacity:.85; }
.conquista-toast { position:fixed; top:20px; left:50%; transform:translate(-50%,-250%); background:linear-gradient(135deg,#2a1f0a 0%,#4a3510 100%); border:2px solid #f1c40f; border-radius:12px; padding:14px 22px; display:flex; align-items:center; gap:14px; color:#fff; font-family:'Pixelify Sans',monospace; z-index:3000; box-shadow:0 0 30px rgba(241,196,15,.6),0 8px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15); transition:transform .55s cubic-bezier(.34,1.56,.64,1),opacity .4s; opacity:0; pointer-events:none; max-width:90vw; min-width:280px; }
.conquista-toast.mostrar { transform:translate(-50%,0); opacity:1; }
.conquista-icone { font-size:36px; filter:drop-shadow(0 0 10px #f1c40f); animation:brilharIcone 1.5s ease-in-out infinite; }
@keyframes brilharIcone { 0%,100% { filter:drop-shadow(0 0 8px #f1c40f); } 50% { filter:drop-shadow(0 0 18px #f1c40f) drop-shadow(0 0 30px #f39c12); } }
.conquista-texto { display:flex; flex-direction:column; gap:2px; }
.conquista-titulo { font-size:10px; color:#f1c40f; text-transform:uppercase; letter-spacing:3px; opacity:.85; }
.conquista-nome { font-size:19px; font-weight:700; color:#fff; }
.conquista-desc { font-size:12px; color:#d8d8d8; opacity:.9; }
#pauseBtn, #configBtnTop { position:fixed; top:20px; z-index:900; font-family:'Pixelify Sans',monospace; font-size:16px; font-weight:700; letter-spacing:2px; color:#fff; padding:10px 20px; background:rgba(0,0,0,.7); border:2px solid #f1c40f; border-radius:8px; cursor:pointer; display:none; transition:all .15s; text-shadow:0 2px 4px rgba(0,0,0,.9); box-shadow:0 0 15px rgba(0,0,0,.6); }
#pauseBtn { right:20px; }
#configBtnTop { right:170px; border-color:#88ddff; }
#pauseBtn:hover { background:#f1c40f; color:#1a1a1a; transform:scale(1.05); text-shadow:none; }
#configBtnTop:hover { background:#88ddff; color:#1a1a1a; transform:scale(1.05); text-shadow:none; }
#pauseBtn:active, #configBtnTop:active { transform:scale(.97); }
#pauseBtn.visivel, #configBtnTop.visivel { display:block; }
#pauseMenu { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,.92); z-index:2500; display:none; justify-content:center; align-items:center; padding:20px; }
#pauseMenu.aberto { display:flex; }
.pause-content { max-width:1000px; width:100%; max-height:92vh; background:linear-gradient(135deg,#1a1410 0%,#2a2018 100%); border:3px solid #f1c40f; border-radius:16px; padding:28px; overflow-y:auto; box-shadow:0 0 60px rgba(241,196,15,.4),inset 0 1px 0 rgba(255,255,255,.1); color:#fff; font-family:'Pixelify Sans',monospace; }
.pause-content::-webkit-scrollbar { width:10px; }
.pause-content::-webkit-scrollbar-track { background:rgba(0,0,0,.4); border-radius:10px; }
.pause-content::-webkit-scrollbar-thumb { background:#f1c40f; border-radius:10px; }
.pause-title { font-size:44px; color:#f1c40f; text-align:center; margin-bottom:6px; letter-spacing:6px; text-shadow:0 0 20px #f1c40f,0 0 40px rgba(241,196,15,.5); font-weight:700; }
.pause-sub { text-align:center; font-size:16px; color:#ccc; margin-bottom:22px; letter-spacing:2px; }
.pause-sub span { color:#f1c40f; font-weight:700; }
.pause-stats { display:flex; justify-content:center; gap:24px; margin-bottom:24px; flex-wrap:wrap; }
.pause-stat { text-align:center; padding:12px 22px; background:rgba(0,0,0,.4); border:2px solid rgba(241,196,15,.4); border-radius:10px; min-width:100px; }
.pause-stat-num { font-size:26px; font-weight:700; color:#f1c40f; text-shadow:0 0 10px rgba(241,196,15,.6); }
.pause-stat-label { font-size:11px; color:#aaa; letter-spacing:2px; margin-top:4px; }
.ach-section-title { font-size:20px; color:#f1c40f; letter-spacing:3px; margin:20px 0 12px; padding-bottom:8px; border-bottom:2px solid rgba(241,196,15,.3); text-transform:uppercase; font-weight:700; }
.ach-section-title.locked { color:#888; border-color:rgba(120,120,120,.3); }
.ach-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; margin-bottom:10px; }
.ach-item { display:flex; gap:12px; padding:10px 14px; background:rgba(0,0,0,.4); border:2px solid #555; border-radius:10px; align-items:center; transition:transform .15s; }
.ach-item:hover { transform:translateY(-2px); }
.ach-item.desbloqueada { border-color:#f1c40f; background:linear-gradient(135deg,#2a1f0a 0%,#4a3510 100%); box-shadow:0 0 15px rgba(241,196,15,.25); }
.ach-icon { font-size:30px; filter:grayscale(1) brightness(.45); flex-shrink:0; }
.ach-item.desbloqueada .ach-icon { filter:drop-shadow(0 0 8px #f1c40f); }
.ach-info { flex:1; min-width:0; }
.ach-name { font-size:15px; font-weight:700; color:#777; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ach-item.desbloqueada .ach-name { color:#fff; }
.ach-desc { font-size:12px; color:#555; line-height:1.3; }
.ach-item.desbloqueada .ach-desc { color:#d8d8d8; }
.pause-btn-row { display:flex; gap:15px; justify-content:center; margin-top:24px; padding-top:20px; border-top:2px solid rgba(241,196,15,.3); flex-wrap:wrap; }
.pause-action { font-family:'Pixelify Sans',monospace; font-size:18px; font-weight:700; letter-spacing:2px; color:#1a1a1a; padding:14px 36px; background:linear-gradient(180deg,#ffe066 0%,#f1c40f 50%,#c9a20a 100%); border:3px solid #8a6a00; border-radius:10px; cursor:pointer; box-shadow:0 0 20px rgba(241,196,15,.5),0 5px 0 #6a4a00,inset 0 2px 0 rgba(255,255,255,.4); transition:all .1s; }
.pause-action:hover { filter:brightness(1.1); transform:translateY(-2px); }
.pause-action:active { transform:translateY(3px); box-shadow:0 0 20px rgba(241,196,15,.5),0 2px 0 #6a4a00,inset 0 2px 0 rgba(255,255,255,.4); }
#configMenu { position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,.94); z-index:2600; display:none; justify-content:center; align-items:center; padding:20px; }
#configMenu.aberto { display:flex; }
.config-content { max-width:700px; width:100%; max-height:92vh; background:linear-gradient(135deg,#0a1a1a 0%,#102a2a 100%); border:3px solid #88ddff; border-radius:16px; padding:28px; overflow-y:auto; box-shadow:0 0 60px rgba(136,221,255,.4); color:#fff; font-family:'Pixelify Sans',monospace; }
.config-content::-webkit-scrollbar { width:10px; }
.config-content::-webkit-scrollbar-track { background:rgba(0,0,0,.4); border-radius:10px; }
.config-content::-webkit-scrollbar-thumb { background:#88ddff; border-radius:10px; }
.config-title { font-size:38px; color:#88ddff; text-align:center; margin-bottom:24px; letter-spacing:6px; text-shadow:0 0 20px #88ddff; font-weight:700; }
.config-section { margin-bottom:22px; padding:16px; background:rgba(0,0,0,.3); border:2px solid rgba(136,221,255,.25); border-radius:12px; }
.config-section-title { font-size:16px; color:#88ddff; letter-spacing:3px; text-transform:uppercase; margin-bottom:14px; font-weight:700; }
.config-row { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:8px 0; }
.config-label { font-size:16px; color:#fff; flex:1; }
.config-slider { -webkit-appearance:none; width:220px; height:10px; background:rgba(0,0,0,.5); border-radius:5px; outline:none; border:1px solid #88ddff; }
.config-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; background:#88ddff; border-radius:50%; cursor:pointer; box-shadow:0 0 12px #88ddff; }
.config-slider::-moz-range-thumb { width:22px; height:22px; background:#88ddff; border-radius:50%; cursor:pointer; border:none; box-shadow:0 0 12px #88ddff; }
.config-value { font-size:16px; color:#88ddff; font-weight:700; min-width:60px; text-align:right; }
.bind-btn { font-family:'Pixelify Sans',monospace; font-size:14px; font-weight:700; letter-spacing:2px; color:#fff; padding:8px 18px; background:rgba(0,0,0,.5); border:2px solid #88ddff; border-radius:8px; cursor:pointer; min-width:130px; transition:all .15s; }
.bind-btn:hover { background:rgba(136,221,255,.2); transform:scale(1.05); }
.bind-btn.aguardando { background:#f1c40f; color:#1a1a1a; border-color:#f1c40f; animation:piscarBind .6s infinite; }
@keyframes piscarBind { 0%,100% { opacity:1; } 50% { opacity:.5; } }
.char-picker { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.char-option { padding:12px; background:rgba(0,0,0,.4); border:3px solid #555; border-radius:10px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:8px; transition:all .15s; }
.char-option:hover { transform:translateY(-3px); border-color:#88ddff; }
.char-option.selecionado { border-color:#f1c40f; background:rgba(241,196,15,.15); box-shadow:0 0 20px rgba(241,196,15,.4); }
.char-preview { width:34px; height:34px; border-radius:6px; border:2px solid #000; }
.char-name { font-size:12px; color:#fff; font-weight:700; }
.config-close-btn { font-family:'Pixelify Sans',monospace; font-size:18px; font-weight:700; letter-spacing:2px; color:#1a1a1a; padding:14px 36px; background:linear-gradient(180deg,#a0e8ff 0%,#88ddff 50%,#4aa8cc 100%); border:3px solid #2a6a88; border-radius:10px; cursor:pointer; box-shadow:0 0 20px rgba(136,221,255,.5),0 5px 0 #1a5a78; transition:all .1s; display:block; margin:20px auto 0; }
.config-close-btn:hover { filter:brightness(1.1); transform:translateY(-2px); }
.config-close-btn:active { transform:translateY(3px); }
</style>
</head>
<body>
<div id="startOverlay"><button id="startBtn">START</button></div>
<div id="cutscene">
    <video id="cutsceneVideo" muted playsinline preload="auto"></video>
    <div id="cutsceneText"></div>
    <div id="boaSorte">BOA SORTE</div>
    <button id="skipBtn">SKIP <span class="tecla">ENTER</span></button>
    <div id="cutsceneFade"></div>
</div>
<canvas id="gameCanvas"></canvas>
<button id="pauseBtn">⏸ PAUSE (P)</button>
<button id="configBtnTop">⚙️ CONFIG</button>
<div id="pauseMenu">
    <div class="pause-content">
        <div class="pause-title">⏸ PAUSADO</div>
        <div class="pause-sub">Conquistas: <span id="pauseAchCount">0 / 31</span></div>
        <div class="pause-stats">
            <div class="pause-stat"><div class="pause-stat-num" id="pauseMoedas">0</div><div class="pause-stat-label">MOEDAS</div></div>
            <div class="pause-stat"><div class="pause-stat-num" id="pauseVidas">5</div><div class="pause-stat-label">VIDAS</div></div>
            <div class="pause-stat"><div class="pause-stat-num" id="pauseNivel">1</div><div class="pause-stat-label">NÍVEL</div></div>
        </div>
        <div id="achDesbloqueadas"></div>
        <div id="achBloqueadas"></div>
        <div class="pause-btn-row">
            <button class="pause-action" id="resumeBtn">▶ CONTINUAR</button>
        </div>
    </div>
</div>
<div id="configMenu">
    <div class="config-content">
        <div class="config-title">⚙️ CONFIGURAÇÕES</div>
        <div class="config-section">
            <div class="config-section-title">🔊 Volume</div>
            <div class="config-row">
                <span class="config-label">Volume geral</span>
                <input type="range" min="0" max="100" value="100" class="config-slider" id="volumeSlider" />
                <span class="config-value" id="volumeValue">100%</span>
            </div>
        </div>
        <div class="config-section">
            <div class="config-section-title">🎮 Personagem</div>
            <div class="char-picker" id="charPicker"></div>
        </div>
        <div class="config-section">
            <div class="config-section-title">⌨️ Controles</div>
            <div class="config-row"><span class="config-label">Mover Esquerda</span><button class="bind-btn" data-acao="esquerda">A</button></div>
            <div class="config-row"><span class="config-label">Mover Direita</span><button class="bind-btn" data-acao="direita">D</button></div>
            <div class="config-row"><span class="config-label">Pular</span><button class="bind-btn" data-acao="pular">W</button></div>
            <div class="config-row"><span class="config-label">Atacar / Cipó</span><button class="bind-btn" data-acao="atacar">ESPAÇO</button></div>
            <div class="config-row"><span class="config-label">Pause</span><button class="bind-btn" data-acao="pause">P</button></div>
            <div style="font-size:12px;color:#88ddff;opacity:.7;text-align:center;margin-top:10px;">Clique numa tecla e aperte a nova tecla. ESC cancela.</div>
        </div>
        <button class="config-close-btn" id="configCloseBtn">✔ FECHAR</button>
    </div>
</div>

<script>
// ============================================
// CONQUISTAS
// ============================================
const CONQUISTAS = {
    armado:{nome:"Armado e Perigoso",desc:"Conseguiu a espada mágica",icone:"⚔️",desbloqueada:false},
    aprendiz:{nome:"Aprendiz do Sábio",desc:"Ouviu os conselhos do velho sábio",icone:"🧙",desbloqueada:false},
    primeiroSangue:{nome:"Primeiro Sangue",desc:"Derrotou seu primeiro inimigo",icone:"🩸",desbloqueada:false},
    exterminador:{nome:"Exterminador",desc:"Derrotou TODOS os inimigos do jogo",icone:"💀",desbloqueada:false},
    tarzan:{nome:"Tarzan",desc:"Se balançou no cipó 10 vezes",icone:"🌿",desbloqueada:false},
    rico:{nome:"Rico!",desc:"Coletou 100 moedas em uma jornada",icone:"🪙",desbloqueada:false},
    perigo:{nome:"Bem-vindo ao Perigo",desc:"Chegou ao temido Nível 4",icone:"☠️",desbloqueada:false},
    cacador:{nome:"Caçador de Tesouros",desc:"Coletou TODAS as moedas do jogo",icone:"🏹",desbloqueada:false},
    lenda:{nome:"Lenda de Acuílândia",desc:"Zerou o jogo pela primeira vez",icone:"👑",desbloqueada:false},
    sobrevivente:{nome:"Sobrevivente",desc:"Zerou o jogo sem perder nenhuma vida",icone:"🛡️",desbloqueada:false},
    saltador:{nome:"Saltador",desc:"Pulou 100 vezes",icone:"🦘",desbloqueada:false},
    maratonista:{nome:"Maratonista",desc:"Percorreu 50.000 pixels no mundo",icone:"🏃",desbloqueada:false},
    morceguicida:{nome:"Caça-Morcegos",desc:"Derrotou 15 morcegos voadores",icone:"🦇",desbloqueada:false},
    invulneravel:{nome:"Invulnerável",desc:"Sobreviveu 90 segundos sem levar dano",icone:"✨",desbloqueada:false},
    colecionador:{nome:"Colecionador",desc:"Coletou 500 moedas na vida",icone:"💰",desbloqueada:false},
    magnata:{nome:"Magnata",desc:"Coletou 1500 moedas na vida",icone:"💎",desbloqueada:false},
    esquivaPerfeita:{nome:"Esquiva Perfeita",desc:"Passou por 30 bolas de fogo",icone:"🔥",desbloqueada:false},
    cipoMestre:{nome:"Mestre do Cipó",desc:"Usou o cipó 50 vezes",icone:"🐒",desbloqueada:false},
    espadaMestre:{nome:"Mestre da Espada",desc:"Lançou a espada 20 vezes",icone:"🗡️",desbloqueada:false},
    carteiro:{nome:"Leitor de Cartas",desc:"Leu a carta misteriosa",icone:"📜",desbloqueada:false},
    explorador:{nome:"Explorador",desc:"Ativou todos os checkpoints",icone:"🚩",desbloqueada:false},
    bossSlayer:{nome:"Matador de Deuses",desc:"Derrotou o Morcego Ancestral",icone:"🐲",desbloqueada:false},
    voando:{nome:"Quase Voando",desc:"Ficou 3 segundos no ar de uma vez",icone:"🕊️",desbloqueada:false},
    semDano:{nome:"Intocável",desc:"Passou perto de 5 espinhos sem morrer",icone:"🌵",desbloqueada:false},
    ninja:{nome:"Ninja Silencioso",desc:"Ficou 60 segundos sem atacar",icone:"🥷",desbloqueada:false},
    velocista:{nome:"Velocista",desc:"Chegou ao nível 5 em menos de 3 minutos",icone:"⚡",desbloqueada:false},
    curioso:{nome:"Curioso",desc:"Conversou com o sábio até o fim 3 vezes",icone:"❓",desbloqueada:false},
    resistente:{nome:"Resistente",desc:"Perdeu 30 vidas no total",icone:"💪",desbloqueada:false},
    perfeito:{nome:"Perfeição",desc:"Terminou o jogo com 9 vidas cheias",icone:"⭐",desbloqueada:false},
    mestre:{nome:"Grão-Mestre",desc:"Desbloqueou 25 conquistas",icone:"🏆",desbloqueada:false},
    lendaViva:{nome:"Lenda Viva",desc:"Desbloqueou TODAS as conquistas",icone:"🌟",desbloqueada:false}
};

let vidasPerdidasTotal = 0, moedasColetadasTotal = 0, cipoUsos = 0;
let pulosTotal = 0, distanciaTotal = 0, ultimoXTracking = 100;
let morcegosMortos = 0, moedasTotaisVida = 0, bolasEsquivadas = 0;
let espadaLancamentos = 0, tempoSemDano = 0, tempoSemAtacar = 0;
let espinhosPassados = 0, tempoNoAr = 0, tempoInicioJogo = 0;
let sabioConversasTotal = 0, jogoPausado = false;

function contarConquistas() { let n = 0; for (let k in CONQUISTAS) if (CONQUISTAS[k].desbloqueada) n++; return n; }
function totalConquistas() { return Object.keys(CONQUISTAS).length; }
function desbloquearConquista(id) {
    const c = CONQUISTAS[id]; if (!c || c.desbloqueada) return;
    c.desbloqueada = true; mostrarToastConquista(c.nome, c.desc, c.icone);
    if (contarConquistas() >= 25) desbloquearConquista('mestre');
    if (contarConquistas() >= totalConquistas()) desbloquearConquista('lendaViva');
}
function mostrarToastConquista(nome, desc, icone) {
    const toast = document.createElement('div');
    toast.className = 'conquista-toast';
    toast.innerHTML = `<div class="conquista-icone">${icone||'🏆'}</div><div class="conquista-texto"><div class="conquista-titulo">Conquista Desbloqueada!</div><div class="conquista-nome">${nome}</div><div class="conquista-desc">${desc}</div></div>`;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('mostrar'));
    setTimeout(() => { toast.classList.remove('mostrar'); setTimeout(() => toast.remove(), 600); }, 4000);
}

// ============================================
// CONFIG
// ============================================
const BINDS_PADRAO = { esquerda:'a', direita:'d', pular:'w', atacar:' ', pause:'p' };
const BINDS = { ...BINDS_PADRAO };

function conectarHomeNoGain() {
    if (homeConectado) return;

        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtxHome = new AC();
        homeAudioSource = audioCtxHome.createMediaElementSource(audioHome);

function playCutscene() {
    if (cutsceneEncerrada) return;
    if (cutsceneIndex >= cutsceneVideos.length) { mostrarBoaSorte(); return; }
    cutsceneFade.style.opacity = '0'; cutsceneText.style.opacity = '0'; cutsceneVideo.style.opacity = '0';
    let caiuNoTexto = false;
    const fallbackTexto = () => {
        if (caiuNoTexto || cutsceneEncerrada) return;
        caiuNoTexto = true;
        cutsceneVideo.style.opacity = '0';
        cutsceneText.textContent = cutsceneTexts[cutsceneIndex];
        cutsceneText.style.opacity = '1';
        setTimeout(() => { if (!caiuNoTexto || cutsceneEncerrada) return; avancarCutscene(); }, 3500);
    };
    cutsceneVideo.onerror = fallbackTexto;
    cutsceneVideo.oncanplay = () => { if (caiuNoTexto || cutsceneEncerrada) return; cutsceneVideo.style.opacity = '1'; };
    cutsceneVideo.src = cutsceneVideos[cutsceneIndex];
    cutsceneVideo.currentTime = 0; cutsceneVideo.muted = true;
    cutsceneVideo.load();
    cutsceneVideo.play().catch(() => { fallbackTexto(); });
    setTimeout(() => { if (caiuNoTexto || cutsceneEncerrada) return; cutsceneText.textContent = cutsceneTexts[cutsceneIndex]; cutsceneText.style.opacity = '1'; }, 800);
}
function avancarCutscene() {
    if (cutsceneEncerrada) return;
    cutsceneText.style.opacity = '0'; cutsceneVideo.style.opacity = '0'; cutsceneFade.style.opacity = '1';
    setTimeout(() => { if (cutsceneEncerrada) return; cutsceneIndex++; if (cutsceneIndex >= cutsceneVideos.length) mostrarBoaSorte(); else playCutscene(); }, 550);
}
function pularCutscene() {
    if (cutsceneEncerrada || !cutsceneIniciada || jogoIniciado) return;
    if (cutsceneDiv.style.display === 'none') return;
    cutsceneEncerrada = true;

    criarParticulas(player.x + player.w/2, player.y + player.h/2, 20, '#88ddff', 6, 25);
    espadaLancamentos++;
}
function updateEspadaLancada() {
    if (!espadaLancada) return;
    espadaLancada.frames++;
    espadaLancada.angulo += .55;
    if (!espadaLancada.voltando) {
        espadaLancada.x += espadaLancada.vx;
        for (let mob of mobs) {
            if (mob.morto) continue;
            const dx = espadaLancada.x - mob.x, dy = espadaLancada.y - mob.y;
            if (Math.sqrt(dx*dx + dy*dy) < mob.radius + 25) {
                criarMorteAnim(mob); mob.hp = 0; mob.morto = true;
                criarParticulas(mob.x, mob.y, 30, mob.color, 6, 40);
                criarParticulas(mob.x, mob.y, 15, '#ffffff', 3, 20);
                desbloquearConquista('primeiroSangue');
                if (mob.tipo === 'voador') morcegosMortos++;
                espadaLancada.voltando = true;
                break;
            }
        }
        if (espadaLancada && boss.ativo && !boss.morto) {
            for (let m of boss.morcegos) {
                if (m.morto) continue;
                const dx = espadaLancada.x - m.x, dy = espadaLancada.y - m.y;
                if (Math.sqrt(dx*dx + dy*dy) < m.radius + 25) {
                    criarMorteAnim(m); m.morto = true;
                    criarParticulas(m.x, m.y, 20, m.color, 5, 30);
                    morcegosMortos++; espadaLancada.voltando = true; break;
                }
            }
        }
        if (espadaLancada && boss.ativo && !boss.morto && boss.fase === 'lutando') {
            if (Math.abs(espadaLancada.x - boss.x) < boss.w/2 + 30 && Math.abs(espadaLancada.y - boss.y) < boss.h/2 + 30) {
                boss.hp -= 150; boss.hitFlash = 12;
                criarParticulas(boss.x, boss.y, 40, '#ff3366', 8, 40);
                criarParticulas(boss.x, boss.y, 20, '#ffffff', 4, 25);
                if (boss.hp < 0) boss.hp = 0;
                espadaLancada.voltando = true;
            }
        }
        if (espadaLancada && espadaLancada.frames > 45) espadaLancada.voltando = true;
        if (espadaLancada && (espadaLancada.x < cameraX - 200 || espadaLancada.x > cameraX + W + 200)) espadaLancada.voltando = true;
    } else {
        const px = player.x + player.w/2, py = player.y + player.h/2;
        const dx = px - espadaLancada.x, dy = py - espadaLancada.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 40) { criarParticulas(px, py, 10, '#88ddff', 4, 15); espadaLancada = null; }
        else { const vel = 24; espadaLancada.x += (dx/dist)*vel; espadaLancada.y += (dy/dist)*vel; }
    }
}

function moedaPertoDeEspinho(x, y) {
    for (let e of ESPINHOS) {
        const dx = Math.abs(x - (e.x + e.w/2));
        const dy = Math.abs(y - e.y);
        if (dx < 80 && dy < 60) return true;
    }
    return false;
}
function moedaPertoDoBoss(x) { return x > 92000; }
function gerarMoedas() {
    moedasArray = [];
    const raioMoeda = 12, espacamentoChao = 150;
    for (let x = 100; x < WORLD_WIDTH - 100; x += espacamentoChao) {
        if (estaSobreBuraco(x)) continue;
        if (moedaPertoDoBoss(x)) continue;
        const yMoeda = chaoY - 15;
        if (moedaPertoDeEspinho(x, yMoeda)) continue;
        let noChao = false;
        for (let plat of platforms) {
            if (plat.y === chaoY && x > plat.x && x < plat.x + plat.width) { noChao = true; break; }
        }
        if (noChao) moedasArray.push({ x, y:yMoeda, raio:raioMoeda, coletada:false, fase:Math.random()*Math.PI*2 });
    }
    for (let plat of platforms) {
        if (plat.y === chaoY) continue;
        const alturaAcimaChao = chaoY - plat.y;
        if (alturaAcimaChao > 180) continue;
        const xCentro = plat.x + plat.width/2;
        const yMoeda = plat.y - 15;
        if (moedaPertoDeEspinho(xCentro, yMoeda)) continue;
        if (moedaPertoDoBoss(xCentro)) continue;
        moedasArray.push({ x:xCentro, y:yMoeda, raio:raioMoeda, coletada:false, fase:Math.random()*Math.PI*2 });
    }
}

const VISAO_ALCANCE = 250;                 // Alcance curto (era 420)
const VISAO_MEIO_ANGULO = Math.PI / 5;     // Cone estreito (~72° total, era ~128°)

function mobVePlayer(mob) {
    if (mob.morto || mob.caindo) return false;
    const pCX = player.x + player.w / 2;
    const pCY = player.y + player.h / 2;
    const dx = pCX - mob.x;
    const dy = pCY - mob.y;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > VISAO_ALCANCE) return false;
    if (dist < 35) return true; // Colado, sempre vê

    // Player precisa estar na direção que o mob olha
    const playerNaFrente = (mob.direction === 1 && dx > 0) || (mob.direction === -1 && dx < 0);
    if (!playerNaFrente) return false;

    const angulo = Math.atan2(dy, Math.abs(dx));
    return Math.abs(angulo) < VISAO_MEIO_ANGULO;
}

function mobPodeAvancar(mob) {
    const proxX = mob.x + (mob.speed + 15) * mob.direction;
    if (proxX < mob.minX || proxX > mob.maxX) return false;
    for (let b of BURACOS) if (proxX > b.inicio && proxX < b.fim) return false;
    return true;
}

        mobs[i].walkPhase = Math.random()*Math.PI*2;
        mobs[i].hitFlash = 0; mobs[i].aggro = 0; mobs[i].dustTimer = 0;
        if (mobs[i].tipo === 'terrestre') mobs[i].y = chaoY - mobs[i].radius;
    }
    espadaLancada = null; segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0;
    podeLancarEspada = false;
    carta.ativa = false; carta.caiu = false; carta.coletada = false;
    passaroCarta.ativo = false; passaroCarta.soltou = false;
    boss.ativo = false; boss.morto = false; boss.fase = 'inativo'; boss.timer = 0;
    boss.hp = boss.hpMax; boss.bolasFogo = []; boss.morcegos = [];
    boss.invocacoesFeitas = [false, false];
    boss.cooldownTiro = 180; boss.carregando = 0; boss.bocaAberta = 0;
    boss.flutuacaoOffset = 0; boss.rotacaoCorpo = 0; boss.hitFlash = 0;
    fadeFinal = 0; finalIniciado = false;
    mostrarTituloNivel5 = false; contadorTituloNivel5 = 0;
    dialogo.ativo = false; dialogo.index = 0; dialogo.timer = 0;
    cameraX = player.x - W/2;
    cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));
    tempoSemDano = 0; tempoSemAtacar = 0; tempoNoAr = 0;
    tempoInicioJogo = performance.now(); ultimoXTracking = player.x;
    jogoPausado = false;
    pauseMenu.classList.remove('aberto');
    efeitoMorteAtivo = false; screenShake = 0; flashMorte = 0;
}

function atualizarNivel() {
    if (nivelAtual === 1 && player.x > 6200) { nivelAtual = 2; mostrarTituloNivel2 = true; contadorTituloNivel2 = 0; }
    if (nivelAtual === 2 && player.x > 9500) { nivelAtual = 3; mostrarTituloNivel3 = true; contadorTituloNivel3 = 0; }
    if (nivelAtual === 3 && player.x > 48000) { nivelAtual = 4; mostrarTituloNivel4 = true; contadorTituloNivel4 = 0; desbloquearConquista('perigo'); }
    if (nivelAtual === 4 && player.x > 85000) {
        nivelAtual = 5;
        mostrarTituloNivel5 = true; contadorTituloNivel5 = 0;
        const tempoDecorrido = (performance.now() - tempoInicioJogo) / 1000;
        if (tempoDecorrido < 180) desbloquearConquista('velocista');
        if (!passaroCarta.ativo && !carta.coletada) {
            passaroCarta.ativo = true; passaroCarta.x = player.x + 1000; passaroCarta.y = chaoY - 400;
            passaroCarta.fase = 0; passaroCarta.soltou = false; passaroCarta.saiu = false;
        }
    }
}

function update() {
    tempoGlobal++;
    atualizarCenario();
    atualizarEfeitoMorte();
    if (nivelConcluido || isResizing || gameOver || jogoPausado) return;
    if (cooldownCipo > 0) cooldownCipo--;

    if (jogadorAgravado) {
        player.x = jogadorAgravado.pontaX - player.w/2;
        player.y = jogadorAgravado.pontaY;
        player.vx = 0; player.vy = 0; player.onGround = false;
    } else {
        if (keys.a) { player.vx = -player.speed; ultimaDirecao = -1; }
        else if (keys.d) { player.vx = player.speed; ultimaDirecao = 1; }
        else player.vx = 0;
        player.x += player.vx;
        if (player.x < 0) player.x = 0;
        if (player.x + player.w > WORLD_WIDTH) player.x = WORLD_WIDTH - player.w;
        if (barreiraAtiva && player.x + player.w > barreiraX && player.x < barreiraX) player.x = barreiraX - player.w;
        if (keys.w && player.onGround) {
            player.vy = player.jumpPower; player.onGround = false; playerSquash = -.3;
            pulosTotal++;
            criarParticulas(player.x + player.w/2, player.y + player.h, 8, '#ffffff', 3, 15);
        }
        player.vy += player.gravity;
        player.y += player.vy;
        player.onGround = false;
        for (let plat of platforms) {
            if (player.x + player.w > plat.x && player.x < plat.x + plat.width) {
                if (player.vy >= 0 && player.y + player.h >= plat.y && player.y + player.h <= plat.y + plat.height + player.vy + 2) {
                    player.y = plat.y - player.h; player.vy = 0; player.onGround = true;
                }
            }
        }
        for (let pp of PLATAFORMAS_PODRES) {
            if (pp.destruida) continue;
            if (player.x + player.w > pp.x && player.x < pp.x + pp.w) {
                if (player.vy >= 0 && player.y + player.h >= pp.y && player.y + player.h <= pp.y + pp.h + player.vy + 2) {
                    player.y = pp.y - player.h; player.vy = 0; player.onGround = true;
                    if (!pp.tremendo) { pp.tremendo = true; pp.tempoPisada = 0; }
                }
            }
        }
        for (let canhao of CANHOES) {
            const topoY = canhao.y - 55, left = canhao.x - 25, right = canhao.x + 25;
            if (player.x + player.w > left && player.x < right) {
                if (player.vy >= 0 && player.y + player.h >= topoY && player.y + player.h <= topoY + 20 + player.vy) {
                    player.y = topoY - player.h; player.vy = 0; player.onGround = true;
                }
            }
            if (player.y + player.h > topoY + 30 && player.y < chaoY - 10) {
                if (player.x + player.w > left && player.x < right) {
                    const dE = Math.abs(player.x + player.w - left), dD = Math.abs(right - player.x);
                    if (dE < dD) player.x = left - player.w; else player.x = right;
                }
            }
        }
        if (player.onGround && !playerNoChaoAnterior) {
            playerSquash = .35;
            criarParticulas(player.x + player.w/2, player.y + player.h, 6, '#e8d5a0', 2, 12);
        }
        playerNoChaoAnterior = player.onGround;
        if (!player.onGround && player.vy > 0 && player.y > chaoY + 30) {
            for (let b of BURACOS) if (player.x + player.w > b.inicio && player.x < b.fim) { resetPlayer(); return; }
        }
    }
    playerSquash *= .82;

    for (let pp of PLATAFORMAS_PODRES) {
        if (pp.destruida) { pp.respawn++; if (pp.respawn > 300) { pp.destruida = false; pp.tremendo = false; pp.tempoPisada = 0; pp.respawn = 0; pp.alpha = 1; } continue; }
        if (pp.tremendo) {
            pp.tempoPisada++; pp.alpha = 1 - (pp.tempoPisada/120)*.5;
            if (pp.tempoPisada > 120) { pp.destruida = true; criarParticulas(pp.x + pp.w/2, pp.y + pp.h/2, 15, '#8a5a30', 4, 30); }
        }
    }
    for (let cip of CIPOS) {
        cip.fase += cip.velocidade;
        cip.angulo = Math.sin(cip.fase)*cip.anguloMax;
        cip.pontaX = cip.ancoraX + Math.sin(cip.angulo)*cip.comprimento;
        cip.pontaY = cip.ancoraY + Math.cos(cip.angulo)*cip.comprimento;
    }

    for (let canhao of CANHOES) {
        canhao.cooldown--;
        if (canhao.recoil > 0) canhao.recoil--;
        if (canhao.fireGlow > 0) canhao.fireGlow--;
        if (canhao.cooldown <= 0) {
            bolasDeFogo.push({ x:canhao.x, y:canhao.y + 5, vx:canhao.direcao*5, raio:15, vida:200 });
            canhao.recoil = 12; canhao.fireGlow = 10; canhao.cooldown = canhao.cooldownMax;
            for (let i = 0; i < 8; i++) particulas.push({ x:canhao.x + canhao.direcao*30 + (Math.random()-.5)*20, y:canhao.y - 5 + (Math.random()-.5)*20, vx:canhao.direcao*(2+Math.random()*2), vy:-1-Math.random()*2, vida:30, vidaMax:30, cor:Math.random()>.5?'#666':'#999', tamanho:4+Math.random()*4 });
        }
    }
    for (let i = bolasDeFogo.length - 1; i >= 0; i--) {
        const b = bolasDeFogo[i];
        b.x += b.vx; b.vida--;
        if (tempoGlobal % 3 === 0) particulas.push({ x:b.x, y:b.y, vx:(Math.random()-.5), vy:(Math.random()-.5), vida:15, vidaMax:15, cor:Math.random()>.5?'#ff8c00':'#ffcc00', tamanho:4+Math.random()*3 });
        if (b.x < cameraX - 200 || b.x > cameraX + W + 200 || b.vida <= 0) { bolasDeFogo.splice(i, 1); bolasEsquivadas++; }
    }

    // ============================================
    // MOBS — VISÃO JUSTA + DELAY DE REAÇÃO
    // ============================================
    for (let mob of mobs) {
        if (mob.morto) continue;
        if (mob.walkPhase === undefined) mob.walkPhase = Math.random()*Math.PI*2;
        if (mob.hitFlash === undefined) mob.hitFlash = 0;
        if (mob.aggro === undefined) mob.aggro = 0;
        if (mob.dustTimer === undefined) mob.dustTimer = 0;
        if (mob.estado === undefined) mob.estado = 'patrulha';
        if (mob.tempoSemVer === undefined) mob.tempoSemVer = 0;
        if (mob.tempoProcurando === undefined) mob.tempoProcurando = 0;
        if (mob.tempoNoticing === undefined) mob.tempoNoticing = 0;

        if (mob.hitFlash > 0) mob.hitFlash--;

        const vePlayerAgora = mobVePlayer(mob);

        // ============ MÁQUINA DE ESTADOS ============
        if (mob.estado === 'patrulha') {
            mob.chasing = false;
            mob.aggro = Math.max(0, mob.aggro - 0.08);
            mob.tempoNoticing = 0;
            if (vePlayerAgora) {
                // Começa a "notar" o player (delay de reação)
                mob.estado = 'notando';
            }
        } else if (mob.estado === 'notando') {
            mob.chasing = false;
            mob.aggro = Math.min(0.5, mob.aggro + 0.05);
            mob.tempoNoticing++;
            if (!vePlayerAgora) {
                mob.estado = 'patrulha';
                mob.tempoNoticing = 0;
            } else if (mob.tempoNoticing >= NOTICING_FRAMES) {
                mob.estado = 'perseguindo';
                mob.tempoSemVer = 0;
                mob.aggro = 0.7;
            }
        } else if (mob.estado === 'perseguindo') {
            mob.chasing = true;
            mob.aggro = Math.min(1, mob.aggro + 0.12);
            if (vePlayerAgora) {
                mob.tempoSemVer = 0;
            } else {
                mob.tempoSemVer++;
                if (mob.tempoSemVer > PERDE_VISAO_FRAMES) {
                    mob.estado = 'procurando';
                    mob.tempoProcurando = 0;
                    mob.chasing = false;
                }
            }
        } else if (mob.estado === 'procurando') {
            mob.chasing = false;
            mob.aggro = Math.max(0.25, mob.aggro - 0.02);
            if (vePlayerAgora) {
                mob.estado = 'perseguindo';
                mob.tempoSemVer = 0;
            } else {
                mob.tempoProcurando++;
                if (mob.tempoProcurando > PROCURA_FRAMES) {
                    mob.estado = 'patrulha';
                    mob.aggro = 0;
                    mob.tempoProcurando = 0;
                }
            }
        }

        if (mob.caindo) {
            mob.vy += 0.55;
            mob.y += mob.vy;
            mob.walkPhase += 0.4;
            if (mob.y > chaoY + 400) {
                criarMorteAnim(mob); mob.morto = true;
                criarParticulas(mob.x, chaoY + 100, 25, mob.color, 5, 40);
            }
            continue;
        }

        let morreuEspinho = false;
        for (let e of ESPINHOS) {
            if (mob.x + mob.radius > e.x && mob.x - mob.radius < e.x + e.w &&
                mob.y + mob.radius > e.y && mob.y - mob.radius < e.y + e.h) {
                morreuEspinho = true; break;
            }
        }
        if (morreuEspinho) {
            criarMorteAnim(mob); mob.morto = true;
            criarParticulas(mob.x, mob.y, 30, mob.color, 6, 40);
            criarParticulas(mob.x, mob.y, 15, '#ff5533', 4, 25);
            continue;
        }

        if (mob.knockbackX !== 0 || mob.knockbackY !== 0) {
            mob.x += mob.knockbackX; mob.y += mob.knockbackY;
            mob.knockbackX *= .85; mob.knockbackY *= .85;
            if (Math.abs(mob.knockbackX) < .1) mob.knockbackX = 0;
            if (Math.abs(mob.knockbackY) < .1) mob.knockbackY = 0;
            if (mob.y > chaoY - mob.radius && mob.tipo === 'terrestre') { mob.y = chaoY - mob.radius; mob.knockbackY = 0; }
            if (mob.knockbackX === 0 && mob.knockbackY === 0) mob.emKnockback = false;
            if (mob.x < mob.minX) { mob.x = mob.minX; mob.direction = 1; mob.knockbackX = 0; mob.emKnockback = false; }
            if (mob.x > mob.maxX) { mob.x = mob.maxX; mob.direction = -1; mob.knockbackX = 0; mob.emKnockback = false; }
            continue;
        }

        if (mob.tipo === 'terrestre') {
            let sobreBuraco = false;
            for (let b of BURACOS) {
                if (mob.x > b.inicio && mob.x < b.fim) { sobreBuraco = true; break; }
            }
            if (sobreBuraco) { mob.caindo = true; mob.vy = 2; continue; }
        }

        if (mob.chasing) {
            const playerCX = player.x + player.w/2, playerCY = player.y + player.h/2;
            const distX = playerCX - mob.x;
            const distY = playerCY - mob.y;

            if (mob.tipo === 'terrestre') {
                const dirX = distX > 0 ? 1 : -1;
                const vel = mob.speed * 1.75;
                const proxX = mob.x + dirX * vel;
                let sobreBuraco = false;
                for (let b of BURACOS) {
                    if (proxX + mob.radius > b.inicio && proxX - mob.radius < b.fim) { sobreBuraco = true; break; }
                }
                if (!sobreBuraco) {
                    mob.x += dirX * vel;
                    mob.direction = dirX;
                    mob.walkPhase += mob.speed * 0.35;
                    mob.dustTimer++;
                    if (mob.dustTimer > 8) {
                        mob.dustTimer = 0;
                        particulas.push({ x:mob.x + (Math.random()-.5)*mob.radius, y:chaoY - 3, vx:(Math.random()-.5)*2, vy:-.8-Math.random(), vida:18, vidaMax:18, cor:'#c9b088', tamanho:3+Math.random()*3 });
                    }
                }
                mob.y = chaoY - mob.radius;
            } else {
                const d = Math.sqrt(distX*distX + distY*distY) || 1;
                const vel = mob.speed * 1.3;
                mob.x += (distX / d) * vel;
                mob.y += (distY / d) * vel;
                mob.direction = distX > 0 ? 1 : -1;
                mob.fase += 0.15;
            }
        } else {
            if (mob.tipo === 'terrestre') {
                mob.walkPhase += mob.speed * 0.18;
                mob.dustTimer++;
                if (mob.dustTimer > 18) {
                    mob.dustTimer = 0;
                    particulas.push({ x:mob.x + (Math.random()-.5)*mob.radius, y:chaoY - 3, vx:(Math.random()-.5)*1.5, vy:-.5-Math.random()*.8, vida:20, vidaMax:20, cor:'#c9b088', tamanho:2+Math.random()*3 });
                }
                if (!mobPodeAvancar(mob)) { mob.direction *= -1; }
                else {
                    mob.x += mob.speed * mob.direction;
                    if (mob.x > mob.maxX || mob.x < mob.minX) {
                        mob.direction *= -1;
                        if (mob.x < mob.minX) mob.x = mob.minX;
                        if (mob.x > mob.maxX) mob.x = mob.maxX;
                    }
                }
                mob.y = chaoY - mob.radius;
            } else {
                mob.x += mob.speed * mob.direction;
                if (mob.x > mob.maxX || mob.x < mob.minX) {
                    mob.direction *= -1;
                    if (mob.x < mob.minX) mob.x = mob.minX;
                    if (mob.x > mob.maxX) mob.x = mob.maxX;
                }
                mob.fase += .03;
                const dartOffset = mob.aggro * Math.sin(tempoGlobal*.15 + mob.fase)*12;
                const yAlvo = (chaoY - 100) + Math.sin(mob.fase)*mob.amplitude + dartOffset;
                mob.y += (yAlvo - mob.y) * 0.08;
            }
        }
    }

    if (atacando) { ataqueTimer++; if (ataqueTimer > DURACAO_ATAQUE) atacando = false; }

    for (let m of moedasArray) {
        if (m.coletada) continue;
        const dx = (player.x + player.w/2) - m.x, dy = (player.y + player.h/2) - m.y;
        if (Math.sqrt(dx*dx + dy*dy) < m.raio + 20) {
            m.coletada = true; moedas++; moedasColetadasTotal++; moedasTotaisVida++;
            criarParticulas(m.x, m.y, 12, '#ffd700', 3, 20);
            if (moedas >= 100) {
                moedas -= 100;
                if (vidas < MAX_VIDAS) { vidas++; criarParticulas(player.x + player.w/2, player.y, 25, '#ff6b6b', 5, 30); }
            }
            if (moedasColetadasTotal >= 100) desbloquearConquista('rico');
            let todas = true;
            for (let mm of moedasArray) if (!mm.coletada) { todas = false; break; }
            if (todas) desbloquearConquista('cacador');
        }
    }

    checkCollisions(); checkEspinhos(); checkBolasDeFogo(); checkCheckpoints();

    const distH = Math.abs((player.x + player.w/2) - (sabio.x + sabio.largura/2));
    if (distH < 120 && checkpoints[0].ativado && !sabio.conversaTerminada && !sabio.conversaAtiva) iniciarConversa();
    updateConversa();
    atualizarNivel();

    if (passaroCarta.ativo && !carta.caiu) {
        passaroCarta.fase += .35; passaroCarta.x += passaroCarta.vx;
        passaroCarta.y = chaoY - 400 + Math.sin(passaroCarta.fase)*20;
        if (!passaroCarta.soltou && passaroCarta.x < player.x + 250) {
            passaroCarta.soltou = true; carta.ativa = true;
            carta.x = passaroCarta.x; carta.y = passaroCarta.y; carta.vy = 0;
        }
        if (passaroCarta.x < cameraX - 200) passaroCarta.ativo = false;
    }
    if (carta.ativa && !carta.caiu) {
        carta.vy += .4; carta.y += carta.vy;
        if (carta.y >= chaoY - 20) { carta.y = chaoY - 20; carta.caiu = true; }
    }
    if (carta.caiu && !carta.coletada && !dialogo.ativo) {
        const dx = (player.x + player.w/2) - carta.x, dy = (player.y + player.h/2) - carta.y;
        if (Math.sqrt(dx*dx + dy*dy) < 60) {
            carta.coletada = true;
            criarParticulas(carta.x, carta.y, 25, '#fff8c4', 5, 40);
            desbloquearConquista('carteiro');
            iniciarDialogo(CARTA_TEXTO, () => { podeLancarEspada = true; }, '📜 Carta Misteriosa');
        }
    }

    if (nivelAtual === 5 && !boss.ativo && !finalIniciado && player.x > 92800) {
        boss.ativo = true; boss.x = 93800; boss.y = chaoY - 180;
        boss.fase = 'aparecendo'; boss.timer = 0;
        player.x = 92300; player.vx = 0; player.vy = -6;
        criarParticulas(player.x + player.w/2, player.y + player.h/2, 30, '#ffffff', 8, 30);
        for (let i = 0; i < 25; i++) particulas.push({ x:player.x + (Math.random()-.5)*200, y:chaoY - Math.random()*100, vx:(Math.random()-.5)*4, vy:-Math.random()*5, vida:40, vidaMax:40, cor:'#333', tamanho:4+Math.random()*4 });
    }

    if (boss.ativo && !boss.morto) {
        boss.timer++; boss.batidaAsa += .15;
        if (boss.hitFlash > 0) boss.hitFlash--;
        if (boss.fase === 'aparecendo') {
            if (boss.timer > 90) {
                boss.fase = 'falando'; boss.timer = 0;
                iniciarDialogo(boss.falas, () => { boss.fase = 'lutando'; boss.timer = 0; boss.cooldownTiro = 180; }, '🦇 ???');
            }
        } else if (boss.fase === 'lutando') {
            boss.flutuacaoOffset = Math.sin(boss.timer*.035)*30;
            boss.y = chaoY - 180 + boss.flutuacaoOffset;
            boss.rotacaoCorpo = Math.sin(boss.timer*.02)*.05;
            const alvoX = player.x + player.w/2, diffX = alvoX - boss.x;
            if (Math.abs(diffX) > 250) boss.x += Math.sign(diffX)*.7;
            if (boss.carregando > 0) {
                boss.carregando--; boss.bocaAberta = Math.min(1, boss.bocaAberta + .05);
                if (boss.carregando % 5 === 0) particulas.push({ x:boss.x + (Math.random()-.5)*40, y:boss.y + 20 + (Math.random()-.5)*20, vx:(Math.random()-.5)*3, vy:(Math.random()-.5)*3, vida:20, vidaMax:20, cor:Math.random()>.5?'#ff2200':'#ffaa00', tamanho:4+Math.random()*3 });
                if (boss.carregando === 0) {
                    const dx = player.x + player.w/2 - boss.x, dy = player.y + player.h/2 - (boss.y + 20);
                    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
                    boss.bolasFogo.push({ x:boss.x, y:boss.y + 20, vx:(dx/dist)*5.5, vy:(dy/dist)*5.5, raio:22, vida:300 });
                    criarParticulas(boss.x, boss.y + 20, 25, '#ff6622', 6, 30);
                    boss.bocaAberta = 0; boss.cooldownTiro = 180 + Math.floor(Math.random()*120);
                }
            } else {
                boss.bocaAberta = Math.max(0, boss.bocaAberta - .05);
                boss.cooldownTiro--;
                if (boss.cooldownTiro <= 0) boss.carregando = 45;
            }
            const hpRatio = boss.hp / boss.hpMax;
            if (hpRatio <= 2/3 && !boss.invocacoesFeitas[0]) { boss.invocacoesFeitas[0] = true; invocarMorcegos(5); criarParticulas(boss.x, boss.y, 40, '#5d4a7a', 7, 50); }
            if (hpRatio <= 1/3 && !boss.invocacoesFeitas[1]) { boss.invocacoesFeitas[1] = true; invocarMorcegos(5); criarParticulas(boss.x, boss.y, 40, '#5d4a7a', 7, 50); }
            const coracaoX = boss.x, coracaoY = boss.y + boss.flutuacaoOffset*.3;
            const dxB = (player.x + player.w/2) - coracaoX, dyB = (player.y + player.h/2) - coracaoY;
            if (Math.sqrt(dxB*dxB + dyB*dyB) < boss.w*.32) { resetPlayer(); return; }
        }
        if (boss.hp <= 0 && boss.fase !== 'morrendo' && boss.fase !== 'morto') {
            boss.fase = 'morrendo'; boss.timer = 0;
            criarParticulas(boss.x, boss.y, 60, '#ff3366', 9, 60);
            criarParticulas(boss.x, boss.y, 40, '#ffffff', 6, 45);
        }
        if (boss.fase === 'morrendo' && boss.timer > 120) {
            boss.fase = 'morto'; boss.morto = true;
            desbloquearConquista('lenda');
            desbloquearConquista('bossSlayer');
            if (vidasPerdidasTotal === 0) desbloquearConquista('sobrevivente');
            if (vidas === MAX_VIDAS) desbloquearConquista('perfeito');
        }
        for (let i = boss.bolasFogo.length - 1; i >= 0; i--) {
            const b = boss.bolasFogo[i];
            b.x += b.vx; b.y += b.vy; b.vida--;
            if (tempoGlobal % 2 === 0) particulas.push({ x:b.x - b.vx*2, y:b.y - b.vy*2, vx:(Math.random()-.5)*2, vy:(Math.random()-.5)*2, vida:20, vidaMax:20, cor:Math.random()>.5?'#ffcc00':'#ff6600', tamanho:5+Math.random()*4 });
            const dx = (player.x + player.w/2) - b.x, dy = (player.y + player.h/2) - b.y;
            if (Math.sqrt(dx*dx + dy*dy) < player.w/2 + b.raio) { boss.bolasFogo.splice(i, 1); resetPlayer(); return; }
            if (b.vida <= 0 || b.x < cameraX - 400 || b.x > cameraX + W + 400) boss.bolasFogo.splice(i, 1);
        }
        for (let m of boss.morcegos) {
            if (m.morto) continue;
            if (m.hitFlash > 0) m.hitFlash--;
            const dx = (player.x + player.w/2) - m.x, dy = (player.y + player.h/2) - m.y;
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            m.x += (dx/dist)*m.speed; m.y += (dy/dist)*m.speed;
            m.fase += .4; m.dartFase = m.fase*1.5;
            if (dist < player.w/2 + m.radius) { resetPlayer(); return; }
            if (espadaLancada && !espadaLancada.voltando) {
                const ex = espadaLancada.x - m.x, ey = espadaLancada.y - m.y;
                if (Math.sqrt(ex*ex + ey*ey) < m.radius + 25) {
                    criarMorteAnim(m); m.morto = true;
                    criarParticulas(m.x, m.y, 20, m.color, 5, 30);
                    morcegosMortos++; espadaLancada.voltando = true;
                }
            }
        }
    }

    if (boss.morto && !finalIniciado && player.x + player.w > caverna.x + 120) finalIniciado = true;
    if (finalIniciado) { fadeFinal += .008; if (fadeFinal > 1) fadeFinal = 1; }
    updateEspadaLancada();

    if (segurandoAtaque && podeLancarEspada && temEspada && !espadaLancada && !jogadorAgravado && inicioHold > 0) {
        tempoSegurando++;
        if (performance.now() - inicioHold >= TEMPO_HOLD_MS) { lancarEspada(); segurandoAtaque = false; tempoSegurando = 0; inicioHold = 0; }
    }
    if (sabio.desaparecendo && sabio.alpha > 0) { sabio.alpha -= .008; if (sabio.alpha < 0) sabio.alpha = 0; }
    atualizarParticulas();
    atualizarMorteAnims();

    cameraX = player.x - W/2;
    cameraX = Math.max(0, Math.min(cameraX, WORLD_WIDTH - W));

    if (mostrarTitulo) { contadorTitulo++; if (contadorTitulo > 120) mostrarTitulo = false; }
    if (mostrarTituloNivel2) { contadorTituloNivel2++; if (contadorTituloNivel2 > 120) mostrarTituloNivel2 = false; }
    if (mostrarTituloNivel3) { contadorTituloNivel3++; if (contadorTituloNivel3 > 120) mostrarTituloNivel3 = false; }
    if (mostrarTituloNivel4) { contadorTituloNivel4++; if (contadorTituloNivel4 > 120) mostrarTituloNivel4 = false; }
    if (mostrarTituloNivel5) { contadorTituloNivel5++; if (contadorTituloNivel5 > 120) mostrarTituloNivel5 = false; }

    const dxTrack = Math.abs(player.x - ultimoXTracking);
    if (dxTrack < 200) distanciaTotal += dxTrack;
    ultimoXTracking = player.x;
    if (distanciaTotal >= 50000) desbloquearConquista('maratonista');
    tempoSemDano++; if (tempoSemDano >= 90*60) desbloquearConquista('invulneravel');
    if (temEspada) { tempoSemAtacar++; if (tempoSemAtacar >= 60*60) desbloquearConquista('ninja'); }
    if (!player.onGround && !jogadorAgravado) { tempoNoAr++; if (tempoNoAr >= 3*60) desbloquearConquista('voando'); }
    else tempoNoAr = 0;
    if (moedasTotaisVida >= 500) desbloquearConquista('colecionador');
    if (moedasTotaisVida >= 1500) desbloquearConquista('magnata');
    if (bolasEsquivadas >= 30) desbloquearConquista('esquivaPerfeita');
    if (morcegosMortos >= 15) desbloquearConquista('morceguicida');
    if (espadaLancamentos >= 20) desbloquearConquista('espadaMestre');
    if (cipoUsos >= 50) desbloquearConquista('cipoMestre');
    if (pulosTotal >= 100) desbloquearConquista('saltador');
    if (vidasPerdidasTotal >= 30) desbloquearConquista('resistente');
    for (let e of ESPINHOS) {
        if (e._contado) continue;
        const dist = Math.abs((player.x + player.w/2) - (e.x + e.w/2));
        if (dist < 40 && player.y + player.h >= chaoY - 10 && player.onGround) {
            e._contado = true; espinhosPassados++;
            if (espinhosPassados >= 5) desbloquearConquista('semDano');
        }
    }
    let todosCps = true;
    for (let cp of checkpoints) if (!cp.ativado) { todosCps = false; break; }
    if (todosCps) desbloquearConquista('explorador');
}

// ============================================
// ============ PERSONAGEM QUADRADO DE VOLTA ============
// ============================================
function desenharPlayerNovo(px, py, w, h) {
    const cor = personagemSelecionado.cor;
    const corEsc = personagemSelecionado.corStroke;
    const corClara = personagemSelecionado.corClara;

    // Squash/stretch
    const sw = w * (1 + playerSquash * 0.5);
    const sh = h * (1 - playerSquash * 0.5);
    const sx2 = px + (w - sw) / 2;
    const sy2 = py + (h - sh);

    // Ataque progresso 0 → 1 (0-0.28 puxa, 0.28-0.55 bate, 0.55-1 volta)
    const atkProg = atacando ? ataqueTimer / DURACAO_ATAQUE : 0;

    // Angulo do braço direito
    let armAngle = 0;
    if (atacando) {
        if (atkProg < 0.28) armAngle = -(atkProg / 0.28) * 1.2;
        else if (atkProg < 0.55) armAngle = -1.2 + ((atkProg - 0.28) / 0.27) * 2.8;
        else armAngle = 1.6 * (1 - (atkProg - 0.55) / 0.45);
    }

    // SOMBRA
    if (!jogadorAgravado) {
        ctx.fillStyle = 'rgba(0,0,0,.32)';
        ctx.beginPath();
        ctx.ellipse(px + w/2, chaoY + 3, w * 0.55 * (1 - playerSquash * 0.4), 4.5, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.save();
    ctx.translate(sx2 + sw/2, sy2 + sh/2);

    const half = sw / 2;
    const halfH = sh / 2;

    // ============ BRAÇO ESQUERDO (atrás do corpo) ============
    const shoulderY = -halfH * 0.15;
    const armLen = halfH * 0.85;
    ctx.strokeStyle = corEsc;
    ctx.lineWidth = Math.max(4, half * 0.28);
    ctx.lineCap = 'round';
    let maoEsqX, maoEsqY;
    if (!player.onGround) {
        ctx.beginPath();
        ctx.moveTo(-half - 2, shoulderY);
        ctx.lineTo(-half - 10, shoulderY - 12);
        ctx.stroke();
        maoEsqX = -half - 10; maoEsqY = shoulderY - 12;
    } else {
        const armSwingL = -Math.sin(tempoGlobal * 0.15) * 3;
        ctx.beginPath();
        ctx.moveTo(-half - 2, shoulderY);
        ctx.lineTo(-half - 8, shoulderY + armLen + armSwingL);
        ctx.stroke();
        maoEsqX = -half - 8; maoEsqY = shoulderY + armLen + armSwingL;
    }
    // Mão
    ctx.fillStyle = corEsc;
    ctx.beginPath(); ctx.arc(maoEsqX, maoEsqY, half * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();

    // ============ CORPO (QUADRADO) ============
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 14;
    const gradBody = ctx.createLinearGradient(-half, -halfH, half, halfH);
    gradBody.addColorStop(0, corClara);
    gradBody.addColorStop(0.5, cor);
    gradBody.addColorStop(1, corEsc);
    ctx.fillStyle = gradBody;
    ctx.strokeStyle = corEsc;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(-half, -halfH, sw, sh, 8);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Brilho no canto
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.ellipse(-half * 0.35, -halfH * 0.4, half * 0.35, halfH * 0.22, -0.3, 0, Math.PI * 2);
    ctx.fill();

    // ============ BRAÇO DIREITO (com ataque) ============
    ctx.save();
    ctx.translate(half + 2, shoulderY);
    ctx.rotate(armAngle);
    ctx.strokeStyle = corEsc;
    ctx.lineWidth = Math.max(4, half * 0.28);
    ctx.lineCap = 'round';

    let maoDirX, maoDirY;
    if (!player.onGround && !atacando) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(10, -12);
        ctx.stroke();
        maoDirX = 10; maoDirY = -12;
    } else {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(8, armLen);
        ctx.stroke();
        maoDirX = 8; maoDirY = armLen;
    }
    // Mão direita
    ctx.fillStyle = corEsc;
    ctx.beginPath(); ctx.arc(maoDirX, maoDirY, half * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();

    // ============ ESPADA NA MÃO ============
    if (temEspada && !espadaLancada) {
        ctx.save();
        ctx.translate(maoDirX, maoDirY);
        ctx.rotate(-0.5);
        const escala = half / 18;

        // Cabo
        ctx.fillStyle = '#5a3a1a';
        ctx.strokeStyle = '#3a1a00';
        ctx.lineWidth = 1.5;
        ctx.fillRect(-2 * escala, 0, 4 * escala, 8 * escala);
        ctx.strokeRect(-2 * escala, 0, 4 * escala, 8 * escala);
        // Pombo
        ctx.fillStyle = '#d4a44a';
        ctx.beginPath(); ctx.arc(0, 9 * escala, 2.5 * escala, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        // Guarda
        ctx.fillStyle = '#d4a44a';
        ctx.fillRect(-7 * escala, -3 * escala, 14 * escala, 3 * escala);
        ctx.strokeRect(-7 * escala, -3 * escala, 14 * escala, 3 * escala);
        // Lâmina
        const gradL = ctx.createLinearGradient(0, 0, 0, -28 * escala);
        gradL.addColorStop(0, '#e8f4ff'); gradL.addColorStop(0.5, '#b8d8ee'); gradL.addColorStop(1, '#aaddff');
        ctx.fillStyle = gradL;
        ctx.strokeStyle = '#4a7a9a';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-2.5 * escala, -3 * escala);
        ctx.lineTo(-2 * escala, -26 * escala);
        ctx.lineTo(0, -34 * escala);
        ctx.lineTo(2 * escala, -26 * escala);
        ctx.lineTo(2.5 * escala, -3 * escala);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // Brilho
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        ctx.lineWidth = 0.7;
        ctx.beginPath(); ctx.moveTo(0, -3 * escala); ctx.lineTo(0, -31 * escala); ctx.stroke();
        // Aura mágica
        ctx.shadowColor = '#66ccff'; ctx.shadowBlur = 12;
        ctx.strokeStyle = 'rgba(120,220,255,0.85)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, -3 * escala); ctx.lineTo(0, -31 * escala); ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    // Efeito de arco de golpe
    if (atacando && atkProg > 0.28 && atkProg < 0.7) {
        const t = (atkProg - 0.28) / 0.42;
        const alpha = (1 - Math.abs(t - 0.5) * 2) * 0.85;
        ctx.save();
        ctx.strokeStyle = `rgba(150,230,255,${alpha})`;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#66ccff';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(half + 2, shoulderY, halfH * 1.05, -Math.PI * 0.9 + armAngle, -Math.PI * 0.1 + armAngle);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
    }

    ctx.restore();

    // ============ OLHOS ============
    const eyeSize = sw * 0.22;
    const eyeOffset = sw * 0.20;
    const olharX = ultimaDirecao * sw * 0.03;
    const olharY = player.vy < -3 ? -3 : (player.vy > 3 ? 2 : 0);
    const baseY = -sh * 0.10;

    // Branco dos olhos
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(-eyeOffset - eyeSize/2 + olharX, baseY - eyeSize/2 + olharY, eyeSize, eyeSize, 3);
    ctx.roundRect(eyeOffset - eyeSize/2 + olharX, baseY - eyeSize/2 + olharY, eyeSize, eyeSize, 3);
    ctx.fill();
    ctx.stroke();

    // Pupilas
    ctx.fillStyle = '#2c3e50';
    const pupil = eyeSize * 0.45;
    ctx.beginPath();
    ctx.roundRect(-eyeOffset - pupil/2 + olharX * 1.5, baseY - pupil/2 + olharY * 1.3, pupil, pupil, 2);
    ctx.roundRect(eyeOffset - pupil/2 + olharX * 1.5, baseY - pupil/2 + olharY * 1.3, pupil, pupil, 2);
    ctx.fill();

    // Brilho nas pupilas
    ctx.fillStyle = '#fff';
    const brilho = pupil * 0.3;
    ctx.beginPath();
    ctx.arc(-eyeOffset - pupil/2 + brilho * 0.8 + olharX * 1.5, baseY - pupil/2 + brilho * 0.8 + olharY * 1.3, brilho, 0, Math.PI * 2);
    ctx.arc(eyeOffset - pupil/2 + brilho * 0.8 + olharX * 1.5, baseY - pupil/2 + brilho * 0.8 + olharY * 1.3, brilho, 0, Math.PI * 2);
    ctx.fill();

    // ============ BOCA ============
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    if (atacando) {
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(0, sh * 0.20, sw * 0.08, sh * 0.10, 0, 0, Math.PI * 2);
        ctx.fill();
    } else if (player.vy < -2) {
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath();
        ctx.ellipse(0, sh * 0.20, sw * 0.08, sh * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
    } else if (Math.abs(player.vx) > 0.5 && player.onGround) {
        ctx.beginPath();
        ctx.arc(0, sh * 0.12, sw * 0.18, 0.15, Math.PI - 0.15);
        ctx.stroke();
    } else {
        ctx.beginPath();
        ctx.arc(0, sh * 0.14, sw * 0.13, 0.2, Math.PI - 0.2);
        ctx.stroke();
    }

    // Boas-vindas rosadas
    ctx.fillStyle = 'rgba(255,120,160,0.45)';
    ctx.beginPath();
    ctx.ellipse(-sw * 0.32, sh * 0.12, sw * 0.10, sh * 0.06, 0, 0, Math.PI * 2);
    ctx.ellipse(sw * 0.32, sh * 0.12, sw * 0.10, sh * 0.06, 0, 0, Math.PI * 2);
    ctx.fill();

    // ============ CHAPÉU / TOPETE ============
    ctx.fillStyle = corEsc;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-half * 0.85, -halfH + 2);
    ctx.quadraticCurveTo(-half * 0.5, -halfH - 18, 0, -halfH - 14);
    ctx.quadraticCurveTo(half * 0.6, -halfH - 18, half * 0.85, -halfH + 2);
    ctx.lineTo(half * 0.7, -halfH + 6);
    ctx.quadraticCurveTo(0, -halfH - 6, -half * 0.7, -halfH + 6);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // Brilho no topete
    ctx.fillStyle = corClara;
    ctx.beginPath();
    ctx.ellipse(-half * 0.15, -halfH - 10, half * 0.32, 3, -0.15, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// ============================================
// DESENHOS DE MOBS
// ============================================
function desenharOrc(mx, my, mob) {
    const r = mob.radius;
    const walkPhase = mob.walkPhase !== undefined ? mob.walkPhase : (tempoGlobal*.18 + mob.fase);
    const legSwing = Math.sin(walkPhase), armSwing = -legSwing;
    const bodyBob = Math.abs(Math.cos(walkPhase))*r*.08;
    const breathe = 1 + Math.sin(tempoGlobal*.06 + mob.fase)*.04;
    const aggro = mob.aggro || 0;
    const hitFlash = mob.hitFlash || 0;
    const blinkCycle = (tempoGlobal*.5 + mob.x*.07) % 200;
    const blink = blinkCycle < 7 ? 1 : 0;
    const pele = mob.color, peleEsc = mob.stroke;
    ctx.save();
    ctx.translate(mx, my + bodyBob);
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(0, r*.95 - bodyBob, r*(.85 + (breathe-1)*.5), r*.14, 0, 0, Math.PI*2); ctx.fill();
    const legBaseY = r*.15, legLen = r*.65;
    const legLeftY = legSwing*r*.12, legRightY = -legSwing*r*.12;
    ctx.fillStyle = pele; ctx.strokeStyle = peleEsc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-r*.32, legBaseY + legLen/2 + legLeftY, r*.19, legLen/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r*.32, legBaseY + legLen/2 + legRightY, r*.19, legLen/2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#3a2010'; ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-r*.32, legBaseY + legLen + legLeftY, r*.27, r*.15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(r*.32, legBaseY + legLen + legRightY, r*.27, r*.15, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#6b3a1a'; ctx.strokeStyle = '#3a1a00'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r*.75, r*.2); ctx.lineTo(r*.75, r*.2); ctx.lineTo(r*.6, r*.55); ctx.lineTo(-r*.6, r*.55);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2a1200'; ctx.fillRect(-r*.78, r*.15, r*1.56, r*.12);
    ctx.fillStyle = '#c9a961'; ctx.beginPath(); ctx.arc(0, r*.21, r*.1, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2a1200'; ctx.beginPath(); ctx.arc(0, r*.21, r*.045, 0, Math.PI*2); ctx.fill();
    ctx.save();
    ctx.translate(-r*.72, -r*.35); ctx.rotate(armSwing*.4);
    ctx.fillStyle = pele; ctx.strokeStyle = peleEsc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, r*.35, r*.17, r*.4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = peleEsc; ctx.beginPath(); ctx.arc(0, r*.75, r*.21, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1a0800'; ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.translate(r*.72, -r*.35); ctx.rotate(-armSwing*.4);
    ctx.fillStyle = pele; ctx.strokeStyle = peleEsc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, r*.35, r*.17, r*.4, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = peleEsc; ctx.beginPath(); ctx.arc(0, r*.75, r*.21, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1a0800'; ctx.stroke();
    ctx.restore();
    ctx.save(); ctx.scale(breathe, 2 - breathe);
    ctx.fillStyle = pele; ctx.strokeStyle = peleEsc; ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, -r*.15, r*.8, r*.68, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.restore();
    ctx.fillStyle = '#3a2010'; ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(-r*.78, -r*.55, r*.28, r*.2, -.25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#909090';
    ctx.beginPath(); ctx.moveTo(-r*.95, -r*.65); ctx.lineTo(-r*1.05, -r*1.0); ctx.lineTo(-r*.78, -r*.68); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#404040'; ctx.stroke();
    ctx.fillStyle = '#3a2010'; ctx.strokeStyle = '#1a0800';
    ctx.beginPath(); ctx.ellipse(r*.78, -r*.55, r*.28, r*.2, .25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#909090';
    ctx.beginPath(); ctx.moveTo(r*.95, -r*.65); ctx.lineTo(r*1.05, -r*1.0); ctx.lineTo(r*.78, -r*.68); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#404040'; ctx.stroke();
    const headBob = Math.abs(Math.sin(walkPhase*.5))*r*.04;
    const headShake = aggro * Math.sin(tempoGlobal*.3)*r*.02;
    ctx.save();
    ctx.translate(headShake, -headBob);
    ctx.fillStyle = pele; ctx.strokeStyle = peleEsc; ctx.lineWidth = 2.5;
    ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.ellipse(0, -r*1.0, r*.58, r*.55, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = pele; ctx.strokeStyle = peleEsc; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -r*.78, r*.42, r*.24, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    const earTwitch = aggro*Math.sin(tempoGlobal*.4)*.15;
    ctx.beginPath(); ctx.moveTo(-r*.5, -r*1.2); ctx.lineTo(-r*(.85+earTwitch), -r*1.6); ctx.lineTo(-r*.32, -r*1.35); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*.5, -r*1.2); ctx.lineTo(r*(.85+earTwitch), -r*1.6); ctx.lineTo(r*.32, -r*1.35); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    const browAnger = -aggro*r*.15;
    ctx.beginPath(); ctx.moveTo(-r*.42, -r*1.2 + browAnger); ctx.lineTo(-r*.08, -r*1.02 + browAnger); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*.42, -r*1.2 + browAnger); ctx.lineTo(r*.08, -r*1.02 + browAnger); ctx.stroke();
    ctx.lineCap = 'butt';
    if (!blink) {
        ctx.fillStyle = '#fff8e0';
        ctx.beginPath();
        ctx.ellipse(-r*.22, -r*1.0, r*.15, r*.13, 0, 0, Math.PI*2);
        ctx.ellipse(r*.22, -r*1.0, r*.15, r*.13, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = aggro > .5 ? '#ff1100' : '#ff2200';
        ctx.shadowColor = '#ff2200'; ctx.shadowBlur = 8 + aggro*8;
        ctx.beginPath();
        ctx.arc(-r*.22, -r*1.0, r*.075, 0, Math.PI*2);
        ctx.arc(r*.22, -r*1.0, r*.075, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-r*.24, -r*1.03, r*.03, 0, Math.PI*2);
        ctx.arc(r*.2, -r*1.03, r*.03, 0, Math.PI*2);
        ctx.fill();
    } else {
        ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-r*.35, -r*1.0); ctx.lineTo(-r*.1, -r*1.0);
        ctx.moveTo(r*.1, -r*1.0); ctx.lineTo(r*.35, -r*1.0);
        ctx.stroke();
    }
    ctx.fillStyle = '#3a5a1a';
    ctx.beginPath(); ctx.ellipse(0, -r*.88, r*.1, r*.075, 0, 0, Math.PI*2); ctx.fill();
    const mouthOpen = aggro*r*.12;
    ctx.strokeStyle = '#1a0800'; ctx.lineWidth = 2.5;
    if (mouthOpen > 2) {
        ctx.fillStyle = '#2a0000';
        ctx.beginPath(); ctx.ellipse(0, -r*.68, r*.2, mouthOpen, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(-r*.12, -r*.68-mouthOpen*.5); ctx.lineTo(-r*.06, -r*.68-mouthOpen*.5-mouthOpen*.4); ctx.lineTo(0, -r*.68-mouthOpen*.5); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r*.06, -r*.68-mouthOpen*.5); ctx.lineTo(r*.12, -r*.68-mouthOpen*.5-mouthOpen*.4); ctx.lineTo(r*.18, -r*.68-mouthOpen*.5); ctx.closePath(); ctx.fill();
    } else {
        ctx.beginPath(); ctx.moveTo(-r*.26, -r*.72); ctx.quadraticCurveTo(0, -r*.6, r*.26, -r*.72); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(180,40,30,.75)';
    ctx.fillRect(-r*.45, -r*.92, r*.14, r*.05); ctx.fillRect(-r*.45, -r*.82, r*.14, r*.05);
    ctx.fillRect(r*.31, -r*.92, r*.14, r*.05); ctx.fillRect(r*.31, -r*.82, r*.14, r*.05);
    ctx.restore();
    if (hitFlash > 0) {
        const alphaFlash = Math.min(.7, hitFlash/12);
        ctx.fillStyle = `rgba(255,255,255,${alphaFlash})`;
        ctx.beginPath(); ctx.ellipse(0, -r*.5, r*1.1, r*1.35, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function desenharMorcego(mx, my, mob) {
    const r = mob.radius;
    const asaBat = Math.sin(tempoGlobal*.5 + mob.fase);
    const dir = mob.direction >= 0 ? 1 : -1;
    const hitFlash = mob.hitFlash || 0;
    const aggro = mob.aggro || 0;
    const bodyBob = Math.sin(tempoGlobal*.18 + mob.fase)*4;
    const earTwitch = Math.sin(tempoGlobal*.07 + mob.x*.08) > .85 ? .3 : 0;
    const eyePulse = .75 + Math.sin(tempoGlobal*.2 + mob.fase)*.25;
    const sway = Math.sin(tempoGlobal*.12 + mob.fase)*.15;
    ctx.save();
    ctx.translate(mx, my + bodyBob); ctx.scale(dir, 1); ctx.rotate(sway);
    ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = mob.stroke;
    for (let i = 1; i <= 2; i++) {
        const b = asaBat*(1 - i*.3);
        ctx.beginPath(); ctx.moveTo(-r*.4, -r*.2); ctx.quadraticCurveTo(-r*1.3, -r*(.9+b*.5), -r*2.1, -r*(.3+b*1.0)); ctx.lineTo(-r*1.7, -r*.05); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(r*.4, -r*.2); ctx.quadraticCurveTo(r*1.3, -r*(.9+b*.5), r*2.1, -r*(.3+b*1.0)); ctx.lineTo(r*1.7, -r*.05); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = mob.color; ctx.strokeStyle = mob.stroke; ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(-r*.4, -r*.2); ctx.quadraticCurveTo(-r*1.3, -r*(.9+asaBat*.5), -r*2.1, -r*(.3+asaBat*1.0));
    ctx.lineTo(-r*1.7, -r*.05);
    ctx.quadraticCurveTo(-r*1.55, r*.15, -r*1.45, r*.05);
    ctx.quadraticCurveTo(-r*1.25, r*.25, -r*1.1, r*.1);
    ctx.quadraticCurveTo(-r*.9, r*.35, -r*.75, r*.15);
    ctx.quadraticCurveTo(-r*.6, r*.35, -r*.45, r*.1);
    ctx.lineTo(-r*.4, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r*.4, -r*.2); ctx.quadraticCurveTo(r*1.3, -r*(.9+asaBat*.5), r*2.1, -r*(.3+asaBat*1.0));
    ctx.lineTo(r*1.7, -r*.05);
    ctx.quadraticCurveTo(r*1.55, r*.15, r*1.45, r*.05);
    ctx.quadraticCurveTo(r*1.25, r*.25, r*1.1, r*.1);
    ctx.quadraticCurveTo(r*.9, r*.35, r*.75, r*.15);
    ctx.quadraticCurveTo(r*.6, r*.35, r*.45, r*.1);
    ctx.lineTo(r*.4, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, r*.55, r*.75, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -r*.7, r*.45, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*.35, -r*.95); ctx.lineTo(-r*(.55+earTwitch*.5), -r*1.5); ctx.lineTo(-r*.1, -r*1.0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*.35, -r*.95); ctx.lineTo(r*(.55+earTwitch*.5), -r*1.5); ctx.lineTo(r*.1, -r*1.0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = aggro > .5 ? '#ff3300' : '#ffeb3b';
    ctx.shadowColor = aggro > .5 ? '#ff3300' : '#ffeb3b';
    ctx.shadowBlur = (10 + aggro*10)*eyePulse;
    ctx.beginPath();
    ctx.arc(-r*.18, -r*.7, r*.13*eyePulse, 0, Math.PI*2);
    ctx.arc(r*.18, -r*.7, r*.13*eyePulse, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(-r*.18, -r*.7, r*.06, 0, Math.PI*2);
    ctx.arc(r*.18, -r*.7, r*.06, 0, Math.PI*2);
    ctx.fill();
    if (hitFlash > 0) {
        const alphaFlash = Math.min(.75, hitFlash/12);
        ctx.fillStyle = `rgba(255,255,255,${alphaFlash})`;
        ctx.beginPath(); ctx.arc(0, -r*.4, r*1.6, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function desenharConeVisao(mob) {
    if (mob.morto || mob.caindo) return;
    // Só desenha em estado de patrulha (não perseguindo)
    if (mob.estado !== 'patrulha' && mob.estado !== 'notando') return;
    const mx = mob.x - cameraX;
    if (mx < -VISAO_ALCANCE - 50 || mx > W + VISAO_ALCANCE + 50) return;
    const my = mob.y;
    
    // Cone de visão (semicírculo achatado na direção que olha)
    ctx.save();
    ctx.translate(mx, my);
    ctx.scale(mob.direction, 1); // espelha se olhando pra esquerda
    
    // Gradiente do cone
    const grad = ctx.createRadialGradient(0, 0, 20, 0, 0, VISAO_ALCANCE);
    grad.addColorStop(0, 'rgba(255, 80, 40, 0.0)');
    grad.addColorStop(0.6, 'rgba(255, 80, 40, 0.08)');
    grad.addColorStop(1, 'rgba(255, 80, 40, 0.0)');
    ctx.fillStyle = grad;
    
    // Desenha o cone
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, VISAO_ALCANCE, -VISAO_MEIO_ANGULO, VISAO_MEIO_ANGULO);
    ctx.closePath();
    ctx.fill();
    
    // Borda do cone (linha sutil)
    ctx.strokeStyle = 'rgba(255, 80, 40, 0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(-VISAO_MEIO_ANGULO) * VISAO_ALCANCE, Math.sin(-VISAO_MEIO_ANGULO) * VISAO_ALCANCE);
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(VISAO_MEIO_ANGULO) * VISAO_ALCANCE, Math.sin(VISAO_MEIO_ANGULO) * VISAO_ALCANCE);
    ctx.stroke();
    
    // Arco final
    ctx.beginPath();
    ctx.arc(0, 0, VISAO_ALCANCE, -VISAO_MEIO_ANGULO, VISAO_MEIO_ANGULO);
    ctx.stroke();
    
    ctx.restore();
}

function desenharSimboloMob(mob) {
    if (mob.morto) return;
    const mx = mob.x - cameraX;
    if (mx < -100 || mx > W + 100) return;
    const my = mob.y;
    const r = mob.radius;

    if (mob.estado === 'perseguindo' || mob.estado === 'notando') {
        const aggro = mob.aggro || 0;
        if (aggro > 0.35) {
            const aggroY = my - r * 2.6 - aggro * 12;
            const bounce = Math.sin(tempoGlobal * 0.5) * 4;
            ctx.font = 'bold 34px "Pixelify Sans", monospace';
            ctx.textAlign = 'center';
            ctx.fillStyle = `rgba(255,60,30,${aggro})`;
            ctx.shadowColor = '#ff2200';
            ctx.shadowBlur = 20 + Math.sin(tempoGlobal * 0.3) * 8;
            ctx.fillText('!', mx, aggroY + bounce);
            ctx.shadowBlur = 0;
            ctx.textAlign = 'left';
        }
    } else if (mob.estado === 'procurando') {
        const t = mob.tempoProcurando;
        const aparecer = Math.min(1, t / 15);
        const flut = Math.sin(tempoGlobal * 0.15) * 4;
        const aggroY = my - r * 2.6 + flut;
        ctx.font = 'bold 34px "Pixelify Sans", monospace';
        ctx.textAlign = 'center';
        ctx.globalAlpha = aparecer;
        ctx.fillStyle = '#ffd700';
        ctx.shadowColor = '#ffaa00';
        ctx.shadowBlur = 18 + Math.sin(tempoGlobal * 0.2) * 6;
        ctx.fillText('?', mx, aggroY);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
    }
}
